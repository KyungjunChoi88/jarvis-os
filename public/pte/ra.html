gen and oxygen in water molecules."}, {"id": "420", "title": "Effects of Alcohol", "text": "The evidence for the harmful effects of alcohol on brain health is compelling, but now experts have pinpointed three key time periods in life when the effects of alcohol are likely to be at their greatest."}, {"id": "419", "title": "Stretchable System", "text": "A stretchable system that can harvest energy from human breathing and motion for use in wearable health monitoring devices may be possible, according to an international team of researchers."}, {"id": "418", "title": "Smellicopter", "text": "A team has developed Smellicopter: an autonomous drone that uses a live antenna from a moth to navigate toward smells. Smellicopter can also sense and avoid obstacles as it travels through the air."}, {"id": "417", "title": "Natural Networks", "text": "Neural networks are some of the most important tools in AI. So far, they run on traditional processors in the form of adaptive software, but experts are working on an alternative concept, the 'neuromorphic computer'. In this case, neurons are not simulated by software but reconstructed in hardware components. A team of researchers has now demonstrated a new approach to such hardware - targeted magnetic waves that are generated and divided in micrometer-sized wafers."}, {"id": "416", "title": "Electric Current", "text": "Almost 200 years after French physicist Jean Peltier discovered that electric current flowing through the junction of two different metals could be used to produce a heating or cooling effect, researchers say it is time to step up efforts to find new materials for the thermoelectric cooling market."}, {"id": "415", "title": "Black Hole", "text": "Researchers used the Frontera supercomputer to model for the first time a black hole merger of two black holes with very different sizes (128:1). The research required seven months of constant computation. The results predict the gravitational waves such a merger would produce, as well as characteristics of the resulting merged black hole."}, {"id": "414", "title": "Planet Nine", "text": "Astronomers think planets can exist in orbits far from their star, and propose a two-step process: interactions with the star or inner planets kick it out of the inner system, and then a passing star stabilizes the orbit to keep it bound. Such a scenario could explain the hypothesized 'Planet Nine' in our solar system. Astronomers have now confirmed that one binary star system, HD 106906, has a planet in a bound, highly eccentric orbit."}, {"id": "413", "title": "Burial", "text": "Was burial of the dead practiced by Neanderthals or is it an innovation specific to our species? Researchers have demonstrated, using a variety of criteria, that a Neanderthal child was buried, probably around 41,000 years ago, at the Ferrassie site (Dordogne, France)."}, {"id": "412", "title": "Superhighway Network", "text": "Researchers have discovered a new superhighway network to travel through the Solar System much faster than was previously possible. Such routes can drive comets and asteroids near Jupiter to Neptune's distance in under a decade and to 100 astronomical units in less than a century. They could be used to send spacecraft to the far reaches of our planetary system relatively fast, and to monitor and understand near-Earth objects that might collide with our planet."}, {"id": "411", "title": "Lagerpetids", "text": "With the help of newly discovered skulls and skeletons that were unearthed in North America, Brazil, Argentina, and Madagascar in recent years, researchers have demonstrated that a group of 'dinosaur precursors,' called lagerpetids, are the closest relatives of pterosaurs."}, {"id": "410", "title": "Hidden Law of Nature", "text": "New research provides a solution for the century-and-half-old puzzle of why capillary condensation, a fundamentally microscopic phenomenon involving a few molecular layers of water, can be described reasonably well using macroscopic equations and macroscopic characteristics of bulk water. Is it a coincidence or a hidden law of nature?"}, {"id": "409", "title": "Gambling Scenario", "text": "New research has shown robots can encourage humans to take greater risks in a simulated gambling scenario than they would if there was nothing to influence their behaviors. Increasing our understanding of whether robots can affect risk- taking could have clear ethical, practical and policy implications, which this study set out to explore."}, {"id": "408", "title": "Protein", "text": "A single protein is a master regulator of mouse muscle function during aging, a new study finds. Blocking this protein increased muscle strength and endurance in old animals. It may play a role in age-related muscle weakening in humans."}, {"id": "407", "title": "Battery", "text": "Scientists have improved a promising battery technology, creating a single-crystal, nickel-rich cathode that is hardier and more efficient than before. It's one step toward improved lithium-ion batteries that are common in electric vehicles today. Increasing nickel content in the cathode is on the drawing board of lithium-ion battery"}, {"id": "406", "title": "Evolutionary Cousins", "text": "Compared to chimpanzees, our closest evolutionary cousins, humans are particularly prone to developing advanced carcinomas -- the type of tumors that include prostate, breast, lung and colorectal cancers -- even in the absence of known risk factors, such as genetic predisposition or tobacco use. A recent study helps explain why."}, {"id": "405", "title": "Mice", "text": "A new study in mice finds that a high-fat diet allows cancer cells to outcompete immune cells for fuel, impairing immune function and accelerating tumor growth. Cancer cells do so by rewiring their metabolisms to increase fat consumption. Blocking this rewiring enhances anti-tumor immunity. The findings suggest new strategies to target cancer metabolism and improve immunotherapies."}, {"id": "404", "title": "Memory Coding", "text": "Two new studies shed new light on how the brain encodes time and place into memories. The findings not only add to the body of fundamental research on memory, but could eventually provide the basis for new treatments to combat memory loss from conditions such as traumatic brain injury or Alzheimer's disease."}, {"id": "403", "title": "Amoeba", "text": "Researchers have, inspired by the efficient foraging behavior of a single-celled amoeba, developed an analog computer for finding a reliable and swift solution to the traveling salesman problem — a representative combinatorial optimization problem."}, {"id": "402", "title": "Thymus", "text": "Researchers have rebuilt a human thymus, an essential organ in the immune system, using human stem cells and a bioengineered scaffold. Their work is an important step towards being able to build artificial thymi which could be used as transplants."}, {"id": "401", "title": "Infection", "text": "An analysis of ten different species finds that humans — followed by ferrets and to a lesser extent cats civets and dogs — are the most susceptible animals to SARS-CoV-2 infection."}, {"id": "400", "title": "Mass Extinctions", "text": "Mass extinctions of land-dwelling animals — including amphibians, reptiles, mammals, and birds —follow a cycle of about 27 million years, coinciding with previously reported mass extinctions of ocean life, according to a new analysis."}, {"id": "399", "title": "Global Collapse", "text": "The global collapse of frogs and other amphibians due to the amphibian chytrid fungus exacerbated malaria outbreaks in Costa Rica and Panama during the 1990s and 2000s, according to new research. The findings provide the first evidence that amphibian population declines have directly affected human health and show how preserving biodiversity can benefit humans as well as local ecosystems."}, {"id": "398", "title": "Chasing the Flame", "text": "It is precisely in observing the intertwinings of success and failure that Chasing the Flame makes its greatest mark. With piercing insight and relentless logic, it reveals the pitfalls of international politics and details an intricate struggle between individual and institution. It haunts us with the poignant truth that even a great man can do only so much to reinvent the world."}, {"id": "397", "title": "Fake News", "text": "Fake news can distort people's beliefs even after being debunked. For example, repeated over and over, a story such as the one about the Pope endorsing Trump can create a glow around a political candidate that persists long after the story is exposed as fake. A 2017 study published in the journal Intelligence suggests that some people may have an especially difficult time rejecting misinformation."}, {"id": "396", "title": "Madagascar", "text": "Scientists have recommended actions the government of Madagascar's recently elected president, Andry Rajoelina should take to turn around the precipitous decline of biodiversity and help put Madagascar on a trajectory towards sustainable growth. Madagascar's protected areas, some of the most important for biodiversity in the world, have suffered terribly in recent years from illegal mining, logging, and collection of threatened species for the pet trade."}, {"id": "395", "title": "US Market", "text": "The United States is at present the world's market for motor cars and trucks. An agent for the U.S. Bureau of Foreign and Domestic Commerce reports a prosperous condition of affairs prevailing in Japan, which is buying more automobiles, especially large cars, than ever before."}, {"id": "394", "title": "Problem of Funding", "text": "The most important issue is concerned with the problem of funding. Social services receive different donations or grants from the government. However, these sums are not sufficient for the solution of all problems. The second most important issue consists in the huge spending. The money social services achieve is not enough for normal functioning. The third problem, affecting human services, is the lack of skilled and experienced employees."}, {"id": "393", "title": "Noninvasive Brain Stimulation", "text": "Noninvasive brain stimulation is having its heyday, as scientists and hobbyists alike look for ways to change the activity of neurons without cutting into the brain and implanting electrodes. Next, the researchers wanted to figure out how much current they needed to apply to the human scalp to produce those electrical fields inside the brain."}, {"id": "392", "title": "Statistical Information (B)", "text": "The provision of accurate and authoritative statistical information strengthens our society. It provides a basis for decisions to be made on public policy, such as determining electoral boundaries and where to locate schools and hospitals. It also allows businesses to know their market, grow their business, and improve their marketing strategies by targeting their activities appropriately."}, {"id": "391", "title": "Moon", "text": "The asteroid that slammed into the moon 3.8 billion years ago creating the Imbrium Basin may have had a diameter of at least 150 miles, according to a new estimate. The work helps explain puzzling geological features on the moon's near side, and has implications for understanding the evolution of the early solar system."}, {"id": "390", "title": "Toasted Food", "text": "When we put toast in the toaster or add marshmallows to the top of our sweet potatoes for a baked holiday dish we expect them to turn brown and to develop a sweet, caramelized flavor. Although we expect it to happen, do you know why certain foods take on these new colors and flavors as they are toasted?"}, {"id": "389", "title": "Ear Fluid", "text": "Normally, if we spin around in an office chair and suddenly stop, we feel like we're still moving. That's because fluid in the inner ear responsible for detecting movement continues to whirl around due to inertia, making your brain think it's still in motion. In this activity you will explore the reaction that creates these tasty, toasty treats and experiment with speeding up and slowing down the process."}, {"id": "388", "title": "USA Uniforms", "text": "For the designers and engineers who spend years crafting Team USA's uniforms to offer both style and extraordinary aerodynamics, the need to keep athletes warm in these extreme temperatures posed an added dimension of difficulty."}, {"id": "387", "title": "Sexual Infections", "text": "Roughly one million sexually transmitted infections are exchanged each day. If untreated, they can lead to cervical cancer, pelvic inflammatory disease and infertility. However, people are often reluctant to ask their doctors to test for such infections, so Eve Medical in Toronto developed a kit for women to screen themselves."}, {"id": "386", "title": "Flu Season", "text": "This flu season is a particularly severe one, and it's not over yet — health officials say flu activity will likely remain elevated for at least several more weeks. But if you already caught the flu, are you in the clear for the rest of the season?"}, {"id": "385", "title": "School Shooting", "text": "Current policy responses do not address the fundamental question of why so many mass shootings take place in schools. To answer this question, we need to get to the heart of how students experience school and the meaning that schools have in American life. While some of these measures seem sensible, overall there is little empirical evidence that such security measures decrease the likelihood of school shootings."}, {"id": "384", "title": "Disease Model", "text": "The disease model remains dominant in the U.S. because of its stakeholders. First, the rehab industry, worth an estimated 35 billion dollars per year, uses the disease nomenclature in a vast majority of its ads and slogans. Despite consistently low success rates, that's not likely to stop because it pulls in the cash. Second, as long as addiction is labeled a disease, medical insurance providers can be required to pay for it."}, {"id": "383", "title": "The Royal Institution", "text": "The Royal Institution is an organization that has been around for 209 years. Many of the people that have worked here have been scientists themselves, including Michael Faraday. He made the discoveries that may be generating a using electricity much easier, making it possible for us all to switch on lights, cook for dinner, play games consoles much more."}, {"id": "382", "title": "Self-motivation", "text": "Research on motivation has suggested that a strong sense of autonomy is the key to developing the healthy self-motivation that allows children and teens to pursue their goals with passion and to enjoy their achievements. But what we see in many of the kids we test or tutor is motivational patterns that are at the extremes of one, an obsessive drive to succeed and two, seeing little point in working hard."}, {"id": "381", "title": "Naked Biome", "text": "Hopefully, this will treat and prevent acne and other skin diseases and reduce antibiotic use. Naked Biome is entering clinical trials to see if its approach is safe and effective."}, {"id": "380", "title": "Starry Night", "text": "Nature offers no greater splendor than the starry sky on a clear, dark night. Silent, timeless, jeweled with the constellations of ancient myth and legend, the night sky has inspired wonder throughout the ages — a wonder that leads our imaginations far from the confines of Earth and the pace of present day, out into boundless space and cosmic time itself."}, {"id": "379", "title": "Original thesis", "text": "A thesis is a claim that you can argue for or against. It should be something that you can present persuasively and clearly. The scope of your paper, so keep in mind that page count. If possible, your thesis should be somewhat original."}, {"id": "378", "title": "Credit Unions", "text": "Credit unions are nonprofit organizations that were imported to the United States from Germany in the early 1900s. They were regulated in 1934 by the Federal Credit Union Act, which limits membership to groups having a common bond of occupation or association. Groups from particular geographical areas also were eligible to join credit unions."}, {"id": "377", "title": "Telecommunication", "text": "Today, telecommunication is widespread and devices that assist the progress are common in many parts of the world. There is also a vast array of networks that connect these devices, including computer, telephone and cable networks. Computer communication across the Internet, such as e-mail and instant messaging, is just one of many examples of telecommunication."}, {"id": "376", "title": "Legal System", "text": "This course provides an introduction to the history and development of the British legal system. Its aim is to describe the evolution of the Common Law of England, the legal system of England and to introduce you to the study of constitutions as law, and to the legal aspects of constitutional systems of government."}, {"id": "375", "title": "Useful Resource", "text": "This is an extremely useful resource, which ranks books and academic papers on the subject not only in terms of their reliability but also their readability. As a result, it is likely to save students time and effort that would otherwise have been spent working through a lot of dense texts before finding the one they really need."}, {"id": "374", "title": "Negative Immigration", "text": "There is a tendency, especially in the popular press to concentrate on the negative effects of immigration. In that context, this lecture listing the benefits it brings to more developed nations is much more welcome. Also, it is delivered in a lively and amusing style."}, {"id": "373", "title": "Market Research", "text": "There are two main types of market research. Quantitative research involves collecting a lot of information by using techniques such as questionnaires and other forms of survey. Qualitative research involves working with smaller samples of consumers, often asking them to discuss products and services while researchers take notes about what they have to say."}, {"id": "372", "title": "Different Dimensions", "text": "The fact is that those different types of services affect many different dimensions of well-being of people. And defining the human well-being is also extremely challenging. However, we identified that there are certain items providing basic material for life, whether it is food, shelter or happiness."}, {"id": "371", "title": "Microscopic Invaders", "text": "We all know about bacteria, viruses and microscopic protozoa. We can watch the way that these tiny agents move into our bodies and damage our organs. We have a growing understanding of how our body mounts defensive strategies that fight off these invaders, and have built some clever chemical that can help mount an assault on these bio-villains."}, {"id": "370", "title": "Language Acquisition", "text": "Thus, language acquisition might be like other biological functions. The linguistic clumsiness of tourists and students might be the price we pay for the linguistic genius we displayed as babies, just as the decrepitude of age is the price we pay for the vigor of youth."}, {"id": "369", "title": "First child", "text": "Women who deliver their first child by cesarean section (C-section) are less likely to conceive a second child than those who deliver vaginally, despite being just as likely to plan a subsequent pregnancy, according to researchers. The team followed more than 2,000 women for three years after they delivered their first child."}, {"id": "368", "title": "Zoom", "text": "The coronavirus pandemic has shifted many of our interactions online, with Zoom video calls replacing in person classes, work meetings, conferences and other events. Will all that screen time damage our vision? Maybe not. It turns out that our visual perception is highly adaptable, according to new research."}, {"id": "367", "title": "Stone Tools", "text": "Modern humans arrived in westernmost Europe 41,000 to 38,000 years ago, about 5,000 years earlier than previously known, according to an international team of researchers that discovered stone tools used by modern humans dated to the earlier time period in a cave near the Atlantic coast of central Portugal. The tools document the presence of modern humans at a time when Neanderthals were thought to be present in the region."}, {"id": "366", "title": "Sake Yeast", "text": "Researchers have found that a mutant strain of sake yeast produces high levels of the amino acid ornithine. Ornithine has been found to reduce fatigue and improve sleep quality, and the non-genetically modified mutant yeast strain discovered in this study could be easily applied to brewing sake, a traditional Japanese alcoholic beverage, as well as wine and beer."}, {"id": "365", "title": "Artificial Intelligence", "text": "Researchers have designed an artificial intelligence model that is better able to predict how much students are learning in educational games. The improved model makes use of an AI training concept called multi-task learning, and could be used to improve both instruction and learning outcomes."}, {"id": "364", "title": "Critical Protein", "text": "Researchers have conducted a study that has determined the role that a critical protein plays in the development of hair cells. These hair cells are vital for hearing. Some of these cells amplify sounds that come into the ear, and others transform sound waves into electrical signals that travel to the brain."}, {"id": "363", "title": "Brain Scans", "text": "Scientists studying brain scans of people who were asked to come up with inventive uses for everyday objects found a specific pattern of connectivity that correlated with the most creative responses. Researchers were then able to use that pattern to predict how creative other people's responses would be based on their connections in this network."}, {"id": "362", "title": "Closure Activities", "text": "Closure activities allow participants to consolidate learning, say goodbye to group mates, and attend to any unfinished business prior to the ending of the group experience. Generally, these activities involve some reflection upon what has been learned or accomplished during the preceding time together and a sharing of those thoughts or insights with other participants."}, {"id": "361", "title": "Lemurs", "text": "A research team has systematically investigated the cognitive abilities of lemurs, which have relatively small brains compared to other primates. Conducting systematic tests with identical methods revealed that cognitive abilities of lemurs hardly differ from those of monkeys and great apes. Instead, this study revealed that the relationship between brain size and cognitive abilities cannot be generalized and it provides new insights into the evolution of primates."}, {"id": "360", "title": "Immune System", "text": "Whether flu or coronavirus, it can take several days for the body to ramp up an effective response to a viral infection. New research describes how different cells in the immune system work together, communicate, and - in the case of cells called neutrophils - bring about their own death to help fight off infections. The findings could have important implications for the development of vaccines and anti-viral therapies."}, {"id": "359", "title": "Obesity", "text": "Some people are at higher risk of developing obesity because they possess genetic variants that affect how the brain processes sensory information and regulates feeding and behavior. The findings support a growing body of evidence that obesity is a disease whose roots are in the brain."}, {"id": "358", "title": "Civil War", "text": "A new study comprehensively reveals how civil wars impact wildlife in countries affected by conflict. Researchers found that the main impacts of civil wars on native mammals are often indirect, ultimately arising from institutional and socio- economic changes, rather than from direct military tactics."}, {"id": "357", "title": "Data Leak", "text": "In 2016, the world's largest ever data leak dubbed \"The Panama Papers\" exposed a scandal, uncovering a vast global network of people -- including celebrities and world leaders, who used offshore tax havens, anonymous transactions through intermediaries and shell corporations to hide their wealth, grow their fortunes and avoid taxes."}, {"id": "356", "title": "Water Towers", "text": "Global water consumption has increased almost fourfold in the past 100 years, and many regions can only meet their water demand thanks to essential contributions from mountain regions. In 30 years, almost a quarter of the world's lowland population will strongly depend on runoff from the mountains. Only sustainable development can ensure the important function of mountain areas as Earth's 'water towers'."}, {"id": "355", "title": "Electronic Blood Vessels", "text": "Researchers have developed electronic blood vessels that can be actively tuned to address subtle changes in the body after implantation. The blood vessels -- made of a metal-polymer conductor membrane that's flexible and biodegradable -- mimic natural blood vessels, were conductive in vitro experiments, and were able to effectively replace key arteries in rabbits."}, {"id": "354", "title": "Cosmic Rays", "text": "Killer cosmic rays from nearby supernovae could be the culprit behind at least one mass extinction event, researchers said, and finding certain radioactive isotopes in Earth's rock record could confirm this scenario."}, {"id": "353", "title": "Deaths of Despair", "text": "People who attended religious services at least once a week were significantly less likely to die from 'deaths of despair', including deaths related to suicide, drug overdose, and alcohol poisoning, according to new research."}, {"id": "352", "title": "Scientists", "text": "Scientists make observations, have assumptions, and do experiments. After these have been done, they get their results. Then there is a lot of data from scientists. The scientists around the world have a picture of the world."}, {"id": "351", "title": "Stressful Occupations", "text": "Just how stressed are teachers? A recent Gallup poll found teachers are tied with nurses for the most stressful occupation in America today. Unfortunately, that stress can have a trickle-down effect on their students, leading to disruptive behavior that results in student suspensions."}, {"id": "350", "title": "Economies of Scale", "text": "If countries can specialize in certain goods they can benefit from economies of scale and lower average cost. This is especially true in the industry with high fixed costs or that require a high level of investment. The benefits of the economy of scale will ultimately lead to lower prices for consumers and greater efficiency for exporting firms."}, {"id": "349", "title": "Alexander the Great", "text": "Before the time of Alexander the Great, the only eastern people who could be compared with the Greeks in the fields of science and philosophy were from the Indian sub-continent. However, because so little is known about Indian chronology, it is difficult to tell how much of their science was original and how much was the result of Greek influence ."}, {"id": "348", "title": "High Quality of Life", "text": "In spite of the spectacularly high quality of life for the vast majority of the people who live in the European Union, its inhabitants seem obsessed by the region's relative decline in the world. Slow economic growth rates and high unemployment have reinforced the impression that Europe is unhappy with today and unsure of tomorrow ."}, {"id": "347", "title": "Executive Order", "text": "But on May 3, a couple of weeks later, Lincoln issued an executive order calling for 43,000 three-year volunteers for the army, and also increasing the size of the regular army and navy by 40,000 men. Both of these actions were in apparent violation of the constitution ."}, {"id": "346", "title": "Scientific Evidence", "text": "The latest scientific evidence on the nature and strength of the links between diet and chronic diseases is examined and discussed in detail in the following sections of this report. This section gives an overall view of the current situation and trends in chronic diseases at the global level."}, {"id": "345", "title": "Economic Well-being", "text": "The current measure has remained virtually unchanged over the past 30 years. Yet during that time, there have been marked changes in the nation's economy and society and in public policies that have affected families' economic well-being, which is not reflected in the measure."}, {"id": "344", "title": "Succulent Plants", "text": "Most succulent plants are found in regions where there is little rainfall, dry air, plenty of sunshine, porous soils and high temperatures during part of the year. These conditions have caused changes in plant structures, which have resulted in greatly increased thickness of stems, leaves and sometimes roots, enabling them to store moisture from the infrequent rains ."}, {"id": "343", "title": "Letter Writing", "text": "While far fewer people these days write letters and therefore have less use for stamps, there are still a few categories of stamp which attract collectors. Stamps in common use for an indefinite period - until the price goes up - are called \"definitive\" issues, while a more collectible type of stamp is the \"commemorative\" issue, honoring people, events and anniversaries ."}, {"id": "342", "title": "Ponds", "text": "There are many kinds of pond, but nearly all are small bodies of shallow, stagnant water in which plants with roots can grow. Water movement is slight and temperatures fluctuate widely. The wealth of plants ensures that during daylight hours oxygen is plentiful. However, at night, when photosynthesis no longer takes place, oxygen supplies can fall very low ."}, {"id": "341", "title": "Australian Mining Industry", "text": "Australia has one of the world's most important mining industries. It is a major exporter of coal, iron ore, gold and copper and is self-sufficient in all minerals bar petroleum. Since the first discoveries, the coal in 1798, mineral production has risen every year in the decade to 1992 it doubled ."}, {"id": "340", "title": "Atlantic Coast", "text": "The Atlantic coast of the peninsula can be thought of as the cold side, and the sea on this coast tends to be clear and cold, with a variety of seaweeds growing along the rocky shoreline. On a hot day, however, this cold water can be very refreshing and is said to be less hospitable to sharks, which prefer warmer waters ."}, {"id": "339", "title": "Economic Planning", "text": "Another method governments use to try and influence the private sector is economic planning. For a long time now, socialist and communist states have used planning as an alternative to the price mechanism, organizing production and distributing their resources according to social and strategic needs, rather than based on purely economic considerations ."}, {"id": "338", "title": "Second World War", "text": "For the first two or three years after the Second World War, a new title would often sell out within a few months of publication. However, unless public demand for the book was unusually high, they were rarely able to reprint it. With paper stocks strictly rationed, they could not afford to use up precious paper or tie up their limited capital with a reprint ."}, {"id": "337", "title": "Saving and Investment", "text": "It is important to note that saving is not the same as investment. Saving is about cash, while investment is about real product. The difference is important because money, being liquid, can leak out of the economic system - which it does when someone who is putting aside unspent income keep it under the mattress ."}, {"id": "336", "title": "Shoestring Budget", "text": "All the works of art shown in this exhibition were purchased on a shoestring budget. The criteria that the curators had to follow were that works must be acquired cheaply, appeal to a broad range of tastes, and fit with unusual environments. Thus, many of our better-known modern artists are not represented ."}, {"id": "335", "title": "Bergson's Theory", "text": "The starting point of Bergson's theory is the experience of time and motion. Time is the reality we experience most directly, but this doesn't mean that we can capture this experience mentally. The past is gone and the future is yet to come. The only reality is the present, which is real through our experience ."}, {"id": "334", "title": "Fractional Reserve Banking", "text": "Fractional reserve banking is a banking system in which banks only hold a fraction of the money their customers' deposit as reserves. This allows them to use the rest of it to make loans and thereby essentially create new money. This gives commercial banks the power to directly affect the money supply ."}, {"id": "333", "title": "Foam-filled Furniture", "text": "Foam-filled furniture is very dangerous if it catches fire, and foam quickly produces a high temperature, thick smoke and poisonous gases - including carbon monoxide. Therefore, set levels of fire resistance have been established for new and second-hand upholstered furniture and other similar products."}, {"id": "332", "title": "Triumph of Capitalism", "text": "Most peasants remained self-sufficient and sceptical about money - and with good reason: the triumph of capitalism probably made them worse off. They now had to deal with a centralized imperial state that was collecting tax more efficiently, giving more power to landlords, and slowly reducing customary peasant rights to land and produce ."}, {"id": "331", "title": "Opening of Parliament", "text": "The ritual of the state opening of parliament still illustrates the basis of the British constitution. The sovereignty of the Royal Family has passed to the sovereignty of parliament, leaving the monarchy with the trappings of power, while prime ministers are still denied the kind of status that is given to American and French presidents ."}, {"id": "330", "title": "Informative Speech", "text": "The purpose of the informative speech is to provide interesting, useful, and unique information to your audience. By dedicating yourself to the goals of providing information and appealing to your audience, you can take a positive step toward succeeding in your efforts as an informative speaker."}, {"id": "329", "title": "Constellation", "text": "A constellation is an area on the celestial sphere in which a group of stars forms an imaginary outline or pattern, typically representing an animal, mythological person or creature, or an inanimate object. The origins of the earliest constellations likely go back to prehistory ."}, {"id": "328", "title": "Introvert and Extrovert (2)", "text": "Although introvert and extrovert personality types differ from one another on various grounds, the major difference between the two is their source of rejuvenation. While for extroverts, this may mean interaction or excursions with friends and family, the same may mean reading a book or listening to music for introverts ."}, {"id": "327", "title": "Microbes", "text": "Investigators also compared those microbes with those living in 52 other soil samples taken from all around the planet. The park had organisms that also exist in deserts, frozen tundra, forests, rainforests, and prairies. Antarctica was the only area that had microbes that did not overlap with those found in Central Park. Only a small percentage of the park’s microbes were found to be already listed in databases ."}, {"id": "326", "title": "Father (2)", "text": "Every morning, no matter how late he had been up, my father rose at 5:30, went to his study, wrote for a couple of hours, made us all breakfast, read the paper with my mother, and then went back to work for the rest of the morning. Many years passed before I realized that he did this by choice, for a living, and that he was not unemployed or mentally ill ."}, {"id": "325", "title": "Tourism", "text": "Tourism is a challenging sector on which divides statistics since businesses serving tourists, also service local people. Therefore, it is not straightforward to estimate how much business sectors' revenues and how many jobs are due to tourist expenditures."}, {"id": "324", "title": "Financial Crisis", "text": "New research shows that during the global financial crisis, workers who stayed in jobs did not reduce their working hours, despite the claims that cuts in hours have led to job losses. A study found that the life of people who stayed with the same employer remained relatively unchanged ."}, {"id": "323", "title": "Information Technology", "text": "The emergence of information technology has created new products, processes and distribution systems. New products include the computer, the Internet and digital TV; new processes include Internet banking, automated inventory control and automated teller machines; and new distribution systems include cable and satellite TV."}, {"id": "322", "title": "Heterogeneous Student", "text": "To work effectively with the heterogeneous student populations found in our schools, educators have the responsibility of acknowledging the cultural backgrounds of their students and the cultural setting in which the school is located in order to develop effective instructional strategies ."}, {"id": "321", "title": "Rural Population", "text": "Thus, a country might possess a sizeable rural population, but have an economic system in which the interests of the voters were predominantly related to their incomes, not to their occupations or location; and in such a country the political system would be unlikely to include an important agrarian party ."}, {"id": "320", "title": "Black Swan (2)", "text": "Before the discovery of Australia, people in the old world were convinced that all swans were white, an unassailable belief as it seemed completely confirmed by empirical evidence. The sighting of the first black swan might have been an interesting surprise for a few scientists, but that is not where the significance of the story lies."}, {"id": "319", "title": "Becoming Carbon-neutral", "text": "You used to think that being green was a luxury for your company, but climate change has made you realize that you can no longer ignore it. The buzz is about becoming carbon-neutral, but where do you start? Consider your drivers. Do you want to become carbon-neutral for marketing reasons, for financial reasons or to help save the planet ?"}, {"id": "318", "title": "Working Unions", "text": "Therefore, the working unions in modern society are not very important. They preserve their functions only in the underdeveloped countries. On the contrary, in the developed states, workers refuse to join the unions, preferring individual work. Thus, working unions cannot survive the assault of modern economic trends and slowly move to a complete decline. Their initial purposes have little to do with the hectic pace of modern life ."}, {"id": "317", "title": "Linguistic Morality", "text": "In multi-lingual countries, code-mixing, the use of more than one variety in the same utterance or sentence and code-switching, the use of different languages or varieties between sentences is common and natural. Despite its frequency, or perhaps because of it, some scholars and self-appointed guardians of linguistic morality, view both code-mixing and code-switching as a sign of linguistic deficiency ."}, {"id": "316", "title": "Yield of Plants", "text": "The maximum yield of plants, determined by their genetic potential, is seldom achieved because factors such as insufficient water or nutrients, adverse climate conditions, plant diseases, and insect damage will limit growth at some stage. Plants subjected to these biotic and abiotic constraints are said to be stressed."}, {"id": "315", "title": "Girls vs. Boys", "text": "Teenage girls are continuing to outperform boys in English while the gender gap in achievements in math and science has almost disappeared. The figures show that last year 80% of 14-year-old girls reached at least the expected level 5 in English, compared with 65% of boys. But in math, the girls are just 1% ahead of boys, while in science the difference is 2% ."}, {"id": "314", "title": "Man-made Light", "text": "Have you ever pictured a world without light? Just think how much we rely on man-made light sources in our lives. Without engineers, we wouldn't be able to live the way we do. No street lights, no TV, no computer display, no house lights. Engineers design and build all these things, and they also design, build and run the electricity systems that power all these light sources ."}, {"id": "313", "title": "Learning Method", "text": "There is no single method of learning that guarantees success. How we learn that depends on many different factors. And what works best for you will not necessarily be the same as the approach used for the other students even they study the same course. We are all unique as learners, although some patterns emerge from any groups of students ."}, {"id": "312", "title": "Colloquialism", "text": "Australian speak English of course. But for many tourists and even some locals, Australian English has only tenuous links with mother tone. Our speech is prepared with words and phrases whose arcane meanings are understood only by the initiate. It is these colorful colloquialisms that Australian slang set to truly explain ."}, {"id": "311", "title": "Values of Literature", "text": "Certainly, one of the important values of literature is that it nourishes our emotional lives. An effective literary work may seem to speak directly to us especially if we are ripe for it. The inner life that good writers reveal in their characters often gives us glimpses of some portion of ourselves. We can be moved to laugh, cry, tremble, dream, ponder, shriek, or rage with a character by simply turning the page instead of turning our lives upside down ."}, {"id": "310", "title": "Only Family", "text": "Imagine living all your life as the only family on your street. Then, one morning, you open the front door and discover houses all around you. You see neighbors tending their gardens and children walking to school. Where did all the people come from? What if the answer turned out to be that they had always been there — you just hadn't seen them ?"}, {"id": "09", "title": "Educational Demand", "text": "Public demand for education has remained strong, reflecting the importance of education as a means of social progress. Aware of the social value of education to the world of the work, the government continues to innovate and update the education system in order to produce a qualified and competent work force ."}, {"id": "308", "title": "Online Shopping", "text": "A unique characteristic of online shopping environments is that they allow vendors to create retail interfaces with highly interactive features. One desirable form of interactivity from a consumer perspective is the implementation of sophisticated tools to assist shoppers in their purchase decisions by customizing the electronic shopping environment to their individual preferences ."}, {"id": "307", "title": "Internal Combustion Engine", "text": "Internal combustion engine enables the driver to decide which source of power is appropriate for the travel requirements of a given journey. Major US auto manufacturers are now developing feasible hybrid electric vehicles, and some are exploring fuel-cell technology for their electric cars."}, {"id": "306", "title": "Beauty Contests", "text": "Beauty contests, whether it's Miss Universe or Miss Teen International, are demeaning to women and out of sync with the times. Opponents say that they are nothing more than symbols of decline. Since Australians Jennifer Hawkins and Lauryn Eagle were crowned Miss Universe and Miss Teen International respectively, there has been a dramatic increase in interest in beauty pageants in this country."}, {"id": "305", "title": "Abstract Preparation", "text": "The preparation of abstracts is an intellectual effort, requiring general familiarity with the subject. To bring out the salient points of an author’s argument calls for skills and experience. Consequently, a considerable amount of qualified manpower that could be used to advantage in other ways must be diverted to the task of facilitating access to information ."}, {"id": "304", "title": "Naming English", "text": "In the past, Naming English as a separate subject seemed relatively easy. The textbook selected and graded items of language which were put into content and then practiced intensively. New items were carefully controlled so that the student could cope quite easily. Now that English is used as a medium of instruction ."}, {"id": "303", "title": "Recycling", "text": "When we recycle, used materials are converted into new products, reducing the need to consume natural resources. If used materials are not recycled, new products are made by extracting fresh, raw material from the Earth, through mining and forestry. Recycling helps conserve important raw materials and protects natural habitats for the future ."}, {"id": "302", "title": "MBA", "text": "Exhilarating, exhausting and intense. There are just some of the words used to describe doing an MBA. Everyone’s experience of doing MBA is, of course, different through denying that it’s hard and a demanding work whichever course you do. MBA is one of the fastest growing areas of studying in the UK so that must be a sustainable benefit against form in one pain ."}, {"id": "301", "title": "Tea Ceremony", "text": "The Japanese tea ceremony is a ritual tour influenced by Buddhism in which green tea is prepared and served to a small group of guests in a peaceful setting. The ceremony can take as long as four hours and there are many traditional gestures that both the server and the guest must perform ."}, {"id": "300", "title": "Orientalists", "text": "Orientalists, like many other nineteenth-century thinkers, conceive of humanity either in large collective terms or in abstract generalities. Orientalists are neither interested in nor capable of discussing individuals; instead, artificial entities predominate. Similarly, the age-old distinction between \"Europe\" and \"Asia\" or \"Occident\" and"}, {"id": "299", "title": "Examination", "text": "The department determines whether or not the candidate has passed the examination. In cases where an appearance for the final public oral examination would constitute a substantial financial hardship for the candidate, the director of graduate studies may recommend to the dean of the Graduate School that the examination be waived ."}, {"id": "298", "title": "Domestic Division", "text": "Traditional divisions of domestic work are understood to persist because of the strong association of the home with femininity and paid work with masculinity - to challenge who does what in the home is arguably tantamount to challenge what it is to be a woman or a man ."}, {"id": "297", "title": "Companies", "text": "Companies will want to be known not just for the financial results they generate, but equally for the imprint they leave on society as a whole. First, ensuring that their products contribute positively. Second, operating in a way that approaches a \"net-neutral\" impact to the natural environment. And third, cherishing their people ."}, {"id": "296", "title": "Nutritionally Bankrupt", "text": "Globalization has affected what we eat in ways we are only beginning to understand. Modern food production no longer relates to our biological needs but is in direct conflict with them. The relationship between diet and our fertility, our risk of cancer, heart disease and mental illness is becoming clearer. Yet much of our food is nutritionally bankrupt ."}, {"id": "295", "title": "Measurable Benefit", "text": "Perhaps the most measurable benefit of the program has been the opportunity to me in small groups, something that is difficult to arrange such a desperate organization. Many officers would have to work together for thirty years but would not know other's strengths and weaknesses."}, {"id": "294", "title": "Actor Training", "text": "Training to become an actor is an intensive process which requires curiosity, courage and commitment. You’ll learn how to prepare for rehearsal, how to rehearse and how to use independent and proactive processes to achieve your best work possible for stage and screen ."}, {"id": "293", "title": "Divorce", "text": "Researchers have found that divorce has different kinds of negative impacts on the planet, including higher demand for resources and a lower rate of efficiency in the use of household resources. People have been talking about how to protect the environment and combat climate change, but divorce is an overlooked factor that needs to be considered ."}, {"id": "292", "title": "Business School Admission", "text": "Business school admissions officers said the new drive to attract younger students was in part the result of a realization that they had inadvertently limited their applicant pool by requiring several years' work experience. Talented students who might otherwise have gone to business school instead opted for a law or policy degree because they were intimidated by the expectation of work experience ."}, {"id": "291", "title": "Elephant", "text": "The elephant is the largest living land mammal. During evolution, its skeleton has greatly altered from the usual mammal, designed for two main reasons. One is to cope with the great weight of huge grinding cheek teeth and elongated tusk, making the skull particularly massive. The other is to support the enormous bulk of such a huge body ."}, {"id": "290", "title": "Parkinson", "text": "C. Northcote Parkinson, a British writer, formulated Parkinson's rule: \"Work expands to fill the time allotted to it; or, conversely, the amount of work completed is in inverse proportion to the number of people employed.\""}, {"id": "289", "title": "Hazard Assessment", "text": "A Hazard Assessment should be performed for work involving distillations of organic liquids and should thoroughly address issues relating to residual water and possible decomposition of the solvent in question, as well as the physical placement of the distillation apparatus and heating equipment to be employed ."}, {"id": "288", "title": "Leader Waves", "text": "The next wave of leaders in industrial manufacturing will build an ecosystem that capitalizes on the promise of analytics and connectivity to maximize efficiency for themselves and their customers. They will map out their strategies and prioritize measures that will bring the most value to their business, starting now with pilot projects, and building greater strengths in data analytics with cross-functional teams of experts."}, {"id": "287", "title": "Shrimp Farm", "text": "Shrimp farmers used to hold animals in nursery ponds for 30 to 60 days; now they try to move them into grow out ponds in less than 30 days. This reduces stress on the animals and dramatically increases survivals in the grow-out ponds. Many farms that abandoned nursery ponds have gone back to them, and the results have been surprisingly positive. They're using the old, uncovered, earthen, nursery ponds ."}, {"id": "286", "title": "Fence", "text": "Fence, humanly erected barrier between two divisions of land, used to mark a legal or other boundary, to keep animals or people in or out, and sometimes as an ornament. In newly settled lands fences are usually made of materials at hand, e.g., stone, earth, or wood ."}, {"id": "285", "title": "Statistical Information (A)", "text": "The provision of accurate and authoritative statistical information strengthens modern societies. It provides a basis for decisions to be made on such things as where to open schools and hospitals, how much money to spend on welfare payments and even which football players to replace at half-time ."}, {"id": "284", "title": "Slang", "text": "Australians do speak English. However, for some tourists and travelers, it can be difficult to understand the slang. Also, the links between Australian and American English were seen to be very tenuous. At least some colloquialisms in Australian English do not exist in other types of English ."}, {"id": "283", "title": "Brain", "text": "The brain is divided into its 'hemispheres' by a prominent groove. At the base of this lies nerve fibers which enable these two halves of the brain to communicate with each other. But the left hemisphere usually controls movement and sensation in the right side of the body, while the right hemisphere similarly controls the left side of the body ."}, {"id": "282", "title": "Mathematics", "text": "Competence in mathematics was another trouble spot. More than half said that their real task school's graduates are deficient in mathematics, more than 10% of respondents said college's graduates are deficient in the subject, while 70% said they are adequate ."}, {"id": "281", "title": "Grand Canyon", "text": "Few things in the world produce such amazement as one's first of glimpse of the Grand Canyon; it took around more than 2 billion years to create this vast wonder - in some places. 17 miles wide, largely through the relentless force of Colorado River, which runs 277 miles along its length, a mile beneath its towering rims ."}, {"id": "280", "title": "Tesla", "text": "Tesla's theoretical work formed the basis of modern alternating current electric power systems. Thomas Edison promised him almost one million dollars in today's money to undertake motor and generator improvement. However, when Tesla asked about the money, Edison reportedly replied \"Tesla, you don't understand our American humor.\" The pair became arch-rivals."}, {"id": "279", "title": "MBA Students", "text": "Along with customary classes on subjects such as finance, accounting, and marketing, today's MBA students are enrolling on courses for environmental policy and stewardship. Indeed, more than half of business schools require a course in environmental sustainability or corporate social responsibility, according to a survey of 91 US business schools, published in October 2005 ."}, {"id": "278", "title": "The Awards", "text": "This year the National Environmental Science Competition received excellent undergraduate and postgraduate entries from all across the country, with a wide range of projects. We are delighted that our awards are encouraging exciting and valuable projects that go beyond research and analysis to develop solutions for a number of key problems. Information about the shortlisted projects will be posted on our website in the first week in June ."}, {"id": "277", "title": "Electric Car", "text": "First-year university students have designed and built a groundbreaking electric car that recharges itself. Fifty students from the University of Sydney's Faculty of Engineering spent five months cobbling together bits of plywood, foam and fiberglass to build the ManGo concept car. They developed the specifications and hand built the car. It's a pretty radical design: a four-wheel drive with a motor in each wheel ."}, {"id": "276", "title": "Fast Food", "text": "Hundreds of millions of American people eat fast food every day without giving it too much thought, unaware of the subtle and not so subtle ramifications of their purchases. They just grab their tray off the counter, find a table, take a seat, unwrap the paper, and dig in. The whole experience is transitory and soon forgotten."}, {"id": "275", "title": "Brain Secrets", "text": "Scientists know little about how exactly it works, especially when it comes to complex functions like memory formation. Research is more advanced in animals, but experiments on humans are hard. Yet, even today, some parts of the brain, like the motor cortex, are better understood. Nor is complete knowledge always needed. Machine learning can recognize patterns of neural activity; the brain itself gets the hang of controlling BCIS with extraordinary ease. And neurotechnology will reveal more of the brain's secrets ."}, {"id": "274", "title": "Bookkeeper Fraud", "text": "A national study into fraud by bookkeepers employed at small and medium-sized businesses has uncovered 65 instances of theft in more than five years, with more than $31 million stolen. Of the cases identified by the research, 56 involved women and nine instances involved men. However, male bookkeepers who defrauded their employer stole three times, on average, the amount that women stole ."}, {"id": "273", "title": "Love", "text": "It seems that when it comes to love, men and women are designed to misconstrue misread and misunderstand one another and themselves. You discover that in fact they make good sense. Being a deluded romantic is often the best way to make a good-biologically successful-choice about a potential partner on the basis ."}, {"id": "272", "title": "Restaurant Location", "text": "The physical location of a restaurant in the competitive landscape of the city has long been known as a major factor in its likely success or failure. Once restaurants are established in such environments they can do little about their location. All they can do is work to improve customer access to their premises. Restaurateurs often do this by engaging in battles with local authorities about car parking ."}, {"id": "271", "title": "Brain Development", "text": "Scientific studies show that by age three there is a gap in brain development between kids who read aloud and those who do not, and children from low-income families are disproportionately impacted by this gap. Making sure all parents know the importance of reading aloud to their children is critical to closing the achievement gap ."}, {"id": "270", "title": "Black Swan", "text": "Before European explorers had reached Australia, it was believed that all swans were white. Dutch mariner, Antonie Caen, was the first to be amazed at the sight of Australia's Black swans on the Shark Bay in 1636. Explorer Willem de Vlamingh captured two of these creatures on Australia's Swan River and returned with them to Europe to prove their existence. From that point on, black swans and Australia have been closely linked ."}, {"id": "269", "title": "Infrastructure", "text": "The grid-based infrastructure enables large-scale scientific applications to be run on distributed resources. However, in practice, grid resources are not very easy to use for the end-users who have to learn how to generate security credentials. There is an imminent need to provide transparent access to these resources so that the end-users are shielded from the complicated details ."}, {"id": "268", "title": "Mental Illness", "text": "A mental illness is a health problem that significantly affects how a person feels, thinks, behaves, and interacts with other people. People who experience mental illnesses and their family and friends suffer a great deal due to these illnesses. According to the World Health Organization, depression will be one of the biggest health problems worldwide by the year 2020 ."}, {"id": "267", "title": "Economic Situation", "text": "In his landmark account, first published over twenty years ago, the author argues that the ignorance and lethargy of the poor are direct results of the whole situation of economic, social and political domination. By being kept in a situation in which critical awareness and response are practically impossible the disadvantaged are kept ‘submerged .’"}, {"id": "266", "title": "Semiconductor Industry", "text": "The semiconductor industry has been able to improve the performance of electronic systems for more than four decades by making ever-smaller devices. However, this approach will soon encounter both scientific and technical limits, which is why the industry is exploring a number of alternative device technologies."}, {"id": "265", "title": "Legal Writing", "text": "Legal writing is usually less discursive than writing in other humanities subjects, and precision is more important than variety. Sentence structure should not be too complex; it is usually unnecessary to make extensive use of adjectives or adverbs, and consistency of terms is often required ."}, {"id": "264", "title": "Social Media", "text": "Social media are playing an increasingly important role as information sources for travelers. The goal of this study is to investigate the extent to which social media appear in search engine results in the context of travel related searches. It also provides evidence for challenges faced by traditional providers of travel-related information ."}, {"id": "263", "title": "Lenient Parents", "text": "Two sisters were at a dinner party when the conversation turned to upbringing. The elder sister started to say that her parents had been very strict and that she had been rather frightened of them. Her sister, younger by two years, interrupted in amazement. \"What are you talking about?\" she said. \"Our parents were very lenient \"."}, {"id": "262", "title": "Russia", "text": "Long isolated from Western Europe, Russia grew up without participating in the development like the Reformation that many Russians taking pride in their unique culture find dubious value. Russia is, as a result, the most unusual member of the European family, if indeed it is European at all. The question is still open to debate, particularly among Russians themselves ."}, {"id": "261", "title": "Choice of Book", "text": "This book is no ordinary book, and should not be read through from beginning to end. It contains many different adventures, and the path you take will depend on the choices you make along the way. The success or failure of your mission will depend on the decisions you make, so think carefully before choosing ."}, {"id": "260", "title": "Paleontological Momentum", "text": "By this time, however, paleontological momentum had moved to England. In 1812, at Lyme Regis on the Dorset coast, an extraordinary child named Mary Anning -aged 11, 12 or 13, depending on whose account you read-found a strange fossilized sea monster, 17 feet long and now known as the ichthyosaurus, embedded in the steep and 17 dangerous cliffs along the English Channel ."}, {"id": "259", "title": "The UN", "text": "Since its inception, the UN system has been working to ensure adequate food for all through sustainable agriculture. The majority of the world's poorest people live in rural areas of developing countries. They depend on agriculture and related activities for their livelihoods. This makes them particularly vulnerable to man-made and natural influences that reduce agricultural production ."}, {"id": "258", "title": "Use of IT", "text": "DeLone and McLean’s model has been criticized by some authors. Indeed, this model is specific to contexts of voluntary use of information technology. The usage variable remains a success variable of information systems if the user himself decides to adopt or reject the technology. However, for mandatory uses, such as for ERP systems, the use of the technology is obvious. The success of information systems cannot, therefore, be measured by usage."}, {"id": "257", "title": "Herbivore", "text": "“What we found is that the plant is actually damaged by herbivores like most plants are in nature. And in response to that it secretes sugar from the wound edges where the herbivores have damaged the plant.” Tobias Lortzing is a graduate student at Freie University Berlin and one of the study authors."}, {"id": "256", "title": "Specimen", "text": "They controlled for the birds' age, sex, body size and species. And they found that the hunted specimens' brains were actually five percent smaller, on average, than the brains of birds that died by other means. \"The surprising thing is that, if you make a similar kind of analysis of liver or heart size, there is absolutely no difference there. So, this is specific to the brain .”"}, {"id": "255", "title": "Diplomacy", "text": "For diplomacy the starting point must be that globalization requires bridges and removes barriers. A policy of containment is a difficult strategy in the age of the fibre-optic cable, the jumbo jet and the satellite dish. There will always be the exception, such as the murderous regime in Iraq where the only safe strategy is to keep it in the isolation ward until it accepts the norms of international behavior, or the military dictatorship in Burma which has persistently failed to respond to dialogue. It takes two to critically engage ."}, {"id": "254", "title": "Question Dodging", "text": "Clementson wanted to see if claims of question dodging actually held up, historically-not necessarily in the unique case of Trump. So, Clementson analysed the transcripts of 14 presidential debates, from 1996 to 2012. Overall, he found 51 accusations of question dodging - 26 by Dems, 25 by Republicans ."}, {"id": "253", "title": "Electronic Discourse", "text": "Electronic discourse is one form of interactive electronic communication. In this study, we reserve the term for the two-directional texts in which one person using a keyboard writes language that appears on the sender’s monitor and is transmitted to the monitor of a recipient, who responds by keyboard ."}, {"id": "252", "title": "Language Appearance", "text": "It seems that language appeared from nowhere since no other species has anything resembling human language. However, other animals do possess basic systems for perceiving and producing sounds that enable them to communicate. These systems may have been in place before the appearance of language ."}, {"id": "251", "title": "Marketing Management", "text": "For any marketing course that requires the development of a marketing plan, such as Marketing Management, Marketing Strategy and Segmentation Support Marketing, this is the only planning handbook that guides"}];

let set=[],idx=-1,timer=null,paused=false,remaining=45000,deadline=0;
const $=id=>document.getElementById(id);
function sample(){let a=[...ITEMS];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a.slice(0,6)}
function controls(){const active=idx>=0&&idx<set.length;$('prev').disabled=idx<=0;$('next').disabled=!active;$('pause').disabled=!active;$('pause').textContent=paused?'계속':'일시정지'}
function render(){controls();if(idx<0)return;if(idx>=set.length){clearInterval(timer);timer=null;$('count').textContent='6 / 6 완료';$('content').innerHTML='<div class="done">6문제 완료! 👏</div><div class="phase">새로운 6문제로 다시 연습하세요.</div>';return}
const q=set[idx];$('count').textContent=`${idx+1} / ${set.length}`;$('content').innerHTML='<div class="meta"><div class="title" id="title"></div><div class="timer" id="time"></div></div><div class="bar"><div class="fill" id="fill"></div></div><div class="text" id="passage"></div><div class="phase" id="phase"></div>';$('title').textContent=`#${q.id} · ${q.title}`;$('passage').textContent=q.text;update()}
function update(){if(idx<0||idx>=set.length)return;const prep=remaining>10000;const seconds=Math.ceil((prep?remaining-10000:remaining)/1000);$('time').textContent=seconds+'s';$('fill').style.width=Math.max(0,remaining/45000*100)+'%';$('fill').style.background=prep?'#aab5ca':'#34d399';$('phase').className='phase '+(prep?'prepare':'read');$('phase').textContent=paused?'일시정지':(prep?'PREPARE · 준비':'READ · 지금 읽으세요');}
function tick(){if(paused||idx<0||idx>=set.length)return;remaining=Math.max(0,deadline-performance.now());if(remaining<=0){idx++;remaining=45000;deadline=performance.now()+remaining;render();}else update()}
function run(){clearInterval(timer);if(idx>=0&&idx<set.length){deadline=performance.now()+remaining;timer=setInterval(tick,100)}}
function start(){set=sample();idx=0;remaining=45000;paused=false;render();run()}
function go(n){if(idx<0)return;idx=Math.max(0,Math.min(set.length,idx+n));remaining=45000;paused=false;render();run()}
function toggle(){if(idx<0||idx>=set.length)return;if(!paused){tick();if(idx>=set.length)return;remaining=Math.max(0,deadline-performance.now());paused=true}else{paused=false;deadline=performance.now()+remaining}controls();update()}
$('start').onclick=start;$('next').onclick=()=>go(1);$('prev').onclick=()=>go(-1);$('pause').onclick=toggle;
document.addEventListener('keydown',e=>{if(e.target.closest('button,input,textarea,select'))return;if(e.code==='Space'){e.preventDefault();toggle()}if(e.key==='ArrowRight'){e.preventDefault();go(1)}if(e.key==='ArrowLeft'){e.preventDefault();go(-1)}if(e.key.toLowerCase()==='r')start()});controls();
</script></body></html>
