</style></head><body><div class="app"><nav style="display:flex;gap:20px;margin-bottom:18px"><a href="/" style="color:#aab5ca;text-decoration:none">JARVIS</a><a href="/pte/wfd" style="color:#aab5ca;text-decoration:none">WFD 연습</a></nav><div class="top"><div class="brand">PTE · READ ALOUD</div><div class="count" id="count">Ready</div></div><div class="card"><div id="content"><div class="done">RA 6문제 연습</div><div class="phase">준비 35초 → 읽기 10초 → 다음 문제</div></div></div><div class="controls"><button class="secondary" id="prev">← 이전</button><button class="primary" id="start">랜덤 6문제 시작</button><button class="secondary" id="pause">일시정지</button><button class="secondary" id="next">다음 →</button></div><div class="hint">녹음은 별도 프로그램에서 해주세요.<br>Space: 일시정지/계속 · ← →: 이전/다음 · R: 새로운 6문제</div></div><script>
const ITEMS=[{"id": "1023", "title": "Urban Forests", "text": "A community's urban forest is an extension of its pride and community spirit. Trees enhance community economic stability by attracting businesses and tourists as people tend to linger and shop longer along tree lined streets. Apartments and offices in wooded areas rent more quickly and businesses leasing office spaces in developments with trees reported higher productivity and fewer absences."}, {"id": "1022", "title": "Root Network", "text": "The networks of roots that plants use to absorb water and nutrients can encompass a space larger than the part of the plant visible above ground. The nature of these roots systems can help plants adapt to challenging environments such as deserts. For instance, mesquite trees can develop tap roots capable of digging more than 50 yards deep to reach water."}, {"id": "1021", "title": "Child Psychology", "text": "Within this free course, you will be introduced briefly to the discipline of child psychology and to theories and approaches that have been developed to help us understand and support children's lives by focusing on the individual children. Psychologists can assess changes in their child's abilities over time, including their physical, cognitive, social, and emotional development."}, {"id": "1020", "title": "Political Problems", "text": "The course considers the ways in which thinkers have responded to the particular political problems of their day and the ways in which they contribute to a broader conversation about human goods and needs, justice, democracy, and the proper relationship of the individual to the state."}, {"id": "1019", "title": "Statistics", "text": "Statistics are indicators of change and allow meaningful comparisons to be made. While it may be the issues rather than the statistics as such that grab people's attention, it should be recognized that it is the statistics that informed the issues. Statistical literacy, then, is the ability to accurately understand, interpret and evaluate the data that inform these issues."}, {"id": "1018", "title": "William Shakespeare", "text": "Three hundred and eighty years after his death, William Shakespeare remains the central author of the English speaking world; he is the most quoted poet and the most regularly produced playwright — and now among the most popular screenwriters as well. Why is that, and who \"is\" he?"}, {"id": "1017", "title": "Rates of Depression", "text": "At a time when stress levels are soaring, rates of depression are increasing and the gap between rich and poor is ever widening. We believe that giving can play a positive role in helping people to feel connected to those around them and generate a sense of purpose and hope. When we give, we feel valued, useful and happy."}, {"id": "1016", "title": "Tutor", "text": "Your tutor helps you make the most of your time at university by giving you guidance and support along the way. All new students are allocated a personal tutor who will encourage you to get the most out of your course, direct you to other sources of support and help you achieve your goals."}, {"id": "1015", "title": "Attendance", "text": "To some extent, attendance at cultural venues and events is influenced by a person's age and the composition of the household in which they live. For example, those people in households with dependent children were more likely to visit zoological parks and aquariums than people living in single person households."}, {"id": "1014", "title": "Enough Fluid", "text": "Your body is nearly two-thirds water. And so it is really important that you consume enough fluid to stay hydrated and healthy. If you don't get enough fluid you may feel tired, get headaches, and not perform at your best."}, {"id": "1013", "title": "Single Research", "text": "Rarely, however, does a single research study produce the certainty needed to assume that the same results will apply in all or most settings. Rather, research is usually an ongoing process, based on many accumulated understandings and explanations that, when taken together, lead to a generalization about educational issues and practice, and ultimately, to the development of theories."}, {"id": "1012", "title": "Tortoise", "text": "The tortoise size and shell shape varies depending on where they live. The shell is made of bone and is a dull brown color. Their ribs, backbone and breastbone have become part of the shell, which is why you can never separate the tortoise from its shell."}, {"id": "1011", "title": "Department Stores", "text": "In this course, we will explore how such things as department stores, nationally advertised brand-name goods, mass produced cars and suburbs transformed the American economy, society and politics. The course is organized both thematically and chronologically. Each period deals with a new development in the history of consumer culture."}, {"id": "1010", "title": "Attendance to Theater", "text": "Experts discuss the significance of attending the theater as a civic occasion, associated with the political and cultural achievements of Athens. Through archeology and analyses of contemporary art forms such as decoration on pottery, a picture is built up of ancient Greek theater."}, {"id": "1009", "title": "Norms and Values", "text": "Members of a culture must conform to its norms for the culture to exist and function. Hence, members must want to conform and obey rules. They first must internalize the social norms and values that dictate what is normal for the culture. Then they must socialize or teach norms and values to their children"}, {"id": "1008", "title": "Expression", "text": "Expression became important during the romantic movement with artwork expressing a definite feeling, as in the sublime or dramatic. Audience response was important, for the artwork was intended to evoke an emotional response. This definition holds true today as artists look to connect with and evoke responses from their viewers."}, {"id": "1007", "title": "Learner Experience", "text": "We seek to improve learner's experience of education at college and help them to aspire, achieve and progress. We must embed equality and diversity in everything we do, both as a provider and an employer. We hope to prepare our students for work, higher education and citizenship by equipping our staff with the skills to meet this agenda."}, {"id": "1006", "title": "Natural Environment", "text": "The natural environment can be hazardous, and, with increased travel and leisure, people today are more likely than ever to be exposed to potentially life-threatening conditions. Although the human body can adjust to some extent, it cannot cope with poisons or prolonged exposure to extremes of environment."}, {"id": "1005", "title": "Emigrants", "text": "In the late 16th and 17th centuries, many English, French and Dutch emigrants went to North America in search of gold and silver. But they did not find it. Instead, settlers were forced to support themselves by cultivating crops that they could sell in Europe, like tobacco, indigo and rice."}, {"id": "1004", "title": "Humanities", "text": "We believe in the inherent value of research in the humanities and social sciences. And our research data agenda is given by the pursuit of new knowledge that will be of benefit of Australia and the world. We offer one of the most comprehensive programs in the humanities and social sciences in Australia and the Asian Pacific region."}, {"id": "1003", "title": "Making Notes", "text": "The whole purpose of making notes is to aid your learning. It is important to go back over them within a day of making them to make sure they make sense and make them legible for future revisions. Also, going back over them should highlight the key questions of areas in which you want to do further reading."}, {"id": "1002", "title": "Word Radical", "text": "The word radical from the Latin word for roots means anyone who advocates fundamental change in the political system. Literally, a radical is one who proposes to attack some political or social problems by going deep into the social or economic fabric to get at the root cause and alter this basic weakness."}, {"id": "1001", "title": "New Textbook", "text": "This is a new, accessible and engaging textbook written by academics who also work as consultants with organizations undergoing change. It offers a unique combination of rigorous theoretical exploration together with practical insights from working with those who are actually responsible for managing change."}, {"id": "1000", "title": "Medical Cannabis", "text": "According to a peer-reviewed study medical cannabis led to \"a statistically significant improvement\" in quality of life, employment status, and in the reduction of the number of medications in those with Tourette's Syndrome, in addition to improving comorbidities."}, {"id": "999", "title": "Hybrid Rice", "text": "A new breed of rice that is a hybrid of an annual Asian rice and a perennial African rice could be a more sustainable option. The hybrid rice was able to produce grain for 8 consecutive harvests over four years at a yield comparable to the standard annual Asian rice, with much lower costs and labour."}, {"id": "998", "title": "Motivation to Fight", "text": "USA sexually ‘teased’ its troops in the First World War to make them fight harder. Believing that sexually satisfied men could not be easily motivated, the aim of this teasing was to generate unmet sexual desire, which the War Department could leverage as motivation to fight."}, {"id": "997", "title": "Baby Hearing", "text": "Most babies start developing their hearing while still in the womb, prompting some hopeful parents to play classical music to their pregnant bellies. Some research even suggests that infants are listening to adult speech as early as 10 weeks before birth, gathering the basic building blocks of their family's native tongue."}, {"id": "996", "title": "Stroke Risk", "text": "People in their 20s and 30s who drink moderate to heavy amounts of alcohol may be more likely to have a stroke as young adults than people who drink low amounts or no alcohol, according to a study. The risk of stroke increased the more years people reported moderate or heavy drinking."}, {"id": "995", "title": "Abortions", "text": "The Texas law prohibiting abortion after detectable embryonic cardiac activity was associated with a decrease in in-state abortions and an increase in residents obtaining out-of-state abortions. The proportion of out-of-state abortions obtained at 12 weeks increased significantly from 17.1% to 31%."}, {"id": "994", "title": "Pandemic", "text": "Belief that the COVID-19 pandemic was a hoax – that its severity was exaggerated or that the virus was deliberately released for sinister reasons – functions as a “gateway” to believing in conspiracy theories generally. In study, pandemic skeptics were more likely to believe in 2020 election fraud."}, {"id": "993", "title": "Vitamin and Death", "text": "Vitamin D deficiency linked to premature death. Over a 14-year follow-up period, researchers found that the risk for death significantly decreased with increased vitamin D concentrations, with the strongest effects seen among those with severe deficiencies."}, {"id": "992", "title": "Pollution Reduction", "text": "Air pollution reduced when U.S. embassies around the world installed monitors and tweeted the Readings. The resulting reductions in air pollution levels had large health benefits for residents in these cities, speaking to the potential efficacy of other monitoring and information interventions."}, {"id": "991", "title": "Video Games", "text": "A study of nearly 2,000 children found that those who reported playing video games for three hours per day or more performed better on cognitive skills tests involving impulse control and working memory compared to children who had never played video games."}, {"id": "990", "title": "Seismic Mars", "text": "Until now, Mars has been generally considered a geologically dead planet. An international team of researchers led by ETH Zurich now reports that seismic signals indicate volcanism still plays an active role in shaping the Martian surface."}, {"id": "989", "title": "Heart Disease Diagnosis", "text": "Before a heart disease diagnosis is made, your healthcare provider will gather a full medical history and perform a physical exam. If your doctor suspects heart disease, blood tests will be ordered to check your cholesterol and triglyceride levels, as well as look for proteins that could signal heart failure or plaque in your arteries."}, {"id": "988", "title": "Movies", "text": "Movies are an integral part of us; they mirror what we believe and how we coexist as people. It is easier to see our concerns, attitudes, flaws and strengths in films than it is to decipher them from our daily interactions. When our prevalent beliefs and ideologies are challenged in films, we are sometimes able to interrogate ourselves and embrace change."}, {"id": "987", "title": "Mental Illness", "text": "One of the great contributing factors to mental illness is the idea that we should at all costs and at all times be well. We suffer far more than we should because of how long it can take many of us until we allow ourselves to fall properly and usefully ill."}, {"id": "986", "title": "Pig Kidney Transplantation", "text": "Surgeons in New York City successfully attached a pig kidney to a human patient and watched the pinkish organ function normally for 54 hours. Such procedures have been done in nonhuman primates. However, this is the first time that a pig kidney has been transplanted to a human body and not been immediately rejected."}, {"id": "985", "title": "Culprit Fungi", "text": "As climate change brings more wildfires to the western United States, a rare fungal infection, valley fever, has also been on the rise. It causes coughs, fevers and chest pain and can be deadly. The culprit fungi thrive in soils in California and the desert Southwest. Wildfires appear to stir up and send the soil-loving fungi into the air, where they can enter people’s lungs."}, {"id": "984", "title": "Phantom Rivers", "text": "For two summers in Pioneer Mountains, the roar of rushing white water filled the air. But where the loud sounds prevailed, only gentle streams flowed by. These phantom rivers were part of an experiment led by ecologist Dylan. He and colleagues were testing a hypothesis that the sounds of nature influence where animals lived and how they forage."}, {"id": "983", "title": "Welfare Programs", "text": "Most societies throughout history employed some strategies to help people in poverty meet basic needs. Before the 20th century, religious groups and private charities often led such initiatives. Today, these are called welfare programs, and they usually take the form of government-provided subsidies for housing and healthcare."}, {"id": "982", "title": "Atoms", "text": "Physicists thought they had a solid grasp on what made up matter. They knew that atoms contained electrons surrounding a positively charged nucleus. They also knew that each nucleus contained a number of protons and positively charged particles. Combinations of those two particles made up all of the matter in the universe."}, {"id": "981", "title": "Female Hummingbirds", "text": "Female hummingbirds don flashy feathers to avoid being bothered by other hummingbirds. They tend to have bright blue heads and throats. But mate choice doesn’t seem to drive these females’ pretty plumage since males don’t appear to prefer the blue females. Therefore, bright colors may help lady birds blend in with the guys, and as a result, feed for longer without harassment from other hummingbirds."}, {"id": "980", "title": "Solid Waste Management", "text": "The solid waste management issue is the biggest challenge to the authorities of both small and large cities’ in developing countries. This is mainly due to the increasing generation of such solid waste and the burden posed on the municipal budget. In addition to the high costs, the solid waste management is associated with lack of understanding over different factors that affect the entire handling system."}, {"id": "979", "title": "Tropical Cyclone", "text": "A tropical cyclone is a generic term used by meteorologists to describe a rotating, organized system of clouds and thunderstorms. The weakest tropical cyclones are called tropical depressions. If a depression intensifies such that its maximum sustained winds reach thirty-nine miles per hour, the tropical cyclone becomes a tropical storm."}, {"id": "978", "title": "Roofing", "text": "Roofing your house rarely rates high on the list of fun and exciting home remodeling projects. But when your home develops a leak, your attitude might take a sharp turn. Suddenly, the prospect of a dry, tightly sealed house begins to look very attractive. A beautiful new roof can also improve the curb appeal of your house."}, {"id": "977", "title": "Blood Sugar", "text": "Most of the food you eat is broken down into sugar and released into your bloodstream. When your blood sugar goes up, it signals your pancreas to release insulin. When there isn’t enough insulin or cells stop responding to insulin, too much blood sugar stays in your bloodstream. Over time, that can cause serious health problems, such as diabetes."}, {"id": "976", "title": "Delay Discounting", "text": "Behavioral outcomes are devalued as a function of the delay until they are experienced. This process, known as delay discounting, is reliably associated with cigarette smoking and other tobacco use. Delay discounting is a potential therapeutic target in tobacco cessation. Thus, understanding how delay discounting influences inter temporal choice is critical and may lead to efficacious interventions for tobacco use."}, {"id": "975", "title": "Negative and Positive", "text": "Team members with what researchers call \"negative affect\" exhibit critical and persistent thinking that allows them to identify problems needing solutions. On the other hand, team members with \"positive affect\" engage in broad and flexible thinking that expands their range of information and helps them see unusual and creative connections."}, {"id": "974", "title": "Navigational Abilities", "text": "Are animals' innate navigational abilities universal or are they restricted to their home environments? Taking the premise to the extreme, the researchers designed a set of wheels under a goldfish tank with a camera system to record and translate the fish's movements into forward and back and side to side directions to the wheels."}, {"id": "973", "title": "Categorization", "text": "Categorization is the brain's tool to organize nearly everything we encounter in our daily lives. Grouping information into categories simplifies our complex world and helps us to react quickly and effectively to new"}, {"id": "972", "title": "Hotter Tropics", "text": "The tropics are becoming hotter due to a combination of warming associated with deforestation and climate change, and that can reduce the ability of outdoor workers to perform their jobs safely. Researchers are estimating how many safe working hours people living in the tropics have lost due to local temperature change associated with loss of trees."}, {"id": "971", "title": "Online Treatment", "text": "Computer- and smartphone-based treatments appear to be effective in reducing symptoms of depression, and while it remains unclear whether they are as effective as face-to-face psychotherapy, they offer a promising alternative to address the growing mental health needs spawned by the COVID-19 pandemic."}, {"id": "970", "title": "Quality Translation", "text": "As technology keeps growing, political and economic leaders have utilized cinema in changing and shaping people’s outlooks either for their own benefit or for the benefit of the people. Quality translations are also readily available and extremely affordable for everyone these days, which makes it easy for filmmakers to reach their target audiences from all corners of the world in their mother tongue."}, {"id": "969", "title": "Heart Disease", "text": "Heart disease is the leading cause of death for both men and women in the United States. While often thought of as one illness, heart disease is actually an umbrella term that covers a range of heart conditions. It includes diseases of the blood vessels, including coronary artery disease and peripheral artery disease and so on."}, {"id": "968", "title": "Plants and Animals", "text": "No matter where we go on the planet, there are stunning plants, flowers, and animals that catch our attention. They are two very important aspects of any ecosystem. Of all the living organisms on the planet, the most commonly seen by us are the plant life and the animal life."}, {"id": "967", "title": "Scent", "text": "Scientists suggest that there are a number of reasons that our bodies treat scent differently than other senses. From hunting and gathering food to finding healthy mates, linking smells with memories that stir up desire, happiness, or even fear is biologically useful for humans. Humans have one other thing to consider when scent is at play: context is key."}, {"id": "966", "title": "Smell and Memory", "text": "When you take a deep whiff of your morning coffee, the smell of those fresh-roasted beans darts into parts of the brain responsible for emotional and memory processing, but our other senses don’t work in the same way. That’s why smell can trigger a happy memory more quickly than touching the hot coffee mug or tasting that first sip."}, {"id": "965", "title": "Chinese Architecture", "text": "The most significant difference between traditional Chinese architecture and traditional western architecture is the construction material. Most ancient western buildings were built up with stones, solemn and magnificent. Most importantly, they survive today. Ancient Chinese people were very good at using wood, and created the complex mortise and tenon joint structure to bring in the unique aesthetics for ancient Chinese wooden architecture."}, {"id": "964", "title": "Mutation", "text": "Our genes serve as an operating manual for cells of the body. Genes tell cells what to do and when. But copying errors in those operating manuals, known as mutations, can lead to misspelled instructions that can change how cells operate. Scientists now know that some of those mutations can lead to disease."}, {"id": "963", "title": "Massive Asteroid", "text": "About 66 million years ago, a massive asteroid slammed into the Gulf of Mexico. Not long afterward, all non bird dinosaurs died as did many other species on land and in the sea. Scientists don’t know the exact year this took place, but they now think they have figured out in what season it occurred: spring."}, {"id": "962", "title": "Quantum Behavior", "text": "Particles can act like clumps of matter or ripple through space like waves, and they can even exist in two places at once. A new device harnesses this strange quantum behavior to measure Earth’s gravity. Slight changes in gravity from place to place reveal changes in the density of material beneath the sensor. This allows the instrument to detect underground objects."}, {"id": "961", "title": "Joint Venture", "text": "A joint venture is a business arrangement in which two or more parties agree to pool their resources for the purpose of accomplishing a specific task. This task can be a new project or any other business activity. In a joint venture, each of the participants is responsible for profits, losses, and costs associated with it."}, {"id": "960", "title": "Natural Processes", "text": "Sometimes, natural processes can help preserve materials. For example, sediments from floods or volcanic eruptions can encase materials and preserve them. In one case, the chill of an Alpine glacier preserved the body of a man for more than five thousand years."}, {"id": "959", "title": "Digging", "text": "The process of researching and securing a dig site can take years. Digging is the field work of archaeology. On occasion, archaeologists might need to move earth with bulldozers and backhoes. Usually, however, archaeologists use tools such as brushes, hand shovels, and even toothbrushes to scrape away the earth around artifacts."}, {"id": "958", "title": "Mental Health Challenge", "text": "The COVID-19 pandemic created an enormous level of stress on a global scale, leading to elevated levels of anxiety, depression, and other mental illnesses. Along with this was a disruption and challenges in the delivery of mental health services that were traditionally provided in the office."}, {"id": "957", "title": "NASA Astronaut", "text": "The requirements to be a NASA astronaut have changed over the years to better align with the agency’s mission and values. A potential candidate must be a US citizen. They also have to have a master’s degree from an accredited institution — acceptable degrees include engineering, biological science, or mathematics."}, {"id": "956", "title": "Oxygen on Moon", "text": "Oxygen can be found in many of the minerals in the ground around us, and the Moon is mostly made of the same rocks you’ll find on Earth. Minerals such as silica and magnesium oxides dominate the Moon’s landscape. All of these minerals contain oxygen, but not in a form our lungs can access."}, {"id": "955", "title": "Content Marketing", "text": "A well-crafted content marketing strategy places your business in the position of a thought leader, building brand preference as you inform and educate buyers. Providing helpful and entertaining content can form a strong bond between your brand and customers that continues to grow and strengthen over time."}, {"id": "954", "title": "Fence", "text": "Fences are not just designed to keep people and animals out, but they also keep things in, like children. From a safety perspective, knowing your children are in a yard that is fenced offers solid peace of mind when it comes to their well-being. Fences are also great for keeping pets in a confined, controlled area."}, {"id": "953", "title": "Frog Chorus", "text": "Frogs live almost everywhere, from tropical forests to frozen tundra and scorching deserts. They sport an amazing range of survival strategies. Many frogs are more colorful than the most dazzling birds, and their"}, {"id": "952", "title": "Car Brakes", "text": "A car's brakes are one of its most important safety features and generally come in one of two types: disc or drum. Disc brakes use a spinning disc, which is pinched between brake pads mounted on calipers to slow the motion of the car. Drum brakes, on the other hand, use shoes that push outward to contact the inside of a spinning cylinder."}, {"id": "951", "title": "Health Budget", "text": "The projected decline of government spending in many low income countries will restrict their ability to strengthen pandemic preparedness and limit their progress towards universal health coverage. This will lead to growing inequalities between countries, threatening global stability, and prosperity. Thus, governments need to give greater priority to health in budgets, and improve the efficiency of health spending."}, {"id": "950", "title": "Public Spaces", "text": "Globally, about one-third of a city’s land area is covered by public spaces. Despite this significance, the potential of public-space assets to transform cities and improve urban life is often overlooked. The resulting degradation of public spaces into congested, vehicle-dominated, and polluted places often becomes a liability, exacerbating various city problems."}, {"id": "949", "title": "Diverse Population", "text": "The world is aging and becoming increasingly urban. For the first time, there are more older persons than children under five, and more people are driven to cities for livelihoods, to have access to essential services and simply to enjoy their golden years. How can we ensure cities welcome and nurture a diverse population in ways that are equitable for all?"}, {"id": "948", "title": "City Life", "text": "More and more people are choosing to live in cities. They offer better opportunities, better services, and sanctuary from conflict and the effects of climate change influences. Yet large numbers of people are unable for various reasons to move to cities — skills mismatches, reluctance to sell land at a loss, and sometimes because of explicit policy restrictions that limit people’s movement within countries."}, {"id": "947", "title": "Worsened Inequality", "text": "The COVID-19 pandemic and related shutdowns are challenging the effectiveness of civil and institutional structures around the world, resulting in interrelated crises for foreign policy, development, and economics. Inequality has consequently worsened, both within and across borders, with fiscal and monetary policies exacerbating inequality by favoring the rich while leaving poorer people and countries behind."}, {"id": "946", "title": "Scarce Land", "text": "Land is scarce in many parts of our fast-urbanizing world. Few communities have the chance to create something brand-new on a significant piece of land — and even fewer can develop that land in a way that confronts climate change, generates jobs, and attracts investment."}, {"id": "945", "title": "Degraded Lands", "text": "The effects of soil erosion go beyond the loss of fertile land. It has led to increased pollution and sedimentation in streams and rivers, clogging these waterways and causing declines in fish and other species. Degraded lands are also often less able to hold onto water, which can worsen flooding. Sustainable land use can help to reduce the impacts of agriculture and livestock."}, {"id": "944", "title": "Shock Absorption", "text": "Spacecraft and launch pad equipment undergo extreme stress due to vibration during rocket launches. To make sure that they remain functional in space, shock absorption technology was designed to protect the spacecraft. During earthquakes, buildings and bridges undergo similar stress. That is why the same shock"}, {"id": "943", "title": "Energy Bills", "text": "Across Europe, electricity and gas prices are skyrocketing – this is a massive burden for large sections of the population. In Greece, too, energy bills have risen sharply in recent months. Since the financial and economic crisis, many people are living on the edge of poverty."}, {"id": "942", "title": "Theme Parks", "text": "Not all theme parks succeed when they are built. Some theme parks may start, but close in the first few days due to declining business, poor management or an inability to respond to market changes. Closure of theme park happens even at popular ones if visitors are disappointed with their inconsistent service quality or unchanged aging attractions."}, {"id": "941", "title": "Dead Stars", "text": "The Milky Way is a gargantuan graveyard. Stars are born, burn out and die, but they don't just vanish — and the galaxy is haunted by their corpses. Stars in the Milky Way that died billions of years ago went supernova and morphed into two types of objects. With their outer layers blasted away by the force of the explosion, the cores that were left formed black holes."}, {"id": "940", "title": "Topsoil", "text": "When agriculture fields replace natural vegetation, topsoil is exposed and can dry out. The diversity and quantity of microorganisms that help to keep the soil fertile can decrease, and nutrients may wash out. Soil can be blown away by the winds or washed away by rains."}, {"id": "939", "title": "Coffee Production", "text": "Climate change is intensifying and is putting the future of the entire coffee sector at risk. Roughly half of the land used to grow coffee will decrease and will no longer be suitable for coffee production. With effects from climate change rising at an alarming pace, higher temperatures are significantly impacting coffee cultivation at lower elevations."}, {"id": "938", "title": "Hunter's Full Moon", "text": "The Hunter's full moon is the first full moon after the autumnal equinox, which marks the arrival of the colder months in the Northern Hemisphere. At higher latitudes in the Northern Hemisphere, the moon therefore appeared larger than the full moons of the summer months, as it lingered relatively low above the horizon."}, {"id": "937", "title": "Time Management", "text": "Time management is not that difficult, but it does require advanced thinking and staying on top of tasks that are coming up. Whether the upcoming task is imminent or in the future, it should be recorded. Whether it is recorded on a tech device or a paper notepad, the need is the same."}, {"id": "936", "title": "Email", "text": "Over the years, various internet services have been created to communicate remotely. Social networks have been a revolution, as have instant messaging apps. Since the beginning, there is also a timeless communication standard, representing one of the best tools for individuals and companies to communicate quickly: email."}, {"id": "935", "title": "Sustainability", "text": "On a planet with a growing population and shrinking natural resources, business-as-usual is no longer sustainable. But sustainability is very often good for the bottom line, as it's in the best interest of businesses to responsibly manage our natural resources so we can continue to use them for years to come."}, {"id": "934", "title": "Ionizers", "text": "The role of ionizers is to purify the air with the help of electricity. During this process, negative ions are created that discharge these ions into the air. In this case, they are attached to particles with a positive charge. Some of these harmful particles include smoke, bacteria and pollen. The reaction between these ions helps purify the air inside your room office."}, {"id": "933", "title": "Nitrogen Dioxide", "text": "As far as nitrogen dioxide is concerned, vehicle emissions are the biggest source. Besides, power plants and factories also generate these pollutants. Volcanic activities, lightning, and the decaying process of organic matter may also generate a large amount of nitrogen dioxide. The thing is that nitrogen dioxide may generate smog that produces harmful among in the sunlight."}, {"id": "932", "title": "Academia", "text": "Academia’s mission is to make all research available for free to everyone in the world. Upgrading to premium is a way to support this mission and help make all scholarship and science easily and freely accessible to everyone, not just those affiliated with well-endowed institutions. Academia Premium also includes features such as Advanced Search and Extra Analytic."}, {"id": "931", "title": "Plant-based Meat", "text": "In addition to the street food industry, many high-end restaurants and cafes are also bringing in plant-based meat options. These food products now make up the main menu instead of being treated as a sloppy second option. This transition has come about due to the high quality and taste of these items."}, {"id": "930", "title": "Environmental Degradation", "text": "People are waking up to the problem of environmental degradation. Efforts are being made all over the world to reduce carbon footprint and promote sustainable development. Environmental conservation is no longer only about mandating factories to adopt greener practices or ensuring that vehicles on the road are checked regularly for their pollution levels. It is wider than that and encompasses all industries."}, {"id": "929", "title": "Bangalore Palace", "text": "The majestic Bangalore Palace is iconic for many reasons. The palace rooms now occupy arts and artifacts from the bygone era and is a popular destination for music events. If you are visiting the palace, do opt for the audio guide for an immersive experience."}, {"id": "928", "title": "Social Networking Websites", "text": "If you truly want to leverage social networking websites to build your multilevel marketing or other online business, you need to listen first and develop trust second. That’s when you can begin to use your community marketing abilities that used to work so well before everyone experienced to be so transparent."}, {"id": "927", "title": "Air Filters", "text": "Air filters are a vital part of the engine and help keep it running smoothly. A clogged air filter can be the cause of many problems with the car, including decreased gas mileage and increased emissions. Air filters protect the engine by capturing dirt particles that may enter through the air intake."}, {"id": "926", "title": "Ozone Pollution", "text": "China’s war on particulate air pollution is causing more severe ozone pollution. According to the new research, there was so much particulate matter in the smog around Chinese cities that it helped to quell ozone production by acting as a sponge that collected chemical radicals."}, {"id": "925", "title": "Systematic Sampling", "text": "In probability sampling, each member of the group is selected at regular intervals to be a part of the sample. Systematic sampling is an implementation of probability sampling. In systematic sampling, researchers use statistical methods to choose the desired population on whom they want to research. The sampling interval can be calculated by division of the entire population by required sample size."}, {"id": "924", "title": "Yellowstone Species", "text": "In addition to its unique geography and geology, Yellowstone is also home to many different species of plants and animals. For example, there are more than one thousand species of trees and plants native to the Yellowstone area. It is also home to many different species of fauna, many of which are considered megafaunas such as grizzly bears and bison."}, {"id": "923", "title": "Sociology Career", "text": "Anthropology majors pursue a wide variety of careers, as do sociology students. Either of these degrees can lead to a career as a teacher, public sector employee, or academic. Students who major in sociology often go on to work at non-profit or governmental organizations and the degree can be a stepping stone to a career in politics or public administration."}, {"id": "922", "title": "Melting Pot Theory", "text": "The melting pot theory of multiculturalism assumes that various immigrant groups will tend to “melt together,” abandoning their individual cultures and eventually becoming fully assimilated into the predominant society. Typically used to describe the assimilation of immigrants, this theory is often illustrated by the metaphor of a foundry’s smelting pots in which the elements iron and carbon are melted together to create a single, stronger metal—steel."}, {"id": "921", "title": "Primitive Societies", "text": "Early in the field's history, anthropologists were almost all Europeans or Americans who conducted research in what they considered to be \"primitive\" societies that they believed were \"untouched\" by western influence. Because of this mindset, the field has long been critiqued for its colonialist, condescending attitude toward non western people and its inaccurate representations of their cultures."}, {"id": "920", "title": "Dine", "text": "Dine has been represented by the Pace Gallery and has had hundreds of solo exhibitions around the world including major solo shows in museums in Europe and the United States. This has included the Whitney Museum of American Art and the Museum of Modern Art. His work can be found in numerous other public collections throughout the world."}, {"id": "919", "title": "Stratification", "text": "In Western countries, social stratification primarily occurs as a result of socioeconomic status in which a hierarchy determines the groups most likely to gain access to financial resources and forms of privilege. Typically, the upper classes have the most access to these resources while the lower classes may get few or none of them, putting them at a distinct disadvantage."}, {"id": "918", "title": "New Year", "text": "For many, the start of a new year represents a moment of transition. It's an opportunity to reflect on the past and to look ahead to what the future might hold. Whether it was the best year of our lives or one we'd rather forget, the hope is that better days are ahead."}, {"id": "917", "title": "Exposition", "text": "Exposition is a literary term that refers to the part of a story that sets the stage for the drama to follow: it introduces the theme, setting, characters, and circumstances at the story’s beginnings. To understand what exposition is, look at how the writer sets the scene for the story and the characters within it."}, {"id": "916", "title": "Electric Eel", "text": "A shock from an electric eel is like the brief, numbing jolt from a stun gun. Normally, the shock can't kill a person. However, the eels can cause heart failure or respiratory failure from multiple shocks or in persons with underlying heart disease. More often, deaths from electric eels shocks occur when the jolt knocks a person in the water and they drown."}, {"id": "915", "title": "Spanish", "text": "While Spanish is not a commonly heard language in most parts of Africa, Asia, and the majority of Europe, that hasn't stopped it from becoming the second most commonly spoken language. The spread of the Spanish language is rooted in colonization. Between the 15th and 18th centuries, Spain colonized much of South and Central of North America as well."}, {"id": "914", "title": "Gray Wolf", "text": "The gray wolf is an extremely adaptable species and is one of those animal species that survived the last ice age. The gray wolf's physical characteristics enabled it to adapt quickly to the harsh conditions of the ice age, and its cunning and adaptation helped it survive in the changing environment."}, {"id": "913", "title": "Yellowstone", "text": "Yellowstone was initially made famous due to its unique geology caused by its location on the North American plate, which for millions of years has slowly moved across a mantle hotspot via plate tectonics. The Yellowstone Caldera is a volcanic system, the largest in North America, which has formed as a result of this hot spot and subsequent large volcanic eruptions."}, {"id": "912", "title": "Volcano Behaviors", "text": "There were various explanations for volcano behavior before the structure of the earth mantle as a semisolid material was developed. For decades, awareness that compression and radioactive materials may be heat sources was discounted and volcanic action was often attributed to chemical reactions and a thin layer of molten rock near the surface."}, {"id": "911", "title": "Mandarin", "text": "Because Mandarin is the most commonly spoken dialect, many people use the word Chinese to refer to it. While roughly 70 percent of the country speaks Mandarin, many other dialects are spoken as well. The languages are mutually intelligible to a varying degree, depending on how close the languages are to one another."}, {"id": "910", "title": "Astronaut Candidates", "text": "People who want to become astronauts must be in top physical condition. Each country's space program has health requirements for its space travelers. They usually assess a candidate's fitness to withstand some pretty tough conditions. For example, a good candidate must have the ability to endure the rigors of lift-off and to function in weightlessness."}, {"id": "909", "title": "Light Speed", "text": "As far as we know, nothing can move faster than light. According to Einstein's theories on relativity, it takes an infinite amount of energy to accelerate an object with mass up to the speed of light. As a result, it would appear that having a spacecraft traveling at or exceeding the speed of light is simply impossible."}, {"id": "908", "title": "Concentration", "text": "Concentration is an expression of how much solute is dissolved in a solvent in a chemical solution. There are multiple units of concentration. Which unit you use depends on how you intend to use the chemical solution. The most common units are mass percent, volume percent, and mole fraction."}, {"id": "907", "title": "Archaic Names", "text": "An archaic name is an older name for a chemical that predates the modern naming conventions. It's helpful to know archaic names of chemicals because older texts may refer to chemicals by these names. Some chemicals are sold under archaic names or may be found in storage labeled with the older names."}, {"id": "906", "title": "Sampling", "text": "In statistics, a predetermined number of observations can be extracted from a larger population. This is called sampling. There are many sampling techniques adopted by researchers and statisticians and the type of sampling depends upon the analysis to be performed. When it seems time consuming to obtain data from every member of the population, then sampling techniques are employed."}, {"id": "905", "title": "Children and Sports", "text": "Parents and kids alike love sports, and it's easy to get caught up in a game and become focused on winning. Yet there is much more to be gained from the sports experience than a winning record. When children and teens are involved in sports, they are able to learn and put into practice values that will stay with them for the rest of their lives."}, {"id": "904", "title": "New Machines", "text": "Modern technology changed a lot from what we saw in the last decade or the past century. New machines and gadgets are invented to make jobs easier like never before. From the little tailor machine to the fastest car in the world, all got automated reducing the manual actions required to the least."}, {"id": "903", "title": "Spiral of Silence", "text": "The spiral of silence is a mass communication theory introduced by Elizabeth to describe the process of public opinion formation. He defines the “spiral of silence” as the process an individual experiences when he may find that the views he holds are losing ground; the more this appears to be so, the less he will be inclined to express his opinion."}, {"id": "902", "title": "Internet", "text": "The internet has grown in importance by many folds, over the process of decade. Its importance in the education world can now never be undermined. Despite the chances of fraud and drawbacks, the use of the internet is like a blessing for students. Today, the internet is something that is present in almost everything we use."}, {"id": "901", "title": "Public Opinion", "text": "Public opinion stabilizes and integrates society because conflicts will be resolved through spirals of silence in favor of one opinion. Wherever people live together in societies, public opinion will function as a mechanism of social control. However, what specifically public opinion approves or rejects will change with time and differ from place to place."}, {"id": "900", "title": "Sportsmanship and Athletes", "text": "Sportsmanship is an understanding of and commitment to fair play, ethical behavior and integrity, and general goodwill toward an opponent. It is an affirmation that an athlete is disciplined enough to have perspective, maintain poise and do what is best for his or her teammates. Being able to make appropriate behavioral choices in a pressure situation will often reveal a player’s character."}, {"id": "899", "title": "Visual Images", "text": "Visual images always have a strong appeal compared to words. Using projectors and visuals to aid in learning is another form of great technological use. Top institutions around the world, now rely on the use of amazing PowerPoint presentations and projections in order to keep the learning interactive and interesting."}, {"id": "898", "title": "Modern Technology", "text": "Modern technology has impacted every area of our lives and become a crucial factor in no time. We even reached a point where everything we use in our daily life is directly or indirectly related to the technological advancement of some form. So, modern technology cannot be avoided even if we intentionally wanted to."}, {"id": "897", "title": "Circadian Rhythm", "text": "An internal “body clock” regulates your sleep cycle, controlling when you feel tired and ready for bed or refreshed and alert. This clock operates on a 24-hour cycle known as the circadian rhythm. After waking up from sleep, you’ll become increasingly tired throughout the day. These feelings will peak in the evening leading up to bedtime."}, {"id": "896", "title": "Master’s in Business Administration", "text": "The curriculum for the Master’s in Business Administration has been specifically crafted to help you advance your career or even manage your own business. Students will learn how to position organizations for a competitive advantage, manage team collaboration and formulate effective business strategies. Our curriculum has been developed by top notch academic leadership to help students succeed."}, {"id": "895", "title": "Studying History", "text": "Studying history helps us understand how events in the past made things the way they are today. Events in the past have displaced families and groups, changing the makeup of regions and often causing tensions. Such"}, {"id": "894", "title": "Water and Health", "text": "Getting enough water every day is important for your health. Drinking water can prevent dehydration, a condition that can cause unclear thinking, result in mood change, cause your body to overheat, and lead to constipation and kidney stones. Water has no calories, so it can also help with managing body weight and reducing calorie intake when substituted for drinks with calories, such as sweet tea or regular soda."}, {"id": "893", "title": "Natural Gas", "text": "Demand for natural gas has grown internationally in recent years, in part because it has a smaller carbon footprint than coal and other fossil fuels. In Singapore, where the government has promoted increased use of natural gas, consumption has grown about ninefold in recent decades. In some places, natural gas consumption has expanded as public opinion has turned against nuclear power."}, {"id": "892", "title": "Voting", "text": "Today, most American citizens over the age of 18 are entitled to vote in federal and state elections, but voting was not always a right for all Americans. Because the Constitution did not specifically say who could vote, this question was largely left to the states in the 1800s. While no longer explicitly excluded, voter suppression is a problem in many parts of the country."}, {"id": "891", "title": "Stanford Medicine", "text": "Throughout history, Stanford Medicine has been home to cutting-edge medical advances, including the first successful adult human heart transplant in the United States and the first combined heart-lung transplant in the world. Stanford School of Medicine is the West Coast’s oldest medical school and worldwide leader in patient care, education and innovation."}, {"id": "890", "title": "Sportsmanship", "text": "Sportsmanship comes in many forms and helps make competitive games fun and enjoyable. It fosters good habits and positive life skills both in and out of sports games, and is an important life skill for people of all ages. It is also key to becoming a mature, respectful, and successful adult."}, {"id": "889", "title": "Falsifiable Science", "text": "Contemporary scholars who study scientific methodology are often frustrated by the implication that science is logically falsifiable. The problem is that scientists can always make excuses to avoid falsifying a claim. The discovery of Neptune is a famous case. Astronomers had noticed irregularities in the orbit of Uranus. One possibility was that these irregularities violated the theory currently used to explain planetary motion, and that this theory should be rejected."}, {"id": "888", "title": "Landing a New Job", "text": "With our current situation and the state of the global economy, there is a much lower chance of landing a new job anytime soon. And it’s unclear when social distancing measures will end or what shape the economy will be in when you are able to return to work."}, {"id": "887", "title": "Implicit Bias", "text": "Like other cognitive biases, implicit bias is a result of the brain's tendency to try to simplify the world. Because the brain is constantly inundated with more information than it could conceivably process, mental shortcuts make it faster and easier for the brain to sort through all of this data."}, {"id": "886", "title": "Good Stress", "text": "It is important to note that even \"good\" stress can lead to spikes in blood sugar levels. Mental and physical stress, such as worrying about your job or getting sick, can create negative stress. But even positive or exciting events, like riding on a roller coaster or winning an award, can create stress on your mind and body."}, {"id": "885", "title": "Impact of Psychology", "text": "Psychology is both an applied and academic field that benefits both individuals and society as a whole. A large part of psychology is devoted to the diagnosis and treatment of mental health issues, but that is just the tip of the iceberg when it comes to the impact of psychology."}, {"id": "884", "title": "Lunar Eclipse", "text": "For a lunar eclipse to occur, the Sun, Earth, and Moon must be roughly aligned in a line. Otherwise, the Earth cannot cast a shadow on the Moon's surface and an eclipse cannot take place. When the three bodies are aligned in a way that the Moon is partly covered by the Earth's umbra, a partial lunar eclipse is the result."}, {"id": "883", "title": "Major Layoffs", "text": "As of Friday, Musk and Twitter had given no public notice of the coming layoffs, according to a spokesperson for California’s Employment Development Department. That’s even though the Worker Adjustment and Retraining Notification statute requires employers with at least 100 workers to disclose layoffs involving 500 or more employees, regardless of whether a company is publicly traded or privately held."}, {"id": "882", "title": "Plastics", "text": "If you walk into your kitchen, almost everything has encountered plastic in one way or another: the plastic bags you stuff into a drawer, your favorite cup, and even the packaging keeping those blueberries fresh. Despite plastic’s ubiquity, we often forget where it comes from. Indeed, when it comes to plastic, our efforts seem much more focused on what happens after rather than before we use it."}, {"id": "881", "title": "Carbon Footprint", "text": "The blame for over-consumption should not and cannot be placed solely on individuals. Companies and corporations have a vested interest in making you buy more stuff because if they don’t, they go bankrupt. This is why they slap green labels onto their products and advertise everywhere. Indeed, the whole idea of a personal carbon footprint is a propaganda campaign created by a fossil fuel giant."}, {"id": "880", "title": "Role of Surrounding", "text": "For as long as society has existed, we’ve understood the role of surrounding influences on our decision-making. With idioms like “It takes a village to raise a child” and “You are the product of your environment,” we understand that to a great extent our upbringing, our parents and the society we grew up in influence our decision making process."}, {"id": "879", "title": "Lions and Lionesses", "text": "Lions and lionesses play different roles in the life of the pride. The lionesses work together to hunt and help rear the cubs. This allows them to get the most from their hard work, keeping them healthier and safer. Being smaller and lighter than males, lionesses are more agile and faster."}, {"id": "878", "title": "Yoga", "text": "But like other low-impact exercises, yoga reliably improves fitness and flexibility in healthy populations. The practice has also been shown to be a potentially powerful therapeutic tool. In studies involving patients with a variety of skeletal disorders, yoga was more helpful at reducing pain and improving mobility than other forms of low-impact exercise."}, {"id": "877", "title": "Busy People", "text": "Someone who looks extremely active, whose diary is filled from morning till night, who is always running to answer messages and meet clients may appear the opposite of lazy, but secretly, there may be a lot of avoidance going on beneath the outward frenzy. Busy people can evade a different order of undertaking."}, {"id": "876", "title": "Core Competence", "text": "The term core competence described a diversified corporation as a large tree. The core products are the trunk and major limbs. The business units are smaller branches, and the end products are the leaves. The core competence is the root system that provides nourishment and stability. It’s essentially what your organization knows about coordinating production and technology."}, {"id": "875", "title": "Maturity and Kindness", "text": "For noble and very understandable reasons, we’ve come to associate maturity and kindness with a capacity not to give up on people. But this broad and generous truth can be in danger of missing out on an important caveat that health and maturity may also require a subtle capacity to give up on one or two people."}, {"id": "874", "title": "Recycling", "text": "The idea behind recycling is simple. By breaking old products down and converting them into something usable again, we conserve natural resources. Sadly it’s not that simple. Recycling is deeply entwined with our economic system, and right now doesn’t make much economic sense. It often costs more to recycle than it does to just throw things away, which is bad news for the environment."}, {"id": "873", "title": "American Birth Rates", "text": "Since its founding, America has enjoyed population growth famously fueled by high immigration rates, but Americans have historically had large families compared to other countries as well. Birth rates today have fallen to their lowest point in history. While birth rates have historically been connected to economic cycles, the present decline is happening during good economic times."}, {"id": "872", "title": "Golden Goose", "text": "Successful economies and cultures are built on trust, but a number of high-profile data breaches and privacy intrusions have caused anxiety for consumers. New legislation may be needed to bolster confidence in the digital marketplace, but we’ve got to be thoughtful about it. So we don’t strangle the golden goose that we call the Internet."}, {"id": "871", "title": "Odor Molecules", "text": "In fact, a lot of what we perceive as flavor comes from odor molecules that float up to our smell receptors through our mouths. And as with taste, studies have shown the visual cues we get from color help us identify smells more quickly and accurately. In fact, one study found that the source of a smell doesn't have to be the corresponding color."}, {"id": "870", "title": "Sensory Information", "text": "When you’re scared, your body will typically try to take in more sensory information. So your face will open up as you breathe more deeply and scan the environment with your eyes. On the other hand, when you’re disgusted, you’ll generally reject sensory information."}, {"id": "869", "title": "Shopping Revolution", "text": "A huge shopping revolution is happening in China right now. For instance, e-commerce in China is soaring. It’s been growing at twice the speed of the United States and a lot of the growth is coming from mobile. Every month, 500 million consumers are buying on mobile phones, and to put that into context, that is a total population of the United States, UK and Germany combined."}, {"id": "868", "title": "Math Anxiety", "text": "People might think that they’re anxious about math because they’re bad at it, but it’s often the other way around. They’re doing poorly in math because they’re anxious about it. Some psychologists think that’s because math anxiety decreases a cognitive resource called working memory. That’s the short-term memory system that helps you organize the information you need to complete a task."}, {"id": "867", "title": "Sensitive Skin", "text": "People with generally sensitive skin have local reactions to chemicals, dyes, and fragrances present in products that come into contact with their skin. They may also get rashes or irritation from clothing or friction. Some people are allergic to certain substances and may react on their skin."}, {"id": "866", "title": "Social Support", "text": "There’s a lot of research out there that suggests social media are a useful tool to stay connected to others. In fact, those who use social media more also report feeling more social support. However, all of this comes with a huge caveat: we simply don’t know about cause and effect."}, {"id": "865", "title": "Lullaby", "text": "A lullaby or cradle song, is a soothing song or piece of music that is usually played for children. The purposes of lullabies vary. In some societies they are used to pass down cultural knowledge or tradition. Lullabies can be found in many countries, and have existed since ancient times."}, {"id": "864", "title": "News Sharing", "text": "Social media is a powerful tool for making people feel more knowledgeable and may have benefits for people’s mental health. ‘Feeling smart can improve self-esteem,’ commented Dr. Ward. Indeed, studies have shown that news sharing can lead to social learning and political engagement encouraging people to take more active roles in their communities."}, {"id": "863", "title": "Environmental Damage", "text": "Environmental damage does not affect all people equally. For this reason, some people may feel anxiety around ecological issues more intensely. Some parts of the world are more vulnerable to the effects of extreme weather, including coastal communities and low-lying areas. Particularly, people whose livelihoods depend on the environment — such as those with jobs in fishing, tourism, and agriculture — are more likely to be affected."}, {"id": "862", "title": "Historical Contingency", "text": "The teleology and historical contingency of biology make it unique among the sciences. Both of these features stem from perhaps biology’s only general guiding principle: evolution. It depends on chance and randomness, but natural selection gives it the appearance of intention and purpose. Animals are drawn to water not by some magnetic attraction, but because of their instinct to survive."}, {"id": "861", "title": "Mental Illness", "text": "In the not-so-distant past, society shunned people with mental health conditions. Some people believed that evil spirits or divine retribution were responsible for mental illness. Although this way of thinking has been extricated from society in much of the world, it still casts a long shadow."}, {"id": "860", "title": "Liver Cancer", "text": "Liver cancer can be fatal, but experts are still working to understand how to best screen for and prevent liver cancer. Data from a recent study suggests that a diet high in processed fiber could increase some people’s liver cancer risk. Testing for the level of bile acids could help identify people at risk of developing liver cancer who may need a lower intake of fiber."}, {"id": "859", "title": "Eco-anxiety", "text": "Eco-anxiety refers to a fear of environmental damage or ecological disaster. This sense of anxiety is largely based on the current and predicted future state of the environment and human-induced climate change. Anxiety around environmental issues may stem from the awareness of a rising risk of extreme weather events, losses of livelihood or housing, fears for future generations, and feelings of helplessness."}, {"id": "858", "title": "Subjective and Objective", "text": "To understand how sharing affects a person’s subjective and objective knowledge, the researchers gave a group of students the opportunity to read and share a range of news articles. The students then had to rate their subjective knowledge of each article before completing three multiple-choice questions that assessed their objective knowledge."}, {"id": "857", "title": "Cash-flow Problem", "text": "While costs are rising, artist fees are not, and tickets to regular shows are harder to move than ever. Many fans aren’t ready to return to the crowded mosh; others are dealing with the cost of living crisis. And with the exception of blockbuster shows, people who do buy tickets are tending to buy them last-minute, creating a cash-flow problem for artists."}, {"id": "856", "title": "Affordable Childcare", "text": "Over the longer term, higher educational institutions are supported to either provide on-campus nursery space or work with established local nurseries to provide affordable childcare for students and staff. This should be a"}, {"id": "855", "title": "Almonds", "text": "Eating a handful of almonds a day significantly increases the production of butyrate, a short-chain fatty acid that promotes gut health. Whole-almond eaters had an additional 1.5 bowel movements per week compared to the other groups. Eating almonds could also benefit those with constipation."}, {"id": "854", "title": "Essential Carbon", "text": "The carbon is essential to life on earth, but scientists still struggle to grasp its complexities. Most research to date has focused on major sources of the greenhouse gas carbon dioxide, and the use of fossil fuels. A new study has come to the counter-intuitive conclusion that plants might accumulate more carbon in the presence of predators and herbivores."}, {"id": "853", "title": "Subject Outlines", "text": "Your subject outlines are a good place to go to find information about which textbooks to buy. You will usually be given one of these for each subject in the first lecture, but if you are missing one or need one earlier then you should contact the subject coordinator."}, {"id": "852", "title": "Reserve Bank", "text": "Most people do not realize that some banks literally make money by giving loans without having money on deposit. The system is called fractional reserve banking and is used in most economies. It sounds as though it is safe because it says that banks have to keep a fraction of their deposits with the Reserve Bank."}, {"id": "851", "title": "War and Commodity", "text": "In the past, wars have led to inflation and higher commodity prices. Fighting disrupts trade and prevents raw materials from being shipped from one country to another. In second-world-war Britain, a banana was the highest of luxury."}, {"id": "850", "title": "Global Changes", "text": "Globalization refers to a set of changes rather than a single change. Many of these changes are social, cultural and political rather than purely economic, and one of the main drivers in addition to the global marketplace is the communication revolution."}, {"id": "849", "title": "Female Undergraduates", "text": "The most obvious change is that 46% of college undergraduates are now women. When I went there, it was only the third year that women had been admitted, and then seemingly grudgingly: about 70% of students were male, and if there was a woman tutor she must have been a male impersonator."}, {"id": "848", "title": "Turbine Blade", "text": "It’s not easy to make a wind turbine blade. Conventional blades require a lot of labor. They are a sandwich composed of fiberglass, sheets of balsa wood and a chemical called an epoxy thermoset resin. A heat oven is required to give blades the proper shape, strength, smoothness and flexibility to catch the wind and turn the turbine."}, {"id": "847", "title": "Disordered Eating", "text": "The most significant difference between an eating disorder and disordered eating is whether or not a person's symptoms and experiences align with the criteria defined by the American Psychiatric Association. The term \"disordered eating\" is a descriptive phrase, not a diagnosis."}, {"id": "846", "title": "Locusts", "text": "Titanic swarms of desert locusts resembling dark storm clouds are descending ravenously on the Horn of Africa. They're roving through croplands and flattening farms in a devastating salvo experts are calling an unprecedented threat to food security. On the ground, subsistence planters can do nothing but watch — staring up with horror and at their fields in dismay."}, {"id": "845", "title": "Stationary Bike", "text": "A stationary bike workout is a low-impact workout that uses smooth movements to strengthen bones and joints without putting much pressure on them. Because your feet don’t lift off the pedals with a stationary bike, this option is kinder to your joints, but it still provides a challenging and effective workout."}, {"id": "844", "title": "Revolving Restaurants", "text": "The popular trend of revolving restaurants and bars began sometime in the early Sixties after the successful launch of such towering creations as the Space Needle. But as the novelty wore off, the mechanical upkeep and maintenance of such ventures proved to be too costly for some entrepreneurs over time and many once famous icons like Encounter Restaurant have since closed."}, {"id": "843", "title": "Eiffel Tower", "text": "Since the beginning, the Eiffel Tower drew attention and served as the theatre for numerous events in the life of Paris and France. The Tower can be seen from many and various points around Paris and its suburbs. It is photographed, filmed and replicated in all kinds of circumstances. It naturally slipped into the role of symbolizing France in the collective imagination and in literature and poetry."}, {"id": "842", "title": "Construction of Dams", "text": "The construction of dams is labour intensive. Before construction begins, water is diverted or prevented from moving through the construction site. After water is diverted, the foundation area is excavated, and sediments that will act as the foundation are repaired. This is done to ensure the sediments won't shift or fail as a result of the load of the dam and reservoir."}, {"id": "841", "title": "Flash Floods", "text": "Many floods take hours to come into full effect so they provide people with time to evacuate safely while salvaging as many of their valuable possessions as they can. Sometimes, however, floods generate in minutes and give little warning to their formation. These are known as flash floods, and can be extremely dangerous. Flash floods are the top one weather-related cause of death in the United States."}, {"id": "840", "title": "Nuclear Safety", "text": "The prime responsibility for nuclear safety must rest with the person or organization responsible for these activities. Regulating safety is a national responsibility. However, radiation risks may transcend national borders, and international cooperation serves to promote and enhance safety globally by exchanging experience and by improving capabilities to mitigate any harmful consequences."}, {"id": "839", "title": "Particle Accelerator", "text": "Particle accelerators produce and accelerate beams of charged particles, such as electrons, protons and ions, of atomic and sub-atomic size. They are used not only in fundamental research for an improved understanding of matter, but also in plethora of socioeconomic applications related to environmental monitoring, food quality, energy and aerospace technologies."}, {"id": "838", "title": "Washing Machine", "text": "Programs, such as delicate wash or color wash, are one of the features of washing machines, particularly fully automatic washing machines, which gives you the choice when it comes to how you want to wash your clothes. If you’re washing with a certain fabric, then programs help you find the optimal washing conditions for your laundry needs from selecting the right wash temperature to setting up your washing timing."}, {"id": "837", "title": "Pocket Money", "text": "Giving pocket money to children as young as four or five years helps them start learning about the value of money and money management. When children get pocket money, they have to make choices about spending or saving. Pocket money can also help children learn about consequences, including the consequences of losing money or spending it unwisely. Letting your children make a few mistakes is part of the learning process."}, {"id": "836", "title": "Supermassive Black Hole", "text": "Astronomers announced that they have finally assembled an image of the supermassive black hole at the center of our galaxy. This image shows a bright ring surrounding the darkness, the telltale sign of the shadow of the black hole. It reveals the turbulent, twisting region immediately surrounding the black hole in new detail."}, {"id": "835", "title": "Home Fencing", "text": "The benefits of home fencing are not only as a barrier between the area of the house and the surrounding environment. In simple words, a fence is a formation or structure that is above the ground and is generally vertical, with the intention of limiting an area or area, protecting everything inside the fence, from threatening danger from outside the fence."}, {"id": "834", "title": "Frogs", "text": "Frogs have excellent night vision and are very sensitive to movement. The bulging eyes of most frogs allow them to see in front, to the sides, and partially behind them. When a frog swallows food, it pulls its eyes down into the roof of its mouth, to help push the food down its throat."}, {"id": "833", "title": "Property Right", "text": "A common way of permitting others to use an intellectual property right is to give express permission for it. This can be done in return for financial remuneration. In such cases, the holder of an intellectual property right is often referred to as granting a license to use what the holder otherwise has exclusive rights to, subject to certain conditions."}, {"id": "832", "title": "Copyright", "text": "Anyone who creates something artistic, such as fashion photos on the shoe, automatically has copyright to them. It consists of a financial right that is possible to license or sell, and a non-profit right that cannot be agreed away. The latter means that you always have the right to be mentioned in connection with your work being used."}, {"id": "831", "title": "Ecofuels", "text": "Fast growth in both world energy demand and carbon dioxide emissions due to fossil fuels has resulted in search for alternative sources which are not only renewable but also environment friendly. One of these alternative source is ecofuels which are solid, liquid, or gaseous fuels primarily produced from biomass. The solid ecofuels include wood, animal dung, municipal waste, and energy crops."}, {"id": "830", "title": "Hernia", "text": "A hernia is a weakness or opening in the abdominal wall, which often results in soft tissue such as fat protruding through the abdominal muscles and occupying space under the skin. The mechanism of the hernia is similar to what happens with a bulge in a damaged tire, where the inner tube, normally contained by the hard rubber of the tire, extends through a thin or weakened place."}, {"id": "829", "title": "International Women's Day", "text": "International Women's Day is marked on March 8 every year. Countries around the world celebrate it to give credit to the economic, political and social achievements of women and to show respect to their contributions in the development of their countries. It's only in the beginning of the 20th century that the day was officially and internationally acknowledged due to the rapid industrialization and the social protest that it accompanied."}, {"id": "828", "title": "What We Want", "text": "We want a recreation in adulthood of what it felt like to be administered to and indulged. In a secret part of our minds, we picture someone who will understand our needs, bring us what we want, to be immensely patient and sympathetic to us, act selflessly, and make it all better."}, {"id": "827", "title": "Flood Control", "text": "We've spent a lot of money over the last seventy years on flood control, and it's protected millions of people and has saved us billions of dollars. We've built dams to hold back the waters. We've built levees to keep the water off the people, and we've raised the ones that were originally started in seventeen eighteen."}, {"id": "826", "title": "Macroeconomics", "text": "This report includes a huge swath of macroeconomics, such as the effects of tax reform, a new industrial policy, and understanding how to deal with the uncertainty inherent in global financial market. But it also covers key areas of microeconomic policies, such as boosting laggardly rates of productivity."}, {"id": "825", "title": "Contribution to Book", "text": "Many individuals have unwittingly contributed to this book through sharing ideas with us as colleagues, students, practitioners, tourists, and residents of destination areas. They are too numerous to thank individually. And indeed, it is not possible to isolate exactly their specific contributions."}, {"id": "824", "title": "Your Thesis", "text": "It is normally expected that the final version of your thesis which must be submitted to the university library in both hardcopy and electronic form will be freely available to the public. Once in the library, your thesis may be consulted, borrowed and copied in accordance with the regulations."}, {"id": "823", "title": "Committee Gratitude", "text": "The committee would also like to express its gratitude to the independent assessors who joined the committee for consideration of each case. Their expertise and advice play a vital role in our work. A list of independent assessors who attended meetings during this reporting year is included at Appendix D."}, {"id": "822", "title": "Wi
