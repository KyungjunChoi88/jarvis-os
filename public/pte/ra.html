xt": "Scientists already knew that the output of a single wind turbine could be improved with a windbreak. While windbreaks slow wind speed close to the ground, above the height of the windbreak, wind speeds actually increase as air rushes over the top. But for large wind farms, there’s a drawback."}, {"id": "623", "title": "The Office of the Future", "text": "To bridge gaps between teams, one tactic is to set aside more of the office to showcase the work of each department, so that people who never encounter each other on Zoom can see examples of what their colleagues do. Another option is to ply everyone with drink. Expect more space to be set aside for socialising and events."}, {"id": "622", "title": "The Next Food Revolution", "text": "Today’s global food system is responsible for around a third of greenhouse-gas emissions and meat production is one of the biggest culprits. Despite this environmental impact, meat-eating is on the rise. Plant-based and lab-grown alternatives can convert carnivores away from conventional meat and reduce emissions."}, {"id": "621", "title": "The Decreased Sunlight", "text": "The amount of sunlight that Earth reflects back into space has decreased measurably in recent years. Whether the decline in earthshine is a short-term blip or yet another ominous sign for Earth’s climate is up in the air, scientists suggest."}, {"id": "620", "title": "Elephants", "text": "When a male African savanna elephant folds his ears while simultaneously waving them, he’s ready for a fight. When a female folds her ears and accompanies the action with an ear flap, that means she’s also issuing a serious threat. But when elephants come together and fold their ears, the animals are expressing a warm greeting."}, {"id": "619", "title": "Animals in Science", "text": "Many scholars attribute the 17th-century belief that animals were mere machines devoid of fear, pain or pleasure to the French mathematician, philosopher and scientist. Animals’ feelings, even if present, were morally irrelevant to Descartes, who attempted to prove his point by subjecting dogs and rabbits to exquisite torture."}, {"id": "618", "title": "Carbon Dioxide", "text": "Every metric ton of carbon dioxide humans emit comes at a cost — not only in terms of the financial toll of the damage wrought by floods, heat waves and droughts but also the price in human lives. Substantially curtailing emissions today could prevent tens of millions of premature deaths over the course of this century."}, {"id": "617", "title": "Certain Gestures", "text": "When learning a foreign language, most people fall back on traditional methods: reading , writing, listening and repeating. But if you also gesture with your arms while studying, you can remember the vocabulary better, even months later. Linking a word to brain areas responsible for movement strengthens the memory of its meaning."}, {"id": "616", "title": "New Mineral", "text": "A diamond that formed deep in the earth’s mantle contains a mineral never seen before in nature. The discovery is a rare glimpse into the deep mantle and may help reveal new information about the structure of the planet at depths of more than 660 kilometers. This can help geologists better understand how the mantle controls the earth’s plate tectonics."}, {"id": "615", "title": "Early Detections", "text": "If a single medical objective could be applied to the entire range of cancers, it would be detecting the disease as soon as possible. “At the highest level, finding any cancer early gives you the opportunity for curative treatments,” says the CEO of a research funding organization."}, {"id": "614", "title": "Alien Life", "text": "Relatively soon, some prominent astrobiologists say, we will most likely have either found compelling evidence for extraterrestrial life or banished its possible existence to the ever shrinking edges of the cosmos beyond the rapidly expanding reach of our observations. Such answers could come by the end of this century from any of a number of initiatives ardently seeking alien life."}, {"id": "613", "title": "Cancer", "text": "Cancer is most treatable when caught early. But despite the vast resources aimed at finding ways to detect the disease in its initial stages, many people who qualify for existing screenings still do not receive them. Some are unfamiliar with the constantly evolving guidelines on when and where to get tested. Others have never been informed that they need exams in the first place."}, {"id": "612", "title": "Children's Motor Skills", "text": "Residential density is related to children's motor skills, engagement in outdoor play and organized sports. Finnish children living in the countryside spent more time outdoors and had better motor skills than their age peers in the metropolitan area. On the other hand, children living in the metropolitan area participated the most in organized sports."}, {"id": "611", "title": "Egg-shape", "text": "Egg-shape has long attracted the attention of mathematicians and biologists from an analytical point of view. The shape has been highly regarded for its evolution as large enough to incubate an embryo, small enough to exit the body in the most efficient way, not roll away once laid, is structurally sound enough to bear weight and be the beginning of life for so many species."}, {"id": "610", "title": "Income Inequality", "text": "Income inequality -- a measure of how unevenly income is distributed through a population --has long been associated with a host of health and social problems including mental health issues, lack of trust, higher rates of imprisonment and lower rates of social mobility. It may also affect academic achievement, through various routes."}, {"id": "609", "title": "Medicine and Values", "text": "How would you feel about a new therapy for your chronic pain, which—although far more effective than any available alternative—might also change your religious beliefs? Or a treatment for lymphoma that brings one in three patients into remission, but also made them more likely to vote for your least preferred political party?"}, {"id": "608", "title": "Climate Pledges", "text": "Each year, the UN publishes a report evaluating the gap between the latest climate pledges and the Paris Agreement’s goals. It concludes that the world is falling short. This year’s report finds that the updated pledges would probably result in warming of around 2.7."}, {"id": "607", "title": "Attractiveness", "text": "A new study found that while a 'beauty premium' exists across professions, it's partially because attractive people develop distinct traits as a result of how the world responds to their attractiveness. They build a greater sense of power and have more opportunities to improve nonverbal communication skills throughout their lives."}, {"id": "606", "title": "Traffic Congestion", "text": "City planners predict that as more people move into urban areas, traffic jams will get worse. That's why sustainability experts propose a new way to analyze traffic congestion. Using more precise measures to describe the shape of cities and considering other socioeconomic factors, the model, which was applied to nearly 100 American cities, could lead to a better understanding of the link between congestion and land use."}, {"id": "605", "title": "Team's Emotions", "text": "If you're putting together a team for a project, you might be inclined to pick people with cheerful, optimistic dispositions and flexible thinking. But a new management study indicates your team might also benefit from people who are exactly the opposite, according to experts at Rice University, the University of Western Australia, Bond University and the University of Queensland."}, {"id": "604", "title": "Obesity", "text": "Chronic inflammation caused by obesity may trigger the development of cells that break down bone tissue, including the bone that holds teeth in place, according to new research at Buffalo University that sought to improve understanding of the connection between obesity and gum disease."}, {"id": "603", "title": "Underground Microbes", "text": "Precambrian cratons -- some of Earth's oldest rocks -- were uninhabitable for microbes for much of their existence, with the longest period of habitability not much beyond a billion years, and many only for the past 50 million to 300 million years, according to a paper correlating Earth's deep biosphere with geologic history."}, {"id": "602", "title": "Protein Songs", "text": "In recent years, scientists have created music based on the structure of proteins as a creative way to better popularize science to the general public, but the resulting songs haven't always been pleasant to the ear. In a new study, researchers use the style of existing music genres to guide the structure of protein song to make it more musical."}, {"id": "601", "title": "T Cells", "text": "Scientists are now trying to find ways to help treat patients by jumpstarting those lackluster T cells. Much of the research in this field, known as cancer immunotherapy, has focused on finding ways to stimulate those T cells directly. MIT researchers have now uncovered a possible new way to indirectly activate those T cells, by recruiting a population of helper immune cells called dendritic cells."}, {"id": "600", "title": "Summerhill School", "text": "Summerhill School was regarded with considerable suspicion by the educational establishment. Lessons were optional for pupils at the school, and the government of the school was carried out by a School Council, of which all the pupils and staff were members, with everyone having equal voting rights."}, {"id": "599", "title": "Night Sky", "text": "Nature offers no greater splendor than the starry sky on a clear, dark night. Silent, timeless, jeweled with the constellations of ancient myth and legend, the night sky has inspired wonder throughout the ages — a wonder that leads our imaginations far from the confines of Earth and the pace of the present day, out into boundless space and cosmic time itself."}, {"id": "598", "title": "Language Diversity", "text": "Despite a number of events in recent years devoted to language diversity, language endangerment, and multilingualism, such as the International Year of Languages, public awareness of the issues is still remarkably limited. Only one in four of the population know that half the languages of the world are so seriously endangered that they are unlikely to survive the present century."}, {"id": "597", "title": "Statistical Chance", "text": "The survey found that the statistical chances of someone from a poor background being accepted at one of the country's most respected universities are far lower than those of a student from a wealthy family. This means that the inequalities in society are likely to be passed down from one generation to the next."}, {"id": "596", "title": "Effective Regualtions", "text": "There is every reason to believe that effective regulations are not merely a luxury that only the rich can afford, but an important foundation for a thriving private sector and economic growth. But the broad pattern of the past five years has been that the main reform efforts are taking place in rich countries."}, {"id": "595", "title": "Orchestras", "text": "The advantage of the great European and American orchestras is that they were able to establish their iconic status in an age when their identity could become entrenched, there was less competition and it was easier to create a brand. Not only did they have the best halls, they attracted the best musicians, who tended to stay put."}, {"id": "594", "title": "Goods and Services", "text": "Quite obviously, a significant rise in the number of people in a given area or country will affect the demand for a whole host of goods and services. Note that a change in the structure of the population will increase the demand for some goods but reduce the demand for others."}, {"id": "593", "title": "Job Hours", "text": "Most of us spend on average 18 hundred hours per year in our jobs, and will work for about 40 years before retirement. When you consider the amount of time spent in the office, you soon realize how important it is to feel a sense of achievement at the end of the day, rather than just meeting financial objectives."}, {"id": "592", "title": "Extroverts", "text": "Extroverts tend to move quickly and try to influence situations directly, while introverts give themselves time to develop their insights before exposing them to the world. Extroverts are happy making decisions in the thick of events, while introverts want to reflect before taking action."}, {"id": "591", "title": "Competence in Chemistry", "text": "A level of competence in chemistry is essential to the professional practice of material conservation. An understanding of scientific concepts and a basic scientific vocabulary enables the conservator to understand conservation problems, treatments, material techniques in a systematic and quantifiable way, which can be communicated not only to colleagues in the profession but also those from other disciplines."}, {"id": "590", "title": "Volunteering", "text": "For graduates looking to give something back, volunteering, either in the UK or overseas, is a popular option. Voluntary projects can cost anything from nothing up to a few thousand pounds, and with that in mind it is essential to look into the project carefully before signing on the dotted line."}, {"id": "589", "title": "Tissues and Organs", "text": "Tissues are grouped together in the body to form organs. These include the brain, heart, lungs, kidneys, and liver. Each body organ has a specific shape and is made up of different types of tissue that work together. For example, the heart consists mainly of a specialized type of muscle tissue, which contracts rhythmically to provide the heart's pumping action."}, {"id": "588", "title": "Hunter-gatherer", "text": "The life of a hunter-gatherer is indeed, as Thomas Hobbes said of the state of nature, ' solitary, poor, nasty, brutish, and short'. In some respects, to be sure, wandering through the jungle bagging monkeys may be preferable to the hard slog of subsistence agriculture."}, {"id": "587", "title": "Examination of Domicile", "text": "At an early stage in the examination of the domicile of dependency rule in so far as it related to married women it seemed to the Commission that it would be better to examine the whole concept of domicile, particularly as dependent domicile arises in the case of minors (children under the age of majority) and mentally disordered persons as well as in the case of married women."}, {"id": "586", "title": "Political Declaration", "text": "The Assembly also decided that, at that special session, it would adopt a concise and action-oriented political declaration, agreed upon in advance by consensus through intergovernmental negotiations under the auspices of the Conference."}, {"id": "585", "title": "Plato", "text": "Plato often explores the father-son relationship and whether a father's interest in his sons has anything to do with how well his sons turn out. A boy's social identity in ancient Athens was determined by his family identity, and Plato often refers to his characters in terms of their parental and fraternal relationships. Socrates was not a family man and considered himself as his mother's son."}, {"id": "584", "title": "Charlie Parker", "text": "Charlie Parker noticed that the solos were only improvised through the melodies, but that he could also improvise them through the chords, thus creating new variations over the structure of the songs, and also playing more notes and faster."}, {"id": "583", "title": "Children Helping Others", "text": "Children as young as 14 months old will spontaneously help others for no reward. But a study of 3 to 5 year olds found that, although they would spontaneously draw pictures, if they were given a reward for drawing pictures, then later they wouldn’t make any drawings unless a reward was offered."}, {"id": "582", "title": "Colonial Institution", "text": "The colonial institution has a lengthy and illustrious history that dates back over 200 years. Many of the persons who have worked here are scientists themselves, such as Albert Einstein. He produced breakthroughs that made it simpler to produce and use electricity, allowing us to do things like switch on lights, cook dinner, and play video games on consoles."}, {"id": "581", "title": "Aquaculture", "text": "Aquaculture, also known as aquafarming, is the farming of aquatic organisms such as fish, crustaceans, molluscs and aquatic plants. Aquaculture involves cultivating freshwater and saltwater populations under controlled conditions."}, {"id": "580", "title": "Landscape", "text": "Yet this landscape, which appeared so alien and confronting to the white settlers and explorers, had been home for thousands of years to Indigenous Australians for whom the plains, ranges and deserts were a sustaining, spiritual and integral part of their existence."}, {"id": "579", "title": "Voice and Text", "text": "The term ‘voice' and ’text' are multifaceted. Both have a wide range of meanings in everyday speech and academic usage. You may encounter the two used in a variety of ways. In connection with different subjects, and they won't always mean exactly the same thing."}, {"id": "578", "title": "Early Pictures", "text": "The majority of early pictures in the Gallery's care are by unknown artists, and fundamental question, such as when, where and why they were painted still remain to be answered. Through the application of scientific methods, this has potential to unlock key that will allow us to determine answers to these questions."}, {"id": "577", "title": "Canada", "text": "With a population of only just over 30 million living in the world's second largest country, Canada is justly renowned for vast tracts of wilderness untroubled by pollution either from industry or from intensive farming methods. A major conservation issue is the battle to stop the logging of virgin forest in northern Ontario and on the west coast."}, {"id": "576", "title": "Possible Understanding", "text": "The question is asked: \"How is understanding possible?\" The technique for thinking of this approach is that, while Scripture is \"something past a standard substance,\" Scripture is in the principle examination \"content\" which individuals endeavor to appreciate; in this sense, the benchmarks of seeing any substance applied to the Bible additionally paying little regard to whatever other additional, especially philosophical gauges are considered."}, {"id": "575", "title": "Labor Migration", "text": "Most countries are affected by labor migration. In many rural places, the traditional extended family has been undermined by the need for family members to migrate to towns as an economic necessity. Migration, therefore, presents a major challenge everywhere to social and economic policy."}, {"id": "574", "title": "Tidal Energy", "text": "Tidal energy, also known as tidal power, is a renewable source of energy and a form of hydropower used to generate electricity from the energy of the tides. Though not currently widely utilized, due to high costs and limited availability, it can be called the energy resource of the future given the current rate of depletion of energy resources."}, {"id": "573", "title": "Nature of Reality", "text": "In attempts to understand the very nature of our reality, physicists sure have some mind-bending theories. Like what if information is a tangible and fundamental aspect of physical reality itself – alongside matter and energy? Or, alternatively, what if information is the fifth state of matter?"}, {"id": "572", "title": "Blue Whale", "text": "Blue whales are the largest living mammals. Though reports of maximum length and weight vary from one account to another, Antarctic blue whales are known to have reached lengths to 100 feet and weights of over 150 tons before stocks were severely depleted by whaling operations. North Atlantic blue whales may be expected to reach lengths of 80-85 feet."}, {"id": "571", "title": "Calcium", "text": "Calcium plays an extremely important role in the production of plant tissues and enables plants to grow better. It is responsible for keeping the cell walls of plants together. It is also crucial in activating signals that coordinate certain cellular activities. Calcium also increases the resistance to external attacks and increases the feed value of forage crops to livestock."}, {"id": "570", "title": "Conscientiousness", "text": "Conscientiousness is a fundamental personality trait. A conscientious person is good at self-regulation and impulse control. This trait influences whether you will set and keep long-range goals, deliberate over choices, behave cautiously or impulsively, and take obligations to others seriously."}, {"id": "569", "title": "Global Order", "text": "The defining question about global order for this generation is whether China and the United States can escape Thucydides’s Trap. The Greek historian’s metaphor reminds us of the attendant dangers when a rising power rivals a ruling power—as Athens challenged Sparta in ancient Greece, or as Germany did Britain a century ago."}, {"id": "568", "title": "Major Disaster", "text": "When a major disaster strikes, the first people on the scene are often local organizations, residents and volunteers. They are often faced with the retrieval and immediate management of dead bodies before forensic experts can arrive."}, {"id": "567", "title": "Projected Temperature", "text": "It’s projected that, over the next hundred years, temperatures on Earth could rise an average of nearly five degrees Celsius. While some animals might be able to migrate north to escape the brunt of the heat, plants can’t uproot themselves quite so easily. Researchers wondered whether the creatures that disperse plant seeds might be able to help."}, {"id": "566", "title": "Artificial Intelligence", "text": "Artificial intelligence has been one of the most controversial domains of inquiry in computer science since it was first proposed in the 1950s. Defined as the part of computer science concerned with designing systems that exhibit the characteristics associated with human intelligence understanding language, learning, reasoning, solving problems."}, {"id": "565", "title": "Impossible Dream", "text": "Whether you're climbing your way up the corporate ladder or overwhelmed with the organizational tasks of home and kids, a luxurious vacation to an exotic paradise may seem like an impossible dream. You can only fantasize about an outdoor massage among fragrant island flowers or a nap after enjoying a brunch ripe with fruits fresh from the vine."}, {"id": "564", "title": "Emerald", "text": "Emerald is defined by its green color. To be an emerald, a specimen must have a distinctly green color that falls in the range from bluish green to green to slightly yellowish green. To be an emerald, the specimen must also have a rich color. Stones with weak saturation or light tone should be called \"green beryl.\" If it is greenish yellow it is \" heliodor.\" This color definition is a source of confusion."}, {"id": "563", "title": "Permafrost", "text": "Permafrost is ground that is frozen year-round. In the Arctic, ice-rich permafrost soils can be up to 260 feet thick. Due to human-caused warming of the atmosphere from greenhouse gas emissions, a steady thawing of the permafrost is currently taking place where the upper layer of seasonally thawed soil is gradually getting thicker and reaching deeper into the ground."}, {"id": "562", "title": "Delta", "text": "As the Delta variant of coronavirus sweeps the U.S. businesses, universities and cities such as New York and San Francisco have introduced vaccine mandates to boost uptake of jabs, but vaccine hesitancy remains high and a cottage industry for bogus inoculation cards has emerged to help people get around the rules."}, {"id": "561", "title": "Optogenetics", "text": "Optogenetics is a research tool in neuroscience that uses light to alter the activity of genetically engineered light-sensitive nerve cells to better understand the function and behavior of clusters of neurons in animals. Now, a team led by researchers from the Korea Advanced Institute of Science and Technology has developed an implantable optogenetic light-emitting device that can be wirelessly recharged."}, {"id": "560", "title": "Virtual Reality", "text": "Many employers outside of the military cannot comprehend the myriad of acronyms soldiers may initially struggle to stop using in their daily work. Some veterans may also struggle to explain how their experience can be applied in a non-military environment. One potential solution comes in an unlikely form: virtual reality (VR)."}, {"id": "559", "title": "Tests of drug", "text": "Tests of a drug known to stimulate brain activity have shown early success in reducing symptoms of sluggish cognitive tempo in 38 men and women with attention deficit hyperactivity disorder. It also significantly corrected deficits in executive brain function, with fewer episodes of procrastination, improvements in keeping things in mind, and strengthened prioritization skills."}, {"id": "558", "title": "Stale Water", "text": "There are many reasons why water tastes stale when it is kept for a long time. Microorganisms play a big role in this phenomenon. When they grow, they release chemicals into the water from their metabolic activity. This evaporates over time, so the absence of it from water left out for a long period brings about a change in taste."}, {"id": "557", "title": "Blood Sugar", "text": "Australian scientists say they have developed pain-free blood sugar testing for diabetics, a non-invasive strip that checks glucose levels via saliva for diabetics. Managing their blood sugar levels typically means pricking their fingers multiple times a day with a lancet and then placing a drop of blood on a testing strip."}, {"id": "556", "title": "Fifth-largest Economy", "text": "Just as the world's fifth-largest economy emerges from the COVID-19 pandemic, the post-Brexit shortage of truck drivers and a spike in European natural gas prices has left the UK grappling with the grim prospect of a potential food supply crunch and soaring energy bills."}, {"id": "555", "title": "Interludes", "text": "The interludes which break up the gameplay action, and which, because they can be made to a higher level of animation, often provide the most visually arresting sequences of a game. Combined with a taste for bizarrely complicated, recursive plots, and long sequences of wordy explicatory dialogue, this turns the games into a bit of a drag."}, {"id": "555", "title": "Landmark", "text": "In a landmark report published on Monday, the international financial institution called on states to reduce global emissions and bridge the development gap to avoid the effects of slow-onset climate change such as water scarcity, decreasing crop productivity, and rising sea levels."}, {"id": "554", "title": "Pronunciation", "text": "Pronunciation is the way in which a word or a language is spoken. This may refer to generally agreed-upon sequences of sounds used in speaking a given word or language in a specific dialect (\"correct pronunciation\") or simply the way a particular individual speaks a word or language."}, {"id": "553", "title": "Soil", "text": "Soil is the top layer of the Earth's surface, mostly created from weathered rock. It is made up of varying amounts of minerals, humus, or decayed organic matter, and useful living creatures like worms. The finest rock particles within soil - forms sticky clay, the medium particles become silt, and the coarsest constitute sand. While there is sufficient moisture, soil supports vegetation, providing a habitat for a variety of animals."}, {"id": "552", "title": "Termites", "text": "Termites, the tiny creatures – have learnt to create a comfortable home in some of the world's toughest climates. Outside, in the African Savannah the temperatures vary from forty degrees in the day to one degree at night. Yet, inside the mound, the temperature stays constant."}, {"id": "551", "title": "Bad Habits", "text": "A meteorite that fell on Earth more than a century ago may contain some of the first concrete evidence for a cosmic mash-up in the early solar system. Following the birth of our sun 4.5 billion years ago, it is thought that Jupiter’s formation caused two reservoirs of asteroids to gather in the solar system, one inside the giant planet’s orbit and one outside."}, {"id": "549", "title": "Smartphones", "text": "Smartphones have become an everyday essential for millions of us – we rely on them for everything from updating our social media profiles to banking. Taking out a smartphone contract that bundles together your calls, data, and texts with the cost of the handset can help spread the cost – but can also mean you’ll pay more over the long run."}, {"id": "548", "title": "Hottest Month", "text": "The Earth just had the hottest month in recorded history, and it’s even worse than normal. The record comes in a run of unprecedentedly hot months. Not only does it break through the all-time record set a year before, it also continues a now 10-month long streak of months that are the hottest ever according to NASA data. The National Oceanic and Atmospheric Administration calculates temperatures slightly different."}, {"id": "547", "title": "Universities of Europe", "text": "During the Early Modern period, the universities of Europe would see a tremendous amount of growth, productivity, and innovative research. At the end of the Middle Ages, about 400 years after the first European university was founded, there were twenty-nine universities spread throughout Europe."}, {"id": "546", "title": "Student Loan", "text": "Since 2003, borrowing for education advanced faster, in percentage terms, than all other types of consumer debt that includes mortgages, auto loans and credit cards, data from the Federal Reserve Bank of New York show. As of the fourth quarter, student loans represented 10.5 percent of a record $13.1 trillion in household debt, up from 3.3 percent at the start of 2003."}, {"id": "545", "title": "Soft Drink", "text": "The main production of soft drink was stored in 1830’s. Since then from those experimental beginning, there was an evolution until in 1781 when the worlds first cola-flavored beverage was introduced. These drinks were called soft drinks, only to separate them from hard alcoholic drinks. Today, soft drink is more favorite refreshment drink than tea, coffee, juice, etc.."}, {"id": "544", "title": "Low-Earth Orbit", "text": "\"Low-Earth orbit is now more accessible for more people to experience the wonders of space\", tweeted NASA administrator Bill Nelson, who was a congressman when he hitched a ride on a space shuttle decades ago."}, {"id": "543", "title": "Newer Sites", "text": "Newer sites usually are more accessible than older ones. Many facility owners and operators may not have the experience or knowledge to determine the level of accessibility on their sites. If they have never received any complaints, they may mistakenly assume that no problems exist. Inspect all areas of the site carefully to make an accurate assessment of its level of accessibility."}, {"id": "542", "title": "Greenhouse Gases", "text": "Human beings most certainly contribute to climate change by adding greenhouse gases to the atmosphere, but this is only part of the equation. Earth’s climate can change over time not only because of changes in the atmosphere but also because of interactions between the atmosphere and various geologic, chemical, biological, and geographic factors."}, {"id": "541", "title": "Internet Interruptions", "text": "Internet interruptions caused by extreme weather events sap billions of dollars annually from the global economy and can interfere with the delivery of essential data and services by governments, utilities, and first responders. A Boston-based startup is trying to address that problem by applying climate resilience and adaption principles to the internet, which experts say is vulnerable to climate change."}, {"id": "540", "title": "Hooked Patients", "text": "Some of the pain patients may become hooked. Or their meds may find their way to friends or relatives who take them recreationally. Or a prescription opioid user may transition to heroin. Heroin is just another opioid drug, so the brain doesn’t distinguish whether it comes from a pharmacy or from a street drug dealer."}, {"id": "539", "title": "Line Engraving", "text": "Line engraving on metal, which, to a great extent, was a development of the goldsmith’s craft of ornamenting armor and precious metals, did not emerge as a print-making technique until well into the 15th century. Copper, the metal mainly used for engraving, was expensive, and engraving itself was laborious and took a long time."}, {"id": "538", "title": "Sibling Bullying", "text": "Sibling bullying associated with poor mental health outcomes years later. Scientists found sibling bullying in early adolescence, irrespective of whether the individual was a victim, perpetrator, or both, has a long-term effect on both positive and negative mental health in late adolescence."}, {"id": "537", "title": "Bermuda Triangle", "text": "The Bermuda Triangle is a mythical section of the Atlantic Ocean roughly bounded by Miami, Bermuda and Puerto Rico where dozens of ships and airplanes have disappeared. Unexplained circumstances surround some of these accidents, including one in which the pilots of a squadron of U.S. Navy bombers became disoriented while flying over the area; the planes were never found."}, {"id": "536", "title": "Liverpool", "text": "Located at the heart of two world famous cities, Liverpool and London, Liverpool’s excellence in teaching, learning and research, first-class facilities and outstanding support places the university in the top 1% of universities worldwide. The University of Liverpool will provide you with an inspiring student experience, in a diverse international community."}, {"id": "535", "title": "Car-free Zone", "text": "To reduce pollution, it is essential that the town center becomes a car-free zone. A ring road should be built so that cars are diverted away from the town center. The main shopping streets could be converted into a pedestrianized area. If trees and flowers are planted, the town center will be transformed into a quiet and green space where residents can enjoy shopping and walking in a healthy environment."}, {"id": "534", "title": "Tea Ceremony (B)", "text": "Many non-Japanese know a thing or two about traditional tea ceremony, its history, intricacies and religious origins. However, few people outside Japan have a deep understanding of the esoteric meaning of the practice. Indeed, even in Japan, the secret meaning of tea ceremony is little understood except by those who have devoted their lives to the discipline."}, {"id": "533", "title": "Avalanche", "text": "An avalanche is rapidly descending large mass of snow, ice, soil, rock, or mixtures of these materials, sliding or falling in response to the force of gravity. Avalanches, which are natural forms of erosion and often seasonal, are usually classified by their content such as a debris or snow avalanche."}, {"id": "532", "title": "Ancient Athens", "text": "In ancient Athens, a boy was socially located by his family identity, and Plato often refers to his characters in terms of their paternal and fraternal relationships. Socrates was not a family man and saw himself as the son of his mother, who was apparently a midwife."}, {"id": "531", "title": "Acknowledgement", "text": "We acknowledge all the information and memory notes provided by students. We also acknowledge open source from various books and journal articles. All questions and answers are prepared and annotated by the Australian Institute of Language. All rights reserved, not for any commercial purposes, but for personal study only."}, {"id": "530", "title": "Australia's Bushfires", "text": "Smoke from Australia's Black Summer bushfires of 2019 to 2020, which burnt through 18 million hectares of land, produced a phytoplankton bloom larger than the entire country of Australia located in the Southern Ocean."}, {"id": "529", "title": "Mars Eruptions", "text": "NASA Confirms Thousands of Massive, Ancient Volcanic Eruptions on Mars: Scientists found evidence that a region of northern Mars called Arabia Terra experienced thousands of \"super eruptions,\" the biggest volcanic eruptions known, over a 500-million-year period."}, {"id": "528", "title": "Housing", "text": "Housing fulfills the basic needs that people have for security, privacy and shelter. While the adequacy of housing is an important component of individual well-being, housing also has great impact on the nation’s economy, with its influence on investment levels, interest rates, building activity and employment."}, {"id": "527", "title": "Evidence", "text": "I've seen no evidence to suggest that students are not able to complete their courses because they're failing in English yet they're being passed by the universities,\" she said. \"I've not seen any evidence to back that up.” International education is one of our largest exports, it's our fourth largest export and it's in the interest of our universities to maintain very high standards because their reputation is at stake.\""}, {"id": "526", "title": "Intercultural Difficulties", "text": "\"There are, of course, intercultural difficulties as well as language difficulties,\" he said. \" There are, of course, also many Australian students who don't speak such fantastically good English either."}, {"id": "525", "title": "Domestic Violence", "text": "Domestic Violence Increased During Lockdown In The United States - \"A new study, published in Psychology of Violence, looks at rates of intimate partner violence during the pandemic in the United States. Like data from the UK, it suggests that domestic violence increased during lockdown.\""}, {"id": "524", "title": "Passion", "text": "Do something you are very passionate about and do not try to chase what is considered the hot passion of the day. People say you have to have a lot of passion for what you’re doing, and it’s totally true. You have to do it over a sustained period of time. So, if you don’t love it, you’re going to give up."}, {"id": "523", "title": "Fleeing", "text": "Many families are fleeing their native countries due to sectarian repression and political uprisings. Consequently, thousands of people have been stranded in foreign lands for months; other families have gone missing in the sea, marooned in small boats, as the neighboring foreign countries refuse to take them in."}, {"id": "522", "title": "Camel Sculptures", "text": "A series of camel sculptures carved into rock faces in Saudi Arabia are likely to be the oldest large-scale animal reliefs in the world, a study says. When the carvings were first discovered in 2018, researchers estimated they were created about 2,000 years ago. This was based on their similarity to reliefs at Jordan's famous ancient city of Petra."}, {"id": "521", "title": "First Satellite", "text": "Since the Soviet Union successfully launched the first man-made satellite, Sputnik 1, in 1957, about 5,000 more satellites have been put into orbit around the Earth. About 2,000 of these are active and although the rest are now disfunctional, they remain in orbit, together with parts from all the rockets that carried them there. These remnants are often referred to as space junk, space trash or orbital debris."}, {"id": "520", "title": "Inevitable Change", "text": "Change is inevitable in any sphere of life. Although the results of change can bring great benefits, the process of change can be intensely traumatic, involve loss of choice, power and status, and when change happens in the workplace, it can even lead to loss of jobs. Many businesses and organizations use a model called the Change Curve to understand and manage how people react to change."}, {"id": "519", "title": "Banking and Bank", "text": "In 1994, Microsoft's founder, Bill Gates, said that although banking is necessary, banks are really not! At a time when many traditional institutions and ways of doing things are changing, banking is changing too. There are now new ways of accessing loans and lending money. Thanks to the rise of alternative finance, people can raise and invest money outside the traditional banking system."}, {"id": "518", "title": "Social Media", "text": "Our widespread participation in social media in recent years has led to the emergence of what is termed social media influencers'. These online entrepreneurs are people who have created a positive reputation amongst their followers for providing knowledge or expertise on a particular subject. The brands have seen them as a means of promoting their product or service to thousands and sometimes millions of people."}, {"id": "517", "title": "Moon Transportation", "text": "Although it is difficult to take people back to the Moon, it is not impossible! We can transport people but the logistical challenge of keeping them there, is a very different thing. However, we have two of the components necessary to make this work: power from the Sun, and the minerals on the Moon itself. Scientists and researchers are already busy working on this in laboratories."}, {"id": "516", "title": "Bird's Positioning", "text": "Birds have a variety of methods by which they are able to find their way across the flyways, year in, and year out. It seems that birds employ different geo-positioning strategies according to the conditions encountered during migration. They seem able to use the position of the sun and stars, the Earth's magnetic field, smells and even landmarks to find their way."}, {"id": "515", "title": "Too Much Information", "text": "We all know, that too much information can be a bad thing - this is as true in daily life as it is in business. Filtering useful from useless information has become a growing problem, bringing confusion with it, but this is where data curation can help. Curating data involves finding and displaying patterns in large volumes of disconnected and messy data to create meaningful information."}, {"id": "514", "title": "Positive Pressure", "text": "It is quite normal to feel under pressure, and pressure can sometimes be a positive force: it can make us feel energized and take action to get results. But if the pressure becomes too much and we tip over into the feeling of being stressed, then it can have negative impact on us and our health. However, stress is a very subjective phenomenon and it lacks a precise medical definition."}, {"id": "513", "title": "European Eel", "text": "One of the most mysterious and endangered fish in Europe is the European eel. Eels live very long and complex lives and during their lifetime will travel thousands of miles, transforming themselves as they go. They can grow up to one metre long and have long and snake-like bodies with one pair of small fins at the sides. They are secretive creatures and most of their early life at sea is a mystery."}, {"id": "512", "title": "Homesick", "text": "Everyone at some point can feel worried or anxious, homesick or isolated because they don't just fit in. This often happens when you change your location or when changes happen to you, and the truth is that this happens to lots of people; and it's a normal part of life. It's been recognized that around one third of students will experience poor mental health during their studies."}, {"id": "511", "title": "Team Working Ability", "text": "The ability to work in a team is one that is prized by employers and educationalists. It is often requested in job advertisements and displayed on CVs. When employers list their most important skills for promotion, 86% of people list team working skills. These days, the willingness and ability to work with a group of people towards a single target has become increasingly important."}, {"id": "510", "title": "Losing and Winning", "text": "'Everyone loves a winner' is a common saying but surprisingly, people dislike losing more than they like winning, and it actually takes a lot to tempt us to take a risk. Psychologists and economists from Princeton University found that people do not like to bet money in a 50:50 situation unless they can win twice the amount they could lose."}, {"id": "509", "title": "Schooling Model", "text": "The conventional model of schooling emerged in Prussia in the 18th century. Alternatives have so far failed to teach as many children as efficiently. Classrooms, hierarchical year-groups, standardized curriculums and fixed timetables are still the norm for most of the world’s nearly 1.5 billion schoolchildren."}, {"id": "508", "title": "Ed Tech", "text": "Since then education technology (edtech) has repeated the cycle of hype and flop, even as computers have reshaped almost every other part of life. One reason is the conservatism of teachers and their unions. But another is that the brain-stretching potential of edtech has remained unproven."}, {"id": "507", "title": "Teaching Machine", "text": "In 1953 B.F. Skinner visited his daughter’s maths class. The Harvard psychologist found every pupil learning the same topic in the same way at the same speed. A few days later he built his first \"teaching machine\", which let children tackle questions at their own pace. By the mid-1960s similar gizmos were being flogged by door-to door salesmen. Within a few years, though, enthusiasm for them had fizzled out."}, {"id": "506", "title": "Peer Checking", "text": "Peer checking is a very useful and productive way of developing your reviewing skills. When you read your friend's work, you are assuming the role of the reader (and the teacher). If your friend's work is well written, then it will be fluent and easy to read, and you will have no problems understanding the overall content."}, {"id": "505", "title": "Running", "text": "People run for many different reasons, namely: for fun, for exercise, to raise money for charities, and so on. Over the past decades, running has become an essential part of many health routines because of the publicity about its beneficial effects. It is claimed that it is good for our heart, it reduces stress and it helps to prevent diseases like diabetes."}, {"id": "504", "title": "Microbe Reproduction", "text": "A microbe can either reproduce by dividing or it can conserve its energy and maintain only its most basic functions. One possibility is that in the unfavorable conditions under the South Pacific floor, the microbes could have been dividing very slowly over centuries. In this case, the microbes in the study may be the descendants of an even more distant past."}, {"id": "503", "title": "Fresh Water", "text": "In Abu Dhabi, where fresh water sources are very limited, sustainable water management is a high priority. The region receives on average just 120 millimeters of rainfall every year but the country is seeing demand for water"}, {"id": "502", "title": "Solar Energy", "text": "Not all solar energy capture devices make electricity directly. For example, steam generated from solar energy can turn turbines, which then produce electricity. And, in what could be especially useful in remote regions, solar steam can desalinate water and be used in sanitation and equipment sterilization."}, {"id": "501", "title": "Student Exchange Program", "text": "A student exchange program complements formal education, while promoting tolerance, maturity and independence – all highly sought after qualities in today’s competitive job market. Living in the host country, not as a tourist or guest but as a member of the community, is what makes the experience both challenging and rewarding."}, {"id": "501", "title": "Writers", "text": "Writers may make the mistake of making all their sentences too compact. Some have made this accusation against the prose of Gibbon. An occasional loose sentence prevents the style from becoming too formal and allows the reader to relax slightly. Loose sentences are common in easy, unforced writing, but it is a fault when there are too many of them."}, {"id": "500", "title": "Vikings", "text": "Invaders, pirates, warriors - the history books taught us that Vikings were brutal predators who travelled by sea from Scandinavia to pillage and raid their way across Europe and beyond. Now cutting-edge DNA sequencing of more than 400 Viking skeletons from archaeological sites scattered across Europe and Greenland will rewrite the history book."}, {"id": "499", "title": "Reliable Evidence", "text": "A scientist's evidence is thought to be reliable because it will have been tested and verified at every stage. This is not, of course, infallible as scientists are subject to human error as much as the rest of us."}, {"id": "498", "title": "Gulf of Mutual Incomprehension", "text": "Six decades after the British novelist and chemist C. P. Snow famously decried the \"gulf of mutual incomprehension\" between the sciences and the humanities, the chasm often seems larger than ever. Science has grown more technically demanding over the years, even as the shared public experience of art and culture has fragmented."}, {"id": "497", "title": "Wellness", "text": "Within “wellness” paradigm of care, there would still be a place for use of medications that help people feel differently, at least for a time: sedatives, tranquilizers, and so forth. And you would still want to fund science that seeks to better understand the many pathways to debilitating mood states and to “psychosis” and yes, whatever biological vulnerabilities that may be present."}, {"id": "496", "title": "Bond Funds", "text": "Most bond funds have credit risk, which is the risk that companies or other issuers whose bonds are owned by the fund may fail to pay their debts ,including the debt owed to the holder of their bonds. Some funds have little credit risk, such as those that invest in insured bonds or U.S. Treasury bonds. But be careful: nearly all bond funds have interest rate risk, which means that the market value of the bonds they hold will go down when interest rates go up."}, {"id": "495", "title": "Salamanders", "text": "Salamanders are a group of amphibians typically characterized by a lizard-like appearance, with slender bodies, blunt snouts, short limbs projecting at right angles to the body, and the presence of a tail in both larvae and adults."}, {"id": "494", "title": "Less Water", "text": "With climate change, plants of the future will consume more water than in the present day, leading to less water available for people living in North America and Eurasia, according to a new study. The research suggests a drier future despite anticipated precipitation increases for places like the United States and Europe, populous regions already facing water stresses."}, {"id": "493", "title": "Placebo", "text": "If a doctor expects a treatment to be successful, a patient may experience less pain and have better outcomes, according to a new study. The findings reveal how social interactions between hypothetical healthcare providers and patients have the power to influence how patients perceive the effectiveness of a treatment, even when it is a placebo."}, {"id": "492", "title": "Extraterrestrial Life", "text": "Hunters of extraterrestrial life may want to listen particularly closely for signals originating at star systems within that narrow band of galactic sky. Advanced civilizations there may have already detected us using the transit method, they say, and may now be sending us a message. You might think of this paper, then, like a treasure map, for intelligent life."}, {"id": "491", "title": "Biopedturbation", "text": "Biopedturbation, the disturbance of soils by animals, is an important and often essential functional component of many ecosystems worldwide. It determines the spatiotemporal characteristics of soil patches and thereby contributes to the ecosystems' diversity and heterogeneity."}, {"id": "490", "title": "Soil Disturbances", "text": "The soil disturbances by animals affect both physical and chemical soil properties. These disturbances create vegetation-free areas, shape soil topography, alter soil density and structure, change infiltration properties and soil moisture, influence the nutrient situation, and contribute to carbon cycling and nutrient turnover (for a detailed account of species)."}, {"id": "489", "title": "Rites of Passage", "text": "Rites of passage are one deep avenue to experience this love in our bones. Once realized, the care for the earth, the connection and experience of nature, and our part and place in the whole, will inform our future, our care for all of life. Without this care, and a true understanding of interdependence, our actions and lives may well be fragmented, divisive, and destructive."}, {"id": "488", "title": "Precipitation", "text": "In meteorology, precipitation is any product of the condensation of atmospheric water vapor that falls under gravity. The main forms of precipitation include drizzle, rain, sleet, snow, graupel, and hail."}, {"id": "487", "title": "Cloud of Gas", "text": "Astronomers have recently discovered a large cloud of gas, in which many new stars are being formed, not far from our own solar system. While it would seem surprising that this phenomenon hadn’t been previously noticed, the researchers explained that recent innovations in measuring the distance of gas clouds more accurately led to this discovery after older observations were reinterpreted."}, {"id": "486", "title": "Fin Whale Songs", "text": "Fin whale songs contain signals that are reflected and refracted within the crust, including the sediment and the solid rock layers beneath. These signals, recorded on seismometers on the ocean bottom, can be used to determine the thickness of the layers as well as other information relevant to seismic research."}, {"id": "485", "title": "Literature", "text": "Literature allows us to move beyond the inevitable boundaries of our own lives and culture because it introduces us to people different from ourselves, places remote from our neighborhoods, and times other than our own. Reading makes us more aware of life's possibilities as well as its subtleties and ambiguities."}, {"id": "484", "title": "Another Virtue", "text": "Another virtue that both propagate is that the present is meant to be enjoyed to the fullest. It is no use fretting about the past for it cannot be undone or overturned and no use pondering too much, about the future for it remains unseen. The day being thought about may never dawn on you. The ultimate service, however, remains the one done for your fellow men."}, {"id": "483", "title": "Greenhouse Gases", "text": "Current research models indicate that climate change associated with increasing levels of greenhouse gases is likely to lead to the soils in the interiors of the major continents drying out. In response to a drying of cropland, people are likely to seek either new sources of irrigation water or new, wetter areas to farm. If we choose desalination of seawater as a possible solution, large amounts of energy will be required."}, {"id": "482", "title": "Business Communication", "text": "Much of today's business is conducted across international borders, and while the majority of the global business community might share the use of English as a common language, the nuances and expectations of business communication might differ greatly from culture to culture."}, {"id": "481", "title": "Leg Coordination", "text": "Finally, the experimenters examined real insects. To see if leg adhesion might also play a role in the walking coordination of real flies, they put polymer drops on the flies’ legs to cover their claws and adhesive pads – – as if the flies were wearing boots — and watched what happened. The flies quickly began to use bipod-like leg coordination similar to the one discovered in the simulation."}, {"id": "480", "title": "Reserve Requirements", "text": "Reserve requirements are the proportions of the deposits that banks must keep on hand and are not allowed to lend out. For example, if the reserve requirement is 10% and you deposit $100 in a bank, the bank can lend $90 of that $100 to someone else. But it is not allowed to lend the remaining $10."}, {"id": "478", "title": "Past, Present and Future", "text": "Modern science says: ‘The Sun is the past, the Earth is the present, the moon is the future.‘ From an incandescent mass we have originated, and into a frozen mass, we shall turn. Merciless is the law of nature, and rapidly and irresistibly we are drawn to our doom."}, {"id": "477", "title": "Recurring Dream", "text": "Having the same dream again and again is a well-known phenomenon — nearly two-thirds of the population report having recurring dreams. Being chased, finding yourself naked in a public place or in the middle of a natural disaster, losing your teeth or forgetting to go to class for an entire semester are typical recurring scenarios in these dreams."}, {"id": "476", "title": "TV Advertising", "text": "From a child's point of view, what is the purpose of TV advertising? Is advertising on TV done to give actors the opportunity to take a rest or practice their lines ? Or is it done to make people buy things? Furthermore, is the main difference between programs and commercials that commercials are for real, whereas programs are not, or that programs are for kids and commercials for adults?"}, {"id": "475", "title": "Children's Dream", "text": "As a child, you might dream one day of becoming an astronaut and, the next day, of becoming a ballet dancer — the possibilities are endless. Eventually, this wealth of choice is whittled down by external circumstances and internal interests. Similarly, precursor cells in early embryos make a series of stepwise 'decisions' governed by external forces and internal factors to generate the diverse array of cell types present in adult organisms."}, {"id": "474", "title": "Seismology", "text": "Seismology is the scientific study of earthquakes and the propagation of elastic waves through the Earth or through other planet-like bodies. The field also includes studies of earthquake environmental effects such as tsunamis as well as diverse seismic sources such as volcanic, tectonic, glacial, fluvial, oceanic, atmospheric, and artificial processes such as explosions. A related field that uses geology to infer information regarding past earthquakes is paleoseismology."}, {"id": "473", "title": "English Revolution (B)", "text": "The speaker reminisces about his views of the English Revolution when he was a student and how it seemed quite clear which side he was on - 'the aristocrats, not the puritans'. Later he realized there was more to it than that and there were several ways of interpreting the Revolution: as a struggle between the king and parliament, as a class war or as an unpredictable situation without clear sides."}, {"id": "472", "title": "Economic Depression", "text": "An economic depression is a period of sustained, long-term downturn in economic activity in one or more economies. It is more severe than a recession, which is a slowdown in economic activity over the course of a normal business cycle. Economic depressions are characterized by their length, and by abnormally large increases in unemployment rate."}, {"id": "471", "title": "Selective History", "text": "History is selective. What history books tell us about the past is not everything that happened, but what historians have selected. They cannot put in everything: choices have to be made. Choices must similarly be made about which aspects of the past should be formally taught to the next generation in the shape of school history lessons."}, {"id": "470", "title": "Bird Nests", "text": "Nell says that, in order to seek protection from their furry foes, birds actually prefer to build their nests in plots of swamp with a resident alligator. In fact, in one study agraduate student planted fake alligators. The birds seemed to prefer to build nests close to them. “Where there’s a water source, there are alligators, so it’s sort of this moat of protection around these colonies.”"}, {"id": "469", "title": "Wolf", "text": "Over time a split would have appeared in wolf populations, he says: those wolves that feared humans, and those that didn’t. \"So this would have facilitated, I think, the domestication process.\" At which point humans deliberately took wolves as pets. But that domestication process, Frantz says, may have happened more than once: first in the west , in Europe. And again in the far east, in Asia."}, {"id": "468", "title": "Neurotransmitter", "text": "A ubiquitous neurotransmitter that carries signals between brain cells, dopamine, among its many functions, is involved in multiple aspects of cognitive processing. The chemical messenger has been extensively studied from the perspective of external cues, or \" deterministic\" signals."}, {"id": "467", "title": "Largest Moon", "text": "Previous research has offered circumstantial evidence that Ganymede, the largest moon in the solar system, contains more water than all of Earth's oceans put together. However, temperatures there are so cold that the water on the surface is frozen solid. Also, Ganymede’s ocean is thought to be 100 miles below the moon’s crust. This means that the water vapor discovered by Hubble is not likely to represent the evaporation of this ocean."}, {"id": "466", "title": "Civil War and Lincoln", "text": "The southerners did not accept Lincoln as a president because of certain reasons, based on historical grounds. Southerners wished to protect their rights in the government and become more independent from the north. They considered president elections to be unfair. Moreover, they thought that their own rights will be ignored and limited. All this caused the separation of the southern states and marked the beginning of the Civil War."}, {"id": "465", "title": "Matthew Brady", "text": "In 1861, Matthew Brady, a well-known portrait photographer, approached President Lincoln requesting permission to move freely around the country photographing the Civil War. Lincoln granted him permission to travel anywhere with the Union armies, and his record of this conflict brought home to millions the horrors of war."}, {"id": "464", "title": "Introverts' Thinking", "text": "As introverts are thinking, they reach back into long-term memory to locate information. An introvert will often compare old and new experiences when making a decision, which slows the processing down but leads to carefully thought-out decisions. This means that introverts have an active dialogue with themselves and usually walk around with many thoughts in their minds."}, {"id": "463", "title": "Faster Communications", "text": "As we progress into the 21st century, communications are becoming faster and faster. Think of the millions of different media images you are bombarded with every day. It is as important now to be able to read and make sense of those images, as it has been to be able to read ordinary text."}, {"id": "462", "title": "Source of Funding", "text": "A study found that the research funded by the soft drinks industry had different results from research funded by other sources and went on to suggest that they may have been biased by the research itself. The whole point of the scientific methods is to ensure the research results are not influenced by the source of funding."}, {"id": "461", "title": "Tele-banking", "text": "The transition from the 'brick and mortar' structure to 'click and order' model started with the emergence of Information Technology and its use in the financial sector. The use of technology in banking has resulted in availability of multiple delivery channels like ATMs, tele-banking, internet banking, and mobile banking."}, {"id": "460", "title": "Tasmania", "text": "Tasmania is a large and relatively sparsely populated island off the south coast of Australia. The island is of particular interest to natural scientists, who go there to research the unique wildlife. Tasmania has, for example, twelve species of bird that are not found anywhere else in the world."}, {"id": "459", "title": "Aboriginal People", "text": "Aboriginal people are believed to have arrived as early as 60,000 years ago, and evidence of Aboriginal art in Australia dates back at least 30,000 years. Several states and territories had their origins as penal colonies, with the first British convicts arriving at Sydney Cove in 1788."}, {"id": "458", "title": "Sad Truth", "text": "The sad truth is that happy sounds are infectious. Now comes research that at least partly explains why. It was published this week in the journal of Neuroscience. A British research team played various sounds including laughter to people who are having their brain scanned by a functional MRI machine. All the sounds activated the premotor cortical region of the brain — an area preparing facial muscles to move."}, {"id": "457", "title": "Nectar", "text": "The scientists say this is the first documented instance of nectar that attracts a particular animal assistant being produced outside of a nectary. In fact, the observed nectar bleeding might actually be an early system that evolved to include the nectaries found in other plants today."}, {"id": "456", "title": "Surgical Infections", "text": "Surgical site infections are caused by bacteria that get in through incisions made during surgery. They threaten the lives of millions of patients each year and contribute to the spread of antibiotic resistance. In low- and middle-income countries, 11% of patients who undergo surgery are infected in the process."}, {"id": "455", "title": "Roman", "text": "The Roman state was tested almost to destruction by the defeat at Cannae by the Carthaginians led by Hannibal – and according to the historian Polybius, it was only what he called the “peculiar virtues” of the Roman constitution that allowed it to survive this crisis."}, {"id": "454", "title": "Biodiversity", "text": "We understand the importance of supporting and restoring biodiversity, and we are teaming up with the world’s leading molecular biologists, technologists, conservation biologists, conservation organizations, ethicists and thought leaders to call for 'Intended Consequences' to help us safely use all of the available tools that can provide the advantage we need to turn the tide on species loss."}, {"id": "453", "title": "Gator Hunter", "text": "Nell and his colleagues took to the Everglades at night, hunting for gators near and far from nests.' You have to use a spotlight and you see the little demon eyes shining out of the marsh.' They lassoed the gators, pulled them into the airboat, and took blood samples and body measurements."}, {"id": "452", "title": "Wordsworth", "text": "Early in the 19th century, Wordsworth opposed the coming of the steam train to the Lake District, saying it would destroy its natural character. Meanwhile, Blake denounced the \"dark satanic mills\" of the Industrial Revolution. The conservation of the natural environment, however, did not become a major theme in politics until quite recently."}, {"id": "451", "title": "English Colonies", "text": "English colonies emerged along the eastern seaboard for a variety of reasons. People, primarily men, originally migrated to Virginia to find gold and silver to make a quick profit. After it became evident that there were no precious metals in the area, men came to Virginia to start cultivating cash crops like tobacco."}, {"id": "450", "title": "Noise", "text": "Prolonged exposure to loud noise alters how the brain processes speech, potentially increasing the difficulty in distinguishing speech sounds, according to neuroscientists. Exposure to intensely loud sounds leads to permanent damage of the hair cells, which act as sound receivers in the ear. Once damaged, the hair cells do not grow back, leading to noise-induced hearing loss."}, {"id": "449", "title": "Physical Activities", "text": "Participating regularly in physical activity has been shown to benefit an individual's health and wellbeing. Regular physical activity is important in reducing the risk of chronic diseases, such as heart disease and stroke, obesity, diabetes and some forms of cancer. The National Physical Activity Guidelines for Adults recommends at least 30 minutes of moderate-intensity physical activity, preferably every day of the week, to obtain health benefits."}, {"id": "448", "title": "Istanbul", "text": "Straddling Asia and Europe across the strait, the old city of Istanbul, Turkey, has embraced diverse cultural influences. Known for its monumental architecture, Istanbul has become a cherished travel destination."}, {"id": "447", "title": "Chaplin and Sydney", "text": "Charlie Chaplin and his brother Sydney were placed in an orphanage at a very early age. Becoming a vaudeville performer, he joined Fred Karno's company in 1906. He made his film debut in Making a Living (1914) and introduced the famous seedy and soft-hearted gentleman-tramp routine, which became his hallmark. Numerous films for various studios brought him world fame, all based on his mastery of pathos and slapstick acrobatics."}, {"id": "446", "title": "Biology", "text": "Biology is the natural science that studies life and living organisms, including their physical structure, chemical processes, physiological mechanisms and evolution. Certain unifying concepts consolidate it into a single and"}, {"id": "445", "title": "Coronavirus Pandemic", "text": "The legislation, which Democrats hope to push through the Senate by the weekend, remains among the largest federal relief packages in modern American history. It would deliver hundreds of billions of dollars for vaccine distribution, hospitals, state and local governments and families struggling to recover from the economic toll of the coronavirus pandemic."}, {"id": "444", "title": "Vaccines", "text": "Vaccines work by training and preparing the body’s natural defences – the immune system – to recognize and fight off viruses and bacteria. If the body is exposed to those disease-causing pathogens later, it will be ready to destroy them quickly – which prevents illness. When a person gets vaccinated against a disease, their risk of infection is also reduced."}, {"id": "443", "title": "Artificial Neural Networks", "text": "Artificial Neural Networks have recently become the state-of-the-art technique for crucial signal processing applications such as specific frequencies classification, structural health monitoring, diseases detection in power electronics circuitry and motor-fault detection. This is an expected outcome as there are numerous"}, {"id": "442", "title": "Mars Rover", "text": "The Mars 2020 Perseverance Rover will search for signs of ancient microbial life, which will advance NASA's quest to explore the past habitability of Mars. The rover has a drill to collect core samples of Martian rock and soil, then store them in sealed tubes for pickup by a future mission that would ferry them back to Earth for detailed analysis. Perseverance will also test technologies to help pave the way for future human exploration of Mars."}, {"id": "441", "title": "Decisions", "text": "These decisions are highly nuanced. Of course we use a lot of data to inform our decisions, but we also rely very heavily on iteration, research, testing, intuition and human empathy. Now, sometimes the designers who work on these products are called \"data-driven,\" which is a term that totally drives us bonkers. The fact is, it would be irresponsible of us not to rigorously test our designs when so many people are counting on us to get it right."}, {"id": "440", "title": "Conservation Scientists", "text": "Conservation scientists have long tried to map how much of the planet remains undegraded by human activity. Previous estimates using satellite imagery or raw demographic data found anywhere from 20 to 40 percent of the globe was free from obvious human incursions, such as roads, light pollution or the gaping scars of deforestation. But an intact forest canopy can hide an emptied-out ecosystem below."}, {"id": "439", "title": "Gombe National Park", "text": "The audio, which includes more than 1,000 separate data files, was captured in the early 1970s by the late Hetty van de Rijt. She recorded the various screams, barks, and how calls made by a group of chimps, including 17 youngsters, living in the Gombe National Park in Tanzania."}, {"id": "438", "title": "Ozone", "text": "A total of five ozone ascents were taken at Bharati station (Indian mission) Antarctica from April to June 2016. As a stratospheric temperature reduced to -82.24 ℃ on 20th June 2016 indicating the formation of stratospheric clouds, leading scientists at Bharati station feared that Montreal Accord has not succeeded to control the emission of ozone-depleting gases in the atmosphere."}, {"id": "437", "title": "Dynamics", "text": "How quickly this occurs depends on the dynamics of fertility, mortality and overseas migration. While a moderate pace of demographic change allows for gradual adjustment of the economy and policies to the"}, {"id": "436", "title": "Sleep Behavior", "text": "Sleep behavior is also known as sleep disorder. People with sleep disorder often talk or walk in their sleep. They are not aware of what they are talking about or where they are going. There isn't any serious effects on body in general but it may be connected to the mental health. People with childhood traumas, unspeakable problem or depression are the ones with different sleep behavior."}, {"id": "435", "title": "Summary and Abstract", "text": "The terms summary and abstract are often used interchangeably resulting in some confusion. This problem arises because there are two distinct types of abstracts — descriptive and informative. The informative abstract is another name for a summary; the descriptive is not. The descriptive abstract is usually only two or three sentences in length, hence it is not a summary or very informative."}, {"id": "434", "title": "Deaf children", "text": "Deaf children learning a sign language could certainly pursue the development of listening and spoken language skills if desired, and doing so would carry much less risk knowing the child would have mastery in at least one language. If a child does not succeed in mastering either a spoken language or a sign language, we must then ask how much benefit the child derived from interventions in each language relative to theamount of time and resources dedicated to those interventions."}, {"id": "433", "title": "Drug Overdose Deaths", "text": "The slight decline in drug overdose deaths in 2018 coincides with Chinese regulations on the powerful opioid carfentanil, rather than the result of domestic U.S. efforts to curb the epidemic, a new analysis reveals. What many — including President Donald Trump — perceived as a decline in overdose deaths in 2018, appears to be a return to the historic exponential curve."}, {"id": "432", "title": "Scenario", "text": "It was found that while many companies express interest in Jacobson's use case approach, actual scenario usage often falls outside what is described in textbooks and standard methodologies. Users therefore face significant scenario management problems not yet addressed adequately in theory or practice, and are demanding solutions to these problems."}, {"id": "431", "title": "European Wildcats", "text": "European wildcats, thought to be extinct 50 years ago in the Jura mountains, have since recolonized part of their former territory. This resurgence in an area occupied by domestic cats has gone hand-in-hand with genetic crosses between the two species. A team of biologists modeled the interactions between the two species and predict that hybridization will entail the irreversible genetic replacement of wildcats."}, {"id": "430", "title": "Aromatic Substance", "text": "Researchers have found a way to convert the aromatic substance vanillin into a redox-active electrolyte material for liquid batteries. The technology is an important step towards ecologically sustainable energy storage."}, {"id": "429", "title": "X-ray", "text": "Using an X-ray laser, a research team has investigated how water heats up under extreme conditions. In the process, the scientists were able to observe water that remained liquid even at temperatures of more than 170 degrees Celsius. The investigation revealed an anomalous dynamic behavior of water, which is of fundamental importance for investigations of sensitive samples using X-ray lasers."}, {"id": "428", "title": "Drug Overdose Deaths", "text": "The slight decline in drug overdose deaths in 2018 coincides with Chinese regulations on the powerful opioid carfentanil, rather than the result of domestic U.S. efforts to curb the epidemic, a new analysis reveals. What many - including President Donald Trump - perceived as a decline in overdose deaths in 2018, appears to be a return to the historic exponential curve."}, {"id": "427", "title": "Barley Grains", "text": "Researchers have uncovered fundamental new information about the malting characteristics of barley grains. They say their finding could pave the way to more stable brewing processes or new malts for craft brewers."}, {"id": "426", "title": "Hazard Assessment", "text": "A Hazard Assessment should be performed for work involving distillations of organic liquids and should thoroughly address issues relating to residual water and possible decomposition of the solvent in question, as well as the physical placement of the distillation apparatus and heating equipment to be employed."}, {"id": "425", "title": "Protein Tau", "text": "Researchers have found a novel form of the Alzheimer's protein tau in the fluid surrounding the brain and spinal cord. This form of tau -- known as MTBR tau -- indicates what stage of Alzheimer's a person is in and tracks with tangles of tau protein in the brain."}, {"id": "424", "title": "Injury or Disease", "text": "Injury or disease that afflicts a relatively small number of brain cells causes a chain reaction that stops activity across a vast network of neural circuits, according to new research. The study may help to explain why people can suffer from temporary but severe loss of cognitive function in cases of traumatic brain injury or disease."}, {"id": "423", "title": "Thermometer", "text": "Researchers have discovered a brain molecule that functions as a 'thermometer' for the presence of others in an animal's environment. Zebrafish 'feel' the presence of others via mechanosensation and water movements —which turns the brain hormone on."}, {"id": "422", "title": "Organic Molecules", "text": "New research identifies a process that might have been key in producing the first organic molecules on Earth about 4 billion years ago, before the origin of life. The process, which is similar to what might have occurred in some ancient underwater hydrothermal vents, may also have relevance to the search for life elsewhere in the universe."}, {"id": "421", "title": "Hydrogen Fuel", "text": "The power of the sun, wind and sea may soon combine to produce clean-burning hydrogen fuel, according to researchers. The team integrated water purification technology into a new proof-of-concept design for a sea water electrolyzer, which uses an electric current to split apart the hydro
