ndow in Painting", "text": "We can see from the X-rays that at an early stage of painting, a window was painted at the left of the portrait. It seems that there may have been two windows in the initial design for the portrait or that the window was moved at an early stage."}, {"id": "821", "title": "Raccoons", "text": "Environmental, individual and social traits of free-ranging raccoons influence performance in cognitive testing. Shy raccoons are better learners than bold ones, a result that has implications for our relationship with urban wildlife."}, {"id": "820", "title": "Marriage Satisfaction", "text": "Researchers found that couples with higher satisfaction in relationship had greater neural synchronization while watching marriage-related clips, but they don't know whether there is selection-based behaviors arising from similar brain activity, or whether couples evolve over time to develop it."}, {"id": "819", "title": "Meatless Diet", "text": "Association between meatless diet and depression: participants who excluded meat from their diet were found to have a higher prevalence of depressive episodes as compared to participants who consumed meat. This association is independent of socioeconomic, lifestyle factors, and nutrient deficiencies."}, {"id": "818", "title": "Early Puberty", "text": "Covid-19 pandemic is linked to early onset of puberty in some girls. Several studies suggest that the number of girls starting puberty early has more than doubled amid the coronavirus outbreak, and experts are unsure about exactly why."}, {"id": "817", "title": "Circumcision", "text": "The role of women in promoting voluntary medical male circumcision uptake: research reveals the important role played by women in influencing men to undergo circumcision. Women are also motivated to convince men to undergo male circumcision because of the benefits associated with them such as reduction of HIV transmission and cervical cancer."}, {"id": "816", "title": "Cultivated Language", "text": "In every cultivated language there are two great classes of words which, taken together, comprise the whole vocabulary. First, there are those words with which we become acquainted in daily conversation, which we"}, {"id": "815", "title": "Animal Fighting", "text": "When someone commits a criminal act, we always hope the punishment will match the offense. But when it comes to one of the cruelest crimes, animal fighting, things rarely work out that way. Dog-fighting victims are tortured and killed for profit and \"sport\", yet their criminal abusers often receive a minimal sentence for causing a lifetime of pain."}, {"id": "814", "title": "Addictive Games", "text": "Bolstered by the result of laboratory experiments, researchers dare to say that gaming might be mentally enriching. These scholars are the first to admit that games could be addictive, and indeed part of their research explores how games connect to the reward circuit of human beings."}, {"id": "813", "title": "Scottish Literature", "text": "Despite many similarities with literary-political debates in other nations, there are also ways in which the cultural and political situation in Scotland has left the study of Scottish Literature in a significantly different condition from that of literary studies in many other parts of the world."}, {"id": "812", "title": "Rapid Change", "text": "An environment of rapid change, technological innovations and increasing business competitiveness has highlighted the growing importance of management development. In particular, the general movement towards great employee involvement and making things happen through people has emphasized an integrating rather than a controlling style of management."}, {"id": "811", "title": "Central Idea", "text": "The central idea of this book concerns our blindness with respect to randomness, particularly the large deviations: why do we, scientists or nonscientists, hotshots or regular Joes, tend to see the pennies instead of the dollars? Why do we keep focusing on the minutiae, not the possible significant large events, in spite of the obvious evidence of their huge influence?"}, {"id": "810", "title": "Psychology", "text": "Psychology is the study of cognitions, emotions, and behavior. Psychologists are involved in a variety of tasks. Many spend their careers designing and performing research to understand how people behave in specific situations, how and why we think the way we do, and how emotions develop and what impact they have on our interactions with others."}, {"id": "809", "title": "Brain Efficiency", "text": "Efficiency is not your friend when it comes to cognitive growth. In order to keep our brains making new connections and keep them active, you need to keep moving on to another challenging activity as soon as you reach the point of mastery in the one you were engaging in."}, {"id": "808", "title": "Blinking", "text": "Every few seconds, our eyelids automatically shutter and our eyeballs roll back in their sockets. So why doesn't blinking plunge us into intermittent darkness and light? New research shows that the brain works extra hard to stabilize our vision despite our fluttering eyes. When our eyeballs roll back in their sockets during a blink, they don't always return to the same spot when we reopen our eyes."}, {"id": "807", "title": "Photorealistic Images", "text": "Using artificial intelligence, researchers can create photorealistic images from three-dimensional scenery, paving the way for better driving simulators and better testing of driverless cars."}, {"id": "806", "title": "Political Scholars", "text": "Political scholars had historically recognized the social love of the mass media. The impact of the mass media on the election and governing process has greatly increased over the last fifty years. Tomorrow, the mass media will become the \"central nervous system\" for your society and the major source of public information."}, {"id": "805", "title": "Summer Research Scholarships", "text": "Summer Research scholarships offer a unique opportunity for external organizations, academics, and students to work together in research. Working with globally recognized researchers in a local setting, students gain valuable real-world experience as well as an insight into what research is all about."}, {"id": "804", "title": "Climate Effects", "text": "Changes in climate affect, for example, the plant and animal life of a given area. The presence of coal beds in North America and Europe along with evidence of glaciation in these same areas indicates that they must have experienced alternately warmer and colder climates than they now possess."}, {"id": "803", "title": "Mosquito Diseases", "text": "To prevent mosquito-transmitted diseases, approaches based on genetic control of insect populations are being developed. However, many of these strategies are based on highly invasive, self-propagating transgenes that can rapidly spread the trait into other populations of mosquitoes."}, {"id": "802", "title": "Earthquake", "text": "Investigations like this one have been plodding along for 40 years, and some studies — like one following the deadly Kobe quake in 1995 — have found similar correlations. But study author Alasdair Skelton, a professor of geochemistry at Stockholm University, says the unpredictable study subject makes it tough to get funding because you can in no way guarantee a result. So l get three years of money, but if there’s no earthquake, there's no result."}, {"id": "801", "title": "Space Telescope", "text": "James Webb Space Telescope was specifically designed to observe this light, which comes from some of the oldest galaxies to take form. How did early stars and galaxies take shape? What about the cosmic material that is undetectable, known as dark matter? Is there evidence for it in the early eons of the universe? These are some of the perplexing and fascinating questions that astronomers can begin unraveling with Webb."}, {"id": "800", "title": "DBS", "text": "Deep brain stimulation (DBS) to the superolateral branch of the medial forebrain bundle (MFB), which is linked to reward and motivation, revealed metabolic brain changes over 12 months post-DBS implantation, making it a strong potential therapy for treatment-resistant depression."}, {"id": "799", "title": "Gut Microbiome", "text": "Research has shown that the gut microbiome is important for human physiology and health. Disturbances to the composition of the gut microbiome can be associated with chronic diseases such as gastrointestinal inflammatory disorders, neurological, cardiovascular and respiratory illnesses. The human body has evolved strategies to ensure that a symbiotic relationship exists between the microbes in our gut and our cells."}, {"id": "798", "title": "Standard of Living", "text": "Research has found we pursue more rewards when we become 'habituated' to a higher standard of living and compare ourselves to various standards. What it takes to be happy depends on our prior expectations, but these expectations can change over time."}, {"id": "797", "title": "Dyes and Pigments", "text": "The dyes and pigments available in any particular period in which a specific color photographic process was invented, manufactured and used have profound effects on the quality of color that defines most of the style and particular historical period."}, {"id": "796", "title": "Mice and Temperatures", "text": "Cool room temperature inhibited cancer growth in mice: mice acclimatized to temperatures of 4°C had significantly slower tumor growth and lived nearly twice as long compared with mice in rooms of 30°C because they were burning more brown fat."}, {"id": "795", "title": "Home Design", "text": "One of the major factors influencing future home design will be the probable change in climate, with hotter summers, colder winters, and the possibility of floods. Consequently, houses will be built with better insulation and will also need ways of keeping cool in hot weather, whether that’s air conditioning or more shading of windows."}, {"id": "794", "title": "Immune Vigilance", "text": "The problem is that increased immune vigilance has a side effect: allergies. Our speculation is that this is some kind of trade-off. In the past you needed to resist some kind of pathogen, and the trade-off or sacrifice you have to make is increased responsiveness to nonpathogenic allergens. So next time some of you get the springtime sniffles, blame your distant ancestor — the one with the heavy brow ridge."}, {"id": "793", "title": "Nikola Tesla", "text": "As the inventor of alternating-current technology, Nikola Tesla played a paramount role in the electricity used to power the entire world. Tesla also worked diligently on a dream of supplying electrical power without wires. Thomas Edison was also instrumental in shaping society today with his inventions. Edison's design of the inside of the light bulb was the crucial key to making a light that would stay lit for hours instead of going out almost immediately."}, {"id": "792", "title": "Clean Water", "text": "Many people are under the impression that the water which comes out of a plant is clean. This is a common misconception: the function of a plant is to make the water cleaner, but it's not clean enough to drink. It could be used in irrigation. What a plant is trying to do is simply speed up a process that would naturally occur given more time. This means that a plant can create water that is safe to enter back into the water system as it's so heavily diluted. The river then continues the water purification, acting as a form of the fourth stage."}, {"id": "791", "title": "Motorcycle Crash", "text": "If you do experience a motorcycle crash, be aware the other driver will most likely blame you for the accident. This includes the road, road conditions, any skid marks, road signs, construction, and anything else that may have contributed to the accident. Not every accident requires an attorney but a knowledgeable local attorney"}, {"id": "790", "title": "Intangible Assets", "text": "Intangible assets perform a number of distinctive functions in the life of each company. Firstly, they witness the prosperity of the firm in its good name. Such a position allows human resource management to employ professional workers and increase labor productivity. Moreover, intangible assets guarantee future value for the firm. And although it is difficult to destroy intangible assets, they can lose their importance in case of carelessness or business failure."}, {"id": "789", "title": "Mediterranean Diet", "text": "Countries bordering the Mediterranean have built up a solid reputation for sunshine, great tasting food as well as impressive health statistics, featuring some of the lowest rates of heart disease, and increased life expectancy. This has created a lot of attention towards the Mediterranean diet, which is not a typical weight loss diet, but more of a set of habits."}, {"id": "788", "title": "Executive Residence", "text": "The Executive Residence in the White House in the United States of America, where the president resides, is divided into several wings. It also includes the vice-president's and president's staff offices. This government building is a national heritage."}, {"id": "787", "title": "Amphibians", "text": "Whether salamander, frog or toad, amphibians are some of the most diverse and far-flung animals on the planet. However, they're disappearing, and experts are worried since frogs are considered bellwethers for the"}, {"id": "786", "title": "Japan", "text": "Japan is the world's calculator superpower. Japanese manufacturers have led sales of calculators for over 30 years in many countries. Even in the age of personal computers, calculators are still essential in accounting jobs. In addition, calculators with graphing capabilities have begun to be used in education."}, {"id": "785", "title": "Cloud Seeding", "text": "Cloud seeding, a form of weather modification, is a way of attempting to change the amount of precipitation that comes from clouds. Cloud seeding is carried out by dispersing substances into the air, but it also occurs due to ice nuclei in nature, most of which are bacterial in origin."}, {"id": "784", "title": "Clock Genes", "text": "What produce these effects are familiar to neuroscientists: external light and dark signals that help set our daily or circadian rhythms, “clock” genes that act as internal timekeepers, and neurons that signal to one another through connections called synapses. But how these factors interact to freshen a brain once we do sleep has remained enigmatic."}, {"id": "783", "title": "Fireworks", "text": "A dramatic fireworks display can be the highlight of a summer. It also can provide a feast for the senses. Bright colors delight the eye. Thunderous booms and whistles surprise the ear. If you’re close to the show, you can feel the pressure waves that ripple from each exploding shell. And folks downwind of the action can smell the burnt gunpowder that fueled each rocket — and perhaps even taste it in the air."}, {"id": "782", "title": "Neutron Stars", "text": "Neutron stars — the compressed remains of massive stars gone supernova — are the densest \"normal\" objects in the known universe (black holes are technically denser, but far from normal). Just a single sugar cube worth of neutron-star material would weigh 100 million tons here on Earth, or about the same as the entire human population."}, {"id": "781", "title": "Electric Vehicles", "text": "Electric vehicles have arrived. With technology led by Tesla, and all of the world's major car manufacturers following along behind, electric vehicles are now a common sight on the roads of most developed countries. Yet the situation in less developed countries is rather different; the only African country to have started the change to electric vehicles is South Africa."}, {"id": "780", "title": "Carbohydrate Intake", "text": "Based on the results from this study, we hypothesized that a high-protein diet coupled with low carbohydrate intake would be beneficial for prevention of bone loss in adults."}, {"id": "779", "title": "Era of Mayan", "text": "The Classic Era of Mayan came to an end around 900 AD. Why this happened is unclear; the cities were probably over-farming the land, so that a period of drought led to famine. Recent geological research supports this, as there appears to have been a 200-year drought around this time."}, {"id": "778", "title": "Depression Symptoms", "text": "Symptoms of depression decrease with improvements in sense of smell, particularly among patients with dysosmia. New research published in the journal Scientific Reports highlights the intricate relationship between depression and sense of smell. The study found that participants’ symptoms of depression dropped as their odor identification improved, particularly among those with an impaired sense of smell."}, {"id": "777", "title": "Book Structure", "text": "Any writer must decide upon an order and a structure for a book in keeping with the reflexive nature of the work. There are strong currents of reiteration in the book, with each iteration developing understandings of research, theory, and practice as the story continues to unfold."}, {"id": "776", "title": "Major Conclusion", "text": "Our major conclusion is that the current measure needs to be revised. It no longer provides an accurate picture of the differences in the extent of economic poverty among population groups or geographic areas of the country, nor an accurate picture of trends over time."}, {"id": "775", "title": "University Terms", "text": "An industry or workplace often has its own terms for certain items, places, or groups of people, and a university is no different. Here we have attempted to explain some of the terms you may come across on our websites that are specific to higher education."}, {"id": "774", "title": "Noise Restrictions", "text": "The noise restrictions are based on measurements on animals in captivity exposed to noise levels that induce a temporary threshold shift (TTS) in hearing. The TTS onset threshold is the lowest noise exposure capable of inducing a small temporary reduction of hearing sensitivity, also known as auditory fatigue, with full recovery shortly after exposure."}, {"id": "773", "title": "Information Office", "text": "Our information office on campus provided resource and support to help you make the right choices about childcare — whether you're a student, staff, or member of the local community. The office provides information about the five centres closest to our campuses, relevant government agency, and other daycare centres in the surrounding areas."}, {"id": "772", "title": "Distance Learning", "text": "We understand that not everyone can put their job and other responsibilities on hold to study. That's why our healthcare ethics and law master's courses are available to study by distance learning, so you can fit gaining an academic qualification around your work and family."}, {"id": "771", "title": "Eagles", "text": "Neither golden eagles nor bald eagles are endangered species. The US bald eagle population has more than quadrupled since 2009, from around 72,000 to 317,000 birds. But the US golden eagle population is still relatively small – around 30,000 birds – and at risk of declining."}, {"id": "770", "title": "Sociological Thought", "text": "Written by ten eminent professors, it had been updated to reflect the shifts of sociological thought in the last five years, making it the most comprehensive, authoritative, and contemporary dictionary available. It was essential reading for all students and teachers of sociologies and other related courses, and also for the general reader."}, {"id": "769", "title": "Graduate Admission School", "text": "Since our graduate admission school is not centralized, each of the university‘s 6 schools and colleges admits students to its own programs. For information about specific program degrees, graduate applications, graduate admission requirements and procedures, graduate scholarships and the status of your application, visit the individual school websites."}, {"id": "768", "title": "Central Aim", "text": "Our central aim is to enable you to develop knowledge and attitudes and skills that are conducive to constructive involvement, cooperation and teamwork with others and will serve you well in future endeavors. To succeed, the process demands all of us a serious exercise in civic responsibility."}, {"id": "767", "title": "Regular Exercise", "text": "Regular exercise releases brain chemicals key for memory, concentration, and mental sharpness at the same time as lifting your mood, and lowering stress and anxiety all of which contribute to brain health. Studies show that regular exercise helps you manage complex tasks, organize and razor-sharpen your focus which is great for those long revision sessions or particularly complex exam questions."}, {"id": "766", "title": "Medical Digitalization", "text": "In medicine, the application of information technology means the digitalization of medical records and the establishment of an intelligent network for sharing those records. Other benefits flow from these technological changes. In the past medicine has taken a paternalistic stance, with the all-knowing physician dispensing wisdom, but that is becoming increasingly untenable."}, {"id": "765", "title": "Walking Tour", "text": "The information session is a 45-minute presentation conducted by an admission representative. Immediately following the session is a 90-minute walking tour of the campus led by a student ambassador. Walking tours of the campus generally include classroom buildings, a residence hall room, a dining hall, the library, athletic facilities, performing art facilities, and the student union."}, {"id": "764", "title": "Infant Brain", "text": "Along with all that they have in common, infants also show unique individual traits. Some are more active than others, some are more sociable and some are more interested in the world around them. Infants earlier on show consistent differences in friendliness and anxiety level which form part of their early character."}, {"id": "763", "title": "Primitive Men", "text": "The findings of modern research support the view that the evolution of primitive men and its culture should be regarded as “unity”. Yet this unity is exceedingly complex, and future research will doubtless enable us to make finer distinctions between the periods that people composed it."}, {"id": "762", "title": "Venture Capitals", "text": "Venture capitals and public funding authorities need to carefully consider the incentive issues of entrepreneurs when providing support. In allocating resources to potentially competing innovators, there is a trade-off between the risk of innovation failure and rent dissipation: diverse investment lowers the risk of having no successful innovation but also reduces the expected profit from the post-innovation market."}, {"id": "761", "title": "Smart Cities", "text": "Smart cities are emerging as major engines for deploying intelligent systems to enhance urban development. In developing economies facing rapid urbanization and technological change, new cities are being built with smart technologies and ideals, complete with business districts and residential facilities to entice businesses and talents to relocate. Governments tout the potential of such ‘greenfield’ smart cities for innovation and sustainability."}, {"id": "760", "title": "Belt and Road Initiative", "text": "China’s Belt and Road Initiative is enhancing development prospects and creating new business opportunities in Asia, one of the world’s most dynamic regions. Announced in 2013, it is an ambitious plan to promote economic cooperation with countries around the world that has increasingly defined mainland China’s global engagement. The official goals are to promote connectivity: policy coordination, facilities connectivity, unimpeded trade, financial integration and people-to-people bonds."}, {"id": "759", "title": "Two-pronged Policy", "text": "After a pandemic with major social and economic consequences, emerging and developing countries need to swiftly address a two-pronged policy objective: sovereign debt sustainability and being able to fund investment, especially investment with high economic and social returns. So far, the international community has alleviated the liquidity strain among developing countries and quickened the mobilization of financial resources."}, {"id": "758", "title": "Consultants", "text": "Consultants are generally brought in on the important decisions that are vital to the future of the company, to make sure the every angle is considered. They can devote themselves entirely to the question at hand, while executives are normally busy with the actual running of the company. Consultants also offer deep expertise in a particular industry or subject, such as market positioning or restructuring."}, {"id": "757", "title": "Standardization", "text": "Standardization is the process of developing, promoting and possibly mandating standards-based and compatible technologies and processes within a given industry. Standards for technologies can mandate the quality and consistency of technologies and ensure their compatibility, interoperability and safety. A lack of standardization often manifests in large numbers of incompatible proprietary formats for a given technology and for technologies that must interoperate."}, {"id": "756", "title": "Hong Kong Development", "text": "Many stakeholders are concerned that Hong Kong is ‘losing its competitive edge’. A recent research report finds that non-positive interventionism no longer works and Hong Kong’s research funding model needs improvement. Hong Kong should rejuvenate technology development through high-level government leadership by informing government decision-making with professional and technical expertise, nurturing human capital and technological talent and facilitating innovation collaboration."}, {"id": "755", "title": "Satellite Imagery", "text": "Commercial satellite imagery is currently in a sweet spot: powerful enough to see a car, but not enough to tell the make and model; collected frequently enough for a farmer to keep tabs on crops’ health, but not so often that people could track the comings and goings of a neighbor. Federal regulations limit images taken by commercial satellites to a resolution of the length of a shoe."}, {"id": "754", "title": "Peptic Ulcer", "text": "The most common peptic ulcer symptom is burning stomach pain. Stomach acid makes the pain worse, as does having an empty stomach. The pain can often be relieved by eating certain foods that buffer stomach acid or by taking an acid-reducing medication, but then it may come back. The pain may be worse between meals and at night."}, {"id": "753", "title": "Topic", "text": "When you have selected a topic, you will first have to familiarize yourself with the topic in order to clarify it. In this way you will get a clearer idea of all aspects concerning the topic , definitions, facts and theories. You will get to know related terms and concepts, the context and the various possible ways of approaching the topic."}, {"id": "752", "title": "Films", "text": "Films can be compelling when used well. They have the power to change people’s perspectives and outlook on life. When we consider it in education, it has become one of the ideal teaching methods for various reasons. It helps to motivate learners to be more productive and look on a positive side of life."}, {"id": "751", "title": "Locomotion", "text": "Locomotion underpins a limitless array of animal behaviors and can be a rich source of inspiration for the design of modern machines. Movement requires mechanical interaction with the physical environment to monitor and control musculoskeletal systems that may be complex with many degrees of freedom. Recent advances in robotics have proven to be powerful in broadening our understanding of how animals run in a controlled manner."}, {"id": "750", "title": "Beauty", "text": "Beauty is subjective, and as such it of course cannot be defined in absolute terms. But we all know or feel when something is beautiful to us personally. And in such instances, methods of physics and network science can be used to quantify and help us better understand what it is that evokes that pleasant feeling."}, {"id": "749", "title": "Biodiversity Decline", "text": "Climate change and biodiversity decline are major challenges of our time. Both are predominantly caused by human activities, with profound consequences for people and the ecosystems on which we depend. Some actions we can undertake are beneficial in both areas, helping to mitigate and adapt to climate change as well as conserve and restore biodiversity."}, {"id": "748", "title": "Biological Processes", "text": "For centuries, the study of biological processes has inspired fundamental mathematical developments, while mathematical analyses have been instrumental in developing a mechanistic understanding of biological observations. This fruitful cross-fertilization has gained momentum over recent decades, thanks in part to extraordinary technological advancements in the biological sciences, as well as the rising availability of large scale computational resources."}, {"id": "747", "title": "Roman Army", "text": "There were two types of soldier in the Roman Army: the roman legionary and the auxiliaries. The legionaries were the very best soldiers and the auxiliaries were actually non-Roman citizens. Legionaries wore an undershirt made of linen and a woollen tunic. The linen helped the soldiers to stay cool while the wool helped to trap heat, keeping the soldiers warm."}, {"id": "746", "title": "Sea Breeze", "text": "The sea breeze is one of the most frequently occurring small-scale weather systems. It results from the unequal sensible heat flux of the lower atmosphere over adjacent solar-heated land and water masses. Owing to the large thermal inertia of a water body, during daytime the air temperature changes little over the water while over land the air mass warms."}, {"id": "745", "title": "Canceled Flights", "text": "New York, North Carolina and Iowa were some of the intended destinations of canceled flights that were supposed to leave from Southern California. Those areas are in the path of a winter storm that covered some neighborhoods with over a foot of snow and drenched others with freezing rain on Monday."}, {"id": "744", "title": "Digital Art", "text": "Digital art can be computer generated, scanned or drawn using a tablet and a mouse. Thanks to improvements in digital technology, it is possible to download video onto computers, allowing artists to manipulate the images they had filmed with a video camera. This gives artists a creative freedom, allowing them to cut and paste within moving images to create visual collages."}, {"id": "743", "title": "Archean Eon", "text": "During the Archean Eon, methane droplets in the air shrouded the young Earth in a global haze. There was no oxygen gas on Earth. Oxygen was only in compounds such as water. Complex chemical reactions in the young oceans transformed carbon-containing molecules into simple, living cells that did not need oxygen to live. Instead they made energy out of sulfur and other elements."}, {"id": "742", "title": "Winter Wheat", "text": "Although typically grown as a cash grain, winter wheat can provide most of the cover crop benefits of other cereal crops, as well as a grazing option prior to spring tiller elongation. Wheat also is slower to mature than some cereals, so there is no rush to kill it early in spring and risk compacting soil in wet conditions."}, {"id": "741", "title": "Biodegradable Polymers", "text": "Biodegradable polymers have been used as carriers in drug delivery systems for more than four decades. Early work used crude natural materials for particle fabrication, whereas more recent work has utilized synthetic polymers. The commercial success of these polymers has led to further research in the field aimed at bringing forward new formulation types for improved delivery of various small molecule and biologic drugs."}, {"id": "740", "title": "Domestic Cats", "text": "Domestic cats that are largely indoor hunt less than outdoor cats because they don’t have access to mice. In the wild, feral kittens are taught how to kill prey by their mothers. Domestic cats often fail to learn this skill, which is why you will see them \"playing\" with anything they catch, or they may bring the mouse to you to kill."}, {"id": "739", "title": "Solar Fuels", "text": "A solar fuels generation research program is focused on hydrogen production by means of reactive metal water splitting in a cyclic iron-based redox process. Iron-based oxides are explored as an intermediary reactive material to dissociate water molecules at significantly reduced thermal energies."}, {"id": "738", "title": "Nature and Cities", "text": "To thrive, cities must lean on nature. That means having open green spaces and interconnected waterways to prevent floods, green roofs and walls that reduce temperatures and produce food, and forests planted as green belts to oxygenate urban areas and regenerate ecosystems."}, {"id": "736", "title": "Palaeontology", "text": "The outsize influence of rich countries on palaeontology could lead to a warped view of life’s history, the researchers say. Researchers studying large-scale trends in palaeontology using resources are keenly aware that the fossil record is biased in myriad ways, including the age and type of rock in which fossils survive. But little consideration is given to the biases of the collectors themselves."}, {"id": "736", "title": "Voyage", "text": "A crew of scientists voyaged by ship from the southern tip of Chile into the frigid Antarctic to search for clues to one of the great unknowns of climate change. They planned to crisscross a remote patch of sea near the spot where, a year earlier, another crew had injected a tankful of an inert chemical one mile below the surface."}, {"id": "735", "title": "Mathematical Languages", "text": "The mathematical language for talking about connections, which usually depends on networks — vertices and edges — has been an invaluable way to model real-world phenomena. But a few decades ago, the emergence of giant data sets forced researchers to expand their toolboxes and, at the same time, gave them sprawling sandboxes to apply new mathematical insights."}, {"id": "734", "title": "Cow Feed", "text": "More than half of cow feed is actually grass, and farmers call it hay and silage. While people often think dairy cows are fed a high-grain diet, in reality they eat the leaves and stems from corn, wheat and oats far more often than they are eating grain, like corn kernels."}, {"id": "733", "title": "Timekeeping", "text": "Over the past five years, through studies of the simplest conceivable clocks, the researchers have discovered the fundamental limits of timekeeping. They’ve mapped out new relationships between accuracy, information, complexity, energy and entropy — the quantity whose incessant rise in the universe is closely associated with the arrow of time."}, {"id": "732", "title": "Bone Density", "text": "The bone density test is painless and quick. It estimates how dense or thick your bones are by using X-rays. The X-rays measure how much calcium and minerals are in a part of your bone. The more minerals you have, the better, which means your bones are stronger , denser, and less likely to break."}, {"id": "731", "title": "Black Hole", "text": "According to Einstein’s general theory of relativity, the gravity of a black hole is so intense that nothing can escape it. The more sophisticated understanding of black holes developed by Stephen Hawking and his colleagues did not question this principle . Hawking and others sought to describe matter in and around black holes using quantum theory, but they continued to describe gravity using Einstein’s classical theory."}, {"id": "730", "title": "Alien Life", "text": "No planet will have a complex form of life that popped into existence all on its own. Whatever life is like on an alien planet, it must have begun simply. But if life is to achieve any kind of complexity, the only way that complexity can accumulate is if favorable changes and innovations are retained and unfavorable ones are lost."}, {"id": "729", "title": "Vaccines and Wildlife", "text": "The idea of ‘self-disseminating’ vaccines has floated through epidemiological circles for decades, conceived mainly as a tool for protecting the health of wildlife. But evolutionary biologists have refreshed the proposal with evidence from their own modeling and other experimental work, which suggests that self-disseminating vaccines could be a safe and practical way to head off zoonotic pandemics as well."}, {"id": "728", "title": "Coffee", "text": "Coffee is a beloved beverage known for its ability to fine-tune your focus and boost your energy levels. In fact, many people depend on their daily cup of coffee when they wake up to get their day started on the right foot. In addition to its energizing effects, coffee has been linked to a long list of potential health benefits, giving you more reasons to get brewing."}, {"id": "727", "title": "Ants and Insulin", "text": "The scientists found that division of reproductive labor in ants arose when an ancient insulin signaling pathway, typically involved in maintaining nutrition and growth, became responsive to social cues. In doing so, they also uncovered deeper insights into a process underlying how the environment gets under the skin to affect behavior, physiology, and the health and well-being of other members of a society."}, {"id": "726", "title": "Babylon", "text": "Outside the biblical tradition, Babylon intrigued Greek and Roman writers, who added to the rich store of legends that have come down to the present day. Popular tales of Babylon’s fantastic structures may also be products of legends and confusion. Yet to historians and archaeologists, Babylon is a real bricks-and-mortar place at the center of the vibrant Mesopotamian culture."}, {"id": "725", "title": "Here Be Dragons", "text": "Medieval mapmakers supposedly inscribed the phrase “Here Be Dragons” on maps showing unknown regions of the world. Unfortunately, apart from an inscription on a globe, this claim is unfounded. Although there were no dragons, and the inscription “ Here Be Dragons” was virtually never used, some of the purported earliest mapmakers did have to deal with real and formidable megafauna."}, {"id": "724", "title": "Patriarch", "text": "A patriarchal family is one run by the father or eldest male of a household. He usually decides the duties of the women and children in the family. In this role, the patriarch solves family disputes and divides the family’s wealth. The patriarch is also the spiritual leader of the family because he is thought to be the closest to the spirits of the family’s ancestors."}, {"id": "723", "title": "Icehouse Structures", "text": "The icehouse structures, of which four still remain intact, are located south of Sultan Kala. These large, conically-domed earthen structures would have had sheets of ice built up on the ground level over the course of the winter to provide year-round ice supplies."}, {"id": "722", "title": "Coriolis Effect", "text": "Prevailing winds are winds that blow from a single direction over a specific area of the Earth. Areas where prevailing winds meet are called convergence zones. Generally, prevailing winds blow east-west rather than north-south. This happens because Earth’s rotation generates what is known as the Coriolis effect. The Coriolis effect makes wind systems twist counter - clockwise in the Northern Hemisphere and clockwise in the Southern Hemisphere."}, {"id": "721", "title": "Altimeter", "text": "A simple barometric altimeter includes a sealed metal chamber, a spring, and a pointer that shows altitude in meters or feet. The chamber expands as air pressure decreases and contracts as it increases, bending the spring and moving the pointer. An altimeter can be mounted on an aircraft’s instrument panel or worn on a person’s wrist."}, {"id": "720", "title": "Biomass", "text": "People have used biomass energy — energy from living things — since the earliest “cave men” first made wood fires for cooking or keeping warm. Biomass is organic, meaning it is made of material that comes from living organisms, such as plants and animals. The most common biomass materials used for energy are plants, wood, and waste."}, {"id": "719", "title": "Glucose", "text": "The body uses glucose as its main source of energy. Glucose comes from foods that contain carbohydrates, which is released and absorbed into the bloodstream after food is digested. The glucose in the bloodstream needs to move into body tissues so that cells can use it for energy. Excess glucose is also stored in the liver, or converted to fat."}, {"id": "718", "title": "Stratosphere", "text": "The stratosphere is the next layer up from Earth’s surface. Temperatures in the stratosphere increase with altitude. A high concentration of ozone, a molecule composed of three atoms of oxygen, makes up the ozone layer of the stratosphere. This ozone absorbs some of the incoming solar radiation, shielding life on Earth from potentially harmful ultraviolet light."}, {"id": "717", "title": "New Form of Carbon", "text": "A newly created form of carbon in a mesh just one atom thick is tantalising scientists with hints that it could sharply improve rechargeable batteries and allow wires so small that they can operate at a scale where metals fail. The material is highly conductive and may prove able to store more electrical energy than even graphene, the astonishing atomic-thickness carbon honeycomb material identified nearly 20 years ago."}, {"id": "716", "title": "Chemosignals", "text": "Studying how mouse brains process chemosignals will help researchers understand general principles of how their brains form social memories, and could help scientists identify what happens when these functions go wrong. Eventually this may help scientists understand what happens in people whose ability to recognize others is impaired or those who have difficulties with social interactions caused by autism."}, {"id": "715", "title": "Desalination", "text": "Desalination is the answer to long-term water security, but it’s also expensive and energy-intensive. The good news is that scientists are developing some viable solutions. The first desalination plant in Europe was built in Spain nearly a half century ago. Since then, facilities have sprung up in water-stressed regions throughout Europe."}, {"id": "714", "title": "Hydrogen Technology", "text": "Hydrogen will play several roles in our future. For transport, we now see several manufacturers launching cars powered by electricity produced in a hydrogen fuel cell, and this will happen even more in the near future. Fuel cell buses are also an attractive solution for public transport. Also engineers are now even starting to consider using fuel cells and hydrogen to power trains."}, {"id": "713", "title": "Turbine Blades", "text": "To withstand the forces of nature and the huge forces the rotation itself generates, blades are manufactured with a multilayer ‘coat of armour’. Typically, the outer layer erodes during operation and the inner layers can become detached. Although the lifespan of a turbine is theoretically 25 years, current medium-sized systems typically require extensive maintenance at about 10 years due to blade deterioration."}, {"id": "712", "title": "Online Speech and Politics", "text": "Online speech has become such an influential way of experiencing politics today — not just participating in democratic processes like elections — but also the way we lead our daily democratic life through digital communication. If these sorts of irreverent and vitriolic exchanges are so prominent online, then we need to see how we can bring nuance to understanding them."}, {"id": "711", "title": "Robotic System", "text": "The robotic system is composed of a floating platform with eight cables that are connected to a mobile robot that will move around on the seafloor beneath it to collect waste items in a box, using a gripper, hook or suction device depending on the size of the litter. The orientation of the robot can be controlled by adjusting the tension of the cables."}, {"id": "710", "title": "Disabled People and Technology", "text": "The use of technologies for the inclusion and empowerment of persons with disabilities is not new — from the creation of Braille and the first hearing aid to the invention of the wheelchair. For disabled persons, new assistive technology can make all the difference, while technology and innovation are breaking down the barriers to achieving full participation."}, {"id": "710", "title": "Train Noise", "text": "There are other components, aside from the wheels and rails, that add to the noise a train makes when it passes. Older trains had their air conditioning units underneath the carriage, but modern trains have been lowered to allow people with less mobility to enter the carriage more easily. As a result, air conditioning units are now on top of the carriage, where they add to the train noise."}, {"id": "709", "title": "Nebular Hypothesis", "text": "The most widely accepted model for planet formation, known as the nebular hypothesis, begins with a swirling disc of gas and dust — left over material from the birth of a nearby star. At some point in time, gravity triumphs over the pressure supporting this cosmic dust, which then starts to rotate, quickly collapsing under its own gravity."}, {"id": "708", "title": "Mutual Politics", "text": "In order to achieve the free flow of goods and services, with work and capital between the member countries, they needed to establish mutual politics in areas as diverse as agriculture, transport, and when they concerned with a far wider range of issues."}, {"id": "707", "title": "Personal Libraries", "text": "Scholars build their own personal libraries to support not only particular projects but also general reading in their field. They buy or make photocopies of materials when possible, so they can consult them frequently, mark pages and write annotation on them. When moving into a new field, they add to their collections, usually concentrating on primary texts."}, {"id": "706", "title": "Behavioral Science", "text": "Behavioral and social sciences research helps predict, prevent, and manage illness — in individuals and in whole populations. This research also helps people change their behaviors, understand treatments, and learn how to stick with them. Society's role is significant, too: access to health care affects decision making and behavior."}, {"id": "705", "title": "Undergraduates Education", "text": "Undergraduates may choose to major in any one of 125 academic majors. The universities distinguished faculty includes internationally known scientists, authors and teachers who are committed to continuing the university's tradition in providing one of the highest quality undergraduate educations available."}, {"id": "704", "title": "Lecture Beginning", "text": "Don't miss the beginning of the lecture since it is very often most valuable part, for instance, because it reviews previous lectures or outlines objects and lecture structure. If you easily get distracted by other students, sit near the front."}, {"id": "703", "title": "Antarctic", "text": "The world's fifth largest continent: Antarctica is almost entirely covered by ice 2000 meters thick. The area sustains varied wildlife including seals, whales, and penguins. The Antarctic treaty signed in 1959 and enforced since 1961 provides for international governance of Antarctica."}, {"id": "702", "title": "Loggerhead Turtle", "text": "It’s time for this young loggerhead turtle to go to work. We can tether turtles in these little cloth harnesses, put them into this tank and dull swimming place. University of North Carolina biologist Ken Loman studies sea turtles that are programed from birth for an extraordinary journey. Mother turtles buried the eggs on the beach and then returned to the sea and the eggs hatch about 50 to 60 days later."}, {"id": "701", "title": "Vanishing Teller Jobs", "text": "Technological advances are eliminating the need for bank tellers, threatening an entry point for women into the male-dominated industry which has sought to promote more females to leadership roles. While the climb remains steep, some financial companies have managed to improve the gender balance in their executive ranks. As teller jobs dwindle, there’s a risk that banks will raise the educational requirements for those jobs."}, {"id": "700", "title": "Inclined Plane", "text": "An inclined plane is a simple machine with no moving parts. It is simply an even sloping surface. It makes it easier for us to move objects to higher or lower surfaces than if we lifted the objects directly upwards. It is believed that ancient Egyptians used inclined planes to carry heavy stones to build pyramids."}, {"id": "699", "title": "Vegetative Cover", "text": "The root systems of vegetative cover hold soils in place and prevent wind and water erosion. It also ensures its supply of organic matter from dead leaves and the dropping of animal waste. The vegetative cover also shelters the soils from excessive heat from the sun. It helps to reduce evaporation and retain soil moisture needed for the breakdown of organic matter."}, {"id": "698", "title": "Fall Colors", "text": "Relish the fall colors while you can. Scientists think that the rich reds, oranges and yellows of fall may be one of the many casualties of global warming. Leaves change color in part because of cues taken from dropping temperatures. As temperatures remain warmer through fall and winter nights, they could delay the beloved fall color shift."}, {"id": "697", "title": "Tipping Etiquette", "text": "Travel planning is all about the details. But while you may be a master at uncovering the cleanest hotels and practicing proper airplane etiquette, there’s an element of being a guest that stumps even the savviest of travelers. Tipping etiquette — who to tip and how much of a tip to give — can be confusing."}, {"id": "696", "title": "Trees and Winter", "text": "The shorter days are a sign to trees to begin to prepare for winter. During winter there is not enough light for photosynthesis to occur, so as the days shorten throughout autumn, the trees begin to close down their food production systems and reduce the amount of chlorophyll in their leaves."}, {"id": "695", "title": "Misinformation", "text": "Misinformation is everywhere. It can be spread inadvertently if people make a genuine mistake. In today’s environment, people get much of their news from social media, which lacks gate-keepers and therefore allows misinformation to spread fast and wide. People are being bombarded with information and it has become difficult for them to separate fact from fiction."}, {"id": "694", "title": "Geosphere", "text": "The geosphere includes all the stuff that makes up the crust and the core of the earth, and everything natural and lifeless that makes up the surface of the earth. Examples are all the rocks and sand particles from dry land to those found at the bottom of the oceans. The geosphere undergoes infinite processes constantly, which in turn modifies other spheres."}, {"id": "693", "title": "Menopause Data", "text": "“Despite the fact that every woman goes through menopause, there’s not enough research,” Anna says. “Our scientific understanding of menopause is vastly limited due to the lack of data. Menopausal changes are correlated with women’s cardiovascular, cognitive, and overall health, so a database will allow us to better understand these connections.”"}, {"id": "692", "title": "Coastal Ecosystems", "text": "Many scientists examining human impacts on coastal ecosystems have focused on agricultural runoff, because fertilizers that wash into the sea carry massive amounts of nutrients and pathogens that can harm marine environments. But the impacts of human sewage receive far less attention. Part of the reason may be that, unlike trash or oil spills, sewage can be invisible in the water."}, {"id": "691", "title": "Minerals", "text": "Minerals are important for your body to stay healthy. Your body uses minerals for many different jobs, including keeping your muscles, heart and brain working properly. Minerals are also important for making enzymes and hormones. Most people get the amount of minerals they need by eating a wide variety of foods. If the intake is not enough, doctors may recommend a mineral supplement."}, {"id": "690", "title": "Family Size", "text": "The world's poorest countries tend to have the largest family sizes and fertility rates. When people have no economic security and cannot rely on their government, they often have children to ensure they will be looked after when they are older. Where child mortality is high, there is an even greater impetus to have more children."}, {"id": "689", "title": "Magnetic Field", "text": "The magnetic field is a vector field - at each point it has a magnitude and direction. The direction is defined as the direction of the force that a magnetic north pole would feel at that point. Since like poles repel and opposite poles attract, this means that the magnetic field goes away from the north pole of a magnet and towards the south pole."}, {"id": "688", "title": "Arms Races", "text": "Arms races may involve a more general competitive acquisition of military capability. This is often measured by military expenditure, although the link between military expenditure and capability is often quite weak. Such more general arms races are often observed among countries engaged in enduring rivalries, which may sometimes appear to follow each other’s military spending levels."}, {"id": "687", "title": "Poverty Reduction Strategy", "text": "Canada's first-ever Poverty Reduction Strategy is built on the vision that all Canadians should be able to live in dignity. It is also built on the belief that all Canadians deserve to be treated fairly and fully participate in the development of their communities. To be effective, the strategy must have transparent indicators, clear targets and tangible actions."}, {"id": "686", "title": "Occupational Therapy", "text": "Occupational therapy helps people of all ages who have physical, sensory or cognitive problems. It can help them regain independence in all areas of their lives. Occupational therapists help with barriers that affect a person's emotional, social and physical needs. They also help kids to improve their school performance, and aid their daily activities. It also boosts their self-esteem and sense of accomplishment."}, {"id": "685", "title": "Calendars", "text": "Archaeologists have reconstructed methods of timekeeping that go back to prehistoric times at least as old as the Neolithic. The natural units for timekeeping used by most historical societies are the day and the solar year. Calendars are explicit schemes used for timekeeping. The first historically attested calendars date to the Bronze Age, dependent on the development of writing in the ancient Near East."}, {"id": "684", "title": "Nuclear Systems", "text": "Designers of new nuclear systems are adopting novel approaches in the attempt to attain success. First, they are utilizing a nuclear fuel cycle that encompasses steps from the mining of ore to the management of wastes. Second, they are evaluating systems in terms of their sustainability - meeting present needs without jeopardizing the ability of future generations to prosper."}, {"id": "683", "title": "Gender Inequality", "text": "Gender inequality is one of the oldest and most pervasive forms of inequality in the world. It denies women their voices and devalues their work. Despite some important progress to change this in recent years, in no country have women achieved economic equality with men, and women are still more likely to live in poverty."}, {"id": "682", "title": "Lecture", "text": "A lecture tends to be a one-sided class where you and your fellow students will sit and take notes while a lecturer talks about a specific topic or gives a presentation. This class is information- heavy so taking notes is essential and there may be little time to ask questions. Lectures are the main method for your university to teach you the necessary material."}, {"id": "681", "title": "Tea and Sugar", "text": "Like coffee, plain tea contains just a couple of calories per cup and no sugar. But what’s added in it can change that situation. A medium sweet tea and a large iced latte from fast food restaurants both pack about seven teaspoons of sugar. However, the American Heart Association recommends no more than six teaspoons for the whole day."}, {"id": "680", "title": "Itchy Hands and Feet", "text": "When your hands and feet itch, the right treatment can bring you some relief. How you treat the itching, though, depends a lot on the cause of the problem. It may just be dry skin, which can be brought on by winter weather or too much scrubbing. But sometimes, itchy hands and feet can signal another health condition."}, {"id": "679", "title": "Onion", "text": "Varieties of onion differ in size, strength and colour. The yellow onion is the most commonly known variety, which has pale golden skin, greenish-white flesh and a strong taste. Red onions are an attractive, milder alternative to the yellow onion with their shiny purple skin. Spring onions are immature onions pulled before the bulb is fully formed, and can be recognised by their long green leaves."}, {"id": "678", "title": "Advanced Robotics", "text": "Advanced Robotics is the international journal of the Robotics Society of Japan and has a history of more than thirty three years. It is an interdisciplinary journal which integrates publication of all aspects of research on robotics science and technology. Advanced Robotics publishes original research papers and survey papers from all over the world."}, {"id": "677", "title": "Facial Expressions", "text": "Being able to understand and interpret facial expressions is a big part of non-verbal communication skills. There are often times in conversations when just listening to the words that someone is saying will only tell you half of the story. Words don't always match how we feel, and our facial expressions often have a habit of giving us away."}, {"id": "676", "title": "Films", "text": "Since their emergence, films have played a significant role in the lives of people around the world. Movies have the power to share new ideas and teach lessons about the past or future. Sometimes, films only exist to entertain us. Just like there are many different styles of art, there are many different styles of film."}, {"id": "675", "title": "Globalization", "text": "The benefits and disadvantages of globalization are the subject of ongoing debate. The downside to globalization can be seen in the increased risk for the transmission of diseases. Globalization has of course led to great good, too. Richer nations now can come to the aid of poorer nations in crisis. Increasing diversity in many countries has meant more opportunity to learn about and celebrate other cultures."}, {"id": "674", "title": "Decline of News Coverage", "text": "A typical fence with a few wires allows most animals – such as lions or wild dogs — to go over, under or through it. For larger mammals, such as elephants and giraffes, we will create large fence-gaps that consist of a sloping, loose rock wall. Because of rhinos’ short , stubby legs, they are unable to scale these rock piles."}, {"id": "672", "title": "Africa Disease Centre", "text": "Africa Centres for Disease Control and Prevention is a specialized technical institution of the African Union established to support public health initiatives of Member States and strengthen the capacity of their public health institutions to detect, prevent and respond quickly and effectively to disease threats. It supports African Union Member States in providing coordinated and integrated solutions to the inadequacies in their public health infrastructure."}, {"id": "671", "title": "Workplace Diversity", "text": "Workplace diversity means respecting and valuing the skills and differences that each staff member brings into the workspace. A diverse workplace is an inclusive environment that provides equal rights and opportunities for all workers. In Australia, it is law for workplaces to create a workplace free from discrimination and harassment."}, {"id": "670", "title": "Rock", "text": "Most rocks are made of minerals containing silicon and oxygen, the most abundant elements in the Earth’s crust. There are three kinds of rock: igneous, sedimentary and metamorphic. Igneous rocks form when molten rock cools and solidifies. Sedimentary rocks originate when particles settle out of water or air. Metamorphic rocks result when existing rocks are changed by heat or pressure."}, {"id": "669", "title": "Literacy", "text": "Strong literacy aligns with the ways that individuals learn and socially interact. It forms the foundation for a lifetime of communication with family, peers, and employers. Ensuring strong reading and writing skills in the early stages of a child’s development is vitally important to preventing problems later in life, such as unemployment, societal disconnection, and even justice system involvement."}, {"id": "668", "title": "Bananas and Potassium", "text": "Bananas are rich in the mineral potassium. Potassium helps maintain fluid levels in the body and regulates the movement of nutrients and waste products in and out of cells. Potassium also helps muscles to contract and nerve cells to respond. It keeps the heart beating regularly and can reduce the effect of sodium on blood pressure. Potassium may reduce the risk of kidney stones forming as people age."}, {"id": "667", "title": "Infectious Diseases", "text": "The threat from infectious pathogens is greater today than ever. The outbreak or even resurgence of infectious diseases has shown how these types of diseases could in fact undermine a state’s control of what happens within its territory. Yet, it is unclear whether growing recognition of the severity of the threat of infectious diseases has led to adequate policy responses and definitive action by states."}, {"id": "666", "title": "Data Accuracy", "text": "Stakeholder acceptance and use of analytics depends on their trust in the data. End users and executives don’t always think about the behind-the-scenes work and preparation that went into a dashboard. But they do have an intuitive grasp of and even an emotional connection to accurate data, making obviously inaccurate data a real challenge to overcome."}, {"id": "665", "title": "Breaking Habits", "text": "Breaking habits is very difficult. The easiest way is to control your environment so that you do not encounter the cue which triggers your habit. It is difficult to break any habit even when you are motivated to do so. If you are ambivalent about breaking it, then you will be less likely to succeed."}, {"id": "664", "title": "TV Shows", "text": "One of the benefits of watching the television shows is that you will get to learn and appreciate the different cultures. As a movie enthusiast, you will watch different movies of different actors who originate in different countries. This will give you a wider perspective of the various cultures, and you are likely to appreciate the contribution being made by individuals in different parts of the world."}, {"id": "663", "title": "Toy Play", "text": "There is ample evidence that toy play is a very important aspect of child development. Children of all ages enjoy playing with toys and the different roles they play in their fantasy and make-believe games, but toys are more than simple playthings. Many toys offer hands-on learning opportunities that can instill basic skills that will benefit them for the rest of their lives."}, {"id": "662", "title": "Neuroscience", "text": "Neuroscience has traditionally been classed as a subdivision of biology. Many researchers say that neuroscience means the same as neurobiology. However, neurobiology looks at the biology of the nervous system, while neuroscience refers to anything to do with the nervous system. Neuroscientists are involved in a much wider scope of fields, who study the evolutionary and medical aspects of the nervous system."}, {"id": "661", "title": "Agricultural Science", "text": "While advances in agricultural science have always been critical to ensuring we help feed the world, its impact and importance is even greater now, as population grows at a rapid rate and the availability of arable land steadily declines. Science and technology solutions are essential to meeting growing demand for food, maintaining market competitiveness and adapting to land mitigating risks."}, {"id": "660", "title": "Cat's Age", "text": "Despite the youthful outward appearance, inside the cat will be getting older. It is much easier to understand how to manage our cats’ lives, health and behaviour if we can associate their age with an equivalent of our own human years. It has often been suggested that we simply need to multiply a cat’s age by seven to get a comparative human age."}, {"id": "659", "title": "Microscope", "text": "The principal way a microbiologist studies microorganisms is by observing them through a microscope. A microscope is a device that enlarges objects using a process called magnification. The simplest form of a microscope is a magnifying glass consisting of a single lens. Some glasses are slightly bent at the bottom, causing a magnifying effect if held at a certain height over an object."}, {"id": "658", "title": "Dark Matter", "text": "Dark matter is an elusive substance that provides the skeleton for what cosmologists call the cosmic web, the large-scale structure of the universe that, due to its gravitational influence, dictates the motion of galaxies and other cosmic material. However, the distribution of local dark matter is currently unknown because it cannot be measured directly."}, {"id": "657", "title": "Friends", "text": "The people we know resemble us in the most basic social characteristics, such as gender and educational background. Although our friends tend to be similar, many people are unaware of this because they did not pick their friends for their similarity. Our social connections depend first and foremost on whom we get to meet. This depends on the social contexts we enter and the activities we engage in."}, {"id": "656", "title": "Take A Break", "text": "'Take A Break' is a program that encourages teens who have signed up for it to log off after they have been on the platform for a certain amount of time. Starting Tuesday, the feature is available to any users between the ages of thirteen and eighteen based on how they self-reported when they signed up for Instagram."}, {"id": "656", "title": "Heart Disorders", "text": "In the past decades, dramatic changes in diet and lifestyle have fueled a rampant increase in heart disorders. What is even more alarming is that heart conditions are no longer restricted to higher age groups, but affect young people as well. Heart disorders like strokes are the most commonly known today and its symptoms include chest pain, weakness and heart attack."}, {"id": "655", "title": "Technologies", "text": "Technology strengthens learning and dominates over the conventional methods in too many aspects. Technologies are advancing learning procedure by their multiple formats, variety of resources, numerous delivery channels and not restricted to time, space and place. Social media is a new form of communication that transformed the entire landscape of information access and dissemination online."}, {"id": "654", "title": "Procrastination", "text": "To overcome procrastination you need to have an understanding of the reasons why you procrastinate and the function procrastination serves in your life. You can't come up with an effective solution if you don't really understand the root of the problem. As with most problems, awareness and self-knowledge are the keys to figuring out how to stop procrastinating."}, {"id": "653", "title": "Microorganisms", "text": "Identification and characterisation of microorganisms is a key part of the management of food safety and quality, tracing contaminants and troubleshooting problems such as spoilage. Knowing how to identify bacteria or other unknown microorganisms that you have encountered can help to assess whether it poses a safety concern or is likely to be heat resistant, for example."}, {"id": "652", "title": "Connective Tissue Cells", "text": "Connective tissue cells provide structural strength to the body and also defend against foreign invaders like bacteria. Two types of cells are native to connective tissue. Other cells migrate into connective tissue from the bloodstream to fight diseases. Special types of connective tissue are designed to be stronger and more rigid than most connective tissues."}, {"id": "651", "title": "A Balanced Budget", "text": "Most state governments are subject to a requirement to pass a balanced budget. However, a budget that may fit the statutory definition of a \"balanced budget\" may not be financially sustainable. For example, a budget that is balanced by such standards could include the use of non-recurring resources, such as asset sales or reserves, to fund ongoing expenditures, and thus not be in structural balance."}, {"id": "650", "title": "Enthusiasm", "text": "Enthusiasm seeks to contribute to a culturally and historically nuanced understanding of how emotions secure and ratify the truth of convictions. More than just pure affective intensity, enthusiasm is about something: a certainty, clarity or truth. Enthusiasm takes its starting point in religion, the social arena in which the concept was first debated and to which the term still gestures."}, {"id": "649", "title": "COVID-19", "text": "Currently in South Australia, the majority of people who have a positive COVID-nineteen test result will stay in the community in their home or in supervised or supported care. A team of health professionals will carry out an assessment and ask you a series of questions, including identifying your symptoms, your medical history and if you can safely isolate away from others."}, {"id": "648", "title": "A Better Government Plan", "text": "A better government plan is based on the assumption that government has a positive role to play in improving people’s lives but could perform this function far more effectively than it does now. What distinguishes the better government plan from the other two is that instead of changing the size of government, it reallocates spending in ways designed to improve government performance."}, {"id": "647", "title": "The Astrophysics Division", "text": "In the Science Mission Directorate, the Astrophysics Division studies the universe. The science goals of this division are breathtaking: we seek to understand the universe and our place in it. We are starting to investigate the very moment of creation of the universe and are close to learning the full history of stars and galaxies. We are discovering how planetary systems form and how environments develop."}, {"id": "646", "title": "Sexual Selection", "text": "Usually, the female of the species invests more in parenting. Females of many species choose their mates based on certain characteristics, such as large canine teeth in a male baboon or flashy tail feathers on a peacock, which in turn means those traits will be passed on to their male offspring. Biologists call this process sexual selection, which is related to natural selection."}, {"id": "645", "title": "Pig-nosed Turtle", "text": "Scientists have discovered a five-million-year-old pig-nosed turtle fossil in Melbourne, thousands of kilometers south of their typical home. Pig-nosed turtles tend to be found in tropical freshwater ecosystems in northern Australia and New Guinea, only arriving here a few thousand years ago. The creatures are now endangered and the sole survivors of an extinct group of tropical turtles from the northern hemisphere."}, {"id": "643", "title": "How the Eye Works", "text": "In a normal eye, the light rays come to a sharp focusing point on the retina. The retina functions much like the film in a camera. It is responsible for capturing all of the light rays, processing them into light impulses through millions of tiny nerve endings, then sending these light impulses through over a million nerve fibers to the optic nerve."}, {"id": "641", "title": "Thomas Edison", "text": "Thomas Edison used his access to the railroad to conduct chemical experiments in a small laboratory he set up in a train. During one of his experiments, a chemical fire started and the train caught fire. The conductor rushed in and struck Edison on the side of the head, probably furthering some of his hearing loss."}, {"id": "640", "title": "The Spanish Language", "text": "The Spanish language has a rich and complicated history. It has navigated the rise and fall of great empires, has been a symbol of cultural identity, and has both been used as a tool of unity and caused considerable divisiveness. Today, it is the world’s second-most spoken native language and is used by people in all corners of the globe."}, {"id": "639", "title": "Healthy Eating", "text": "The American Cancer Society recommends following a healthy eating pattern at all ages. A new school year is the perfect time to try some healthier options for your child. Whether you’re packing a lunch box or making lunch at the kitchen counter, you can ensure they’re eating healthy food that tastes good."}, {"id": "638", "title": "Hydropower", "text": "Hydropower is one of the renewable energies. In the past, hydropower was used for simple purposes by building a water wheel on a watercourse and using it to drive a mill or machine. Today this is how it works: the kinetic energy of the flowing water is converted into the mechanical energy of the turbine, which is converted into electrical energy, or electricity for short, in a generator."}, {"id": "637", "title": "Australian Immigration", "text": "Australia has a proud modern immigration history. Government discrimination has been banished, replaced by a skills-based system generating unparalleled economic gain for Australia. Creating an environment where innovation can thrive depends on immigration. With a population where one in four people are born overseas, Australia is already well positioned to kick start a new period of growth."}, {"id": "636", "title": "Dead Language", "text": "A dead language may still be studied through recordings or writings, but it is still dead or extinct unless there are fluent speakers. Although languages have always become extinct throughout human history, they are currently dying at an accelerated rate because of globalization. Many projects are under way aimed at preventing or slowing language loss."}, {"id": "635", "title": "IT Unit", "text": "This unit provides a practical and theoretical introduction to what it means to be an IT professional today. Students will encounter a range of issues relevant to professional practice in the workplace, as well as an understanding of the wider responsibilities that professionals are called upon to uphold in society."}, {"id": "634", "title": "Bilingualism", "text": "There are many benefits to bilingualism and exposure to multiple languages. Children who learn multiple languages learn to be sensitive to their conversation partners; they make word and language choices based on their knowledge of others. These are sophisticated social decisions that show advanced social skills."}, {"id": "633", "title": "Interdisciplinarity", "text": "Interdisciplinarity refers to a method that merges traditional educational concepts in order to arrive at new approaches. It is an increasingly important concept within both academic research and the private sector. More than just pasting together different subjects, interdisciplinary work is the process of developing an integration of methods that are traditionally thought of as separate fields."}, {"id": "632", "title": "Stars", "text": "Stars are the most widely recognized astronomical objects, and represent the most fundamental building blocks of galaxies. The age and composition of the stars in a galaxy trace the dynamics and evolution of that galaxy. Consequently, the study of the birth, life, and death of stars is central to the field of astronomy."}, {"id": "631", "title": "Fine Arts Department", "text": "At the Fine Arts Department, we place dual emphasis on studio art and art history, and are dedicated to the exploration of contemporary art while promoting traditional Chinese art and culture. Our department has been a strategic base for training up artists and art historians, and has made significant contribution to the field of art nationally and internationally."}, {"id": "630", "title": "Skylines", "text": "If you live in a city, you may take your skyline for granted, but let me remind you how cool it is. Skyscrapers are amazing feats of engineering and a testament to humankind's progress. What's more, skylines offer an array of architectural styles, as cities certainly weren't built in a day."}, {"id": "629", "title": "Engineering", "text": "Engineering requires many building blocks and tools. To produce real world results, one must practically apply mathematics and sciences to tangible problems and scenarios. Included in this category are the various technical topics which cut across engineering disciplines, encompassing many branches of mathematics and scientific disciplines."}, {"id": "628", "title": "Food Crops", "text": "Feed crops are grown and harvested to feed livestock like cows and horses. Also known as animal feed, these crops can be grown and harvested like food crops. They can also be grown in large fields where animals can graze for the food. Feed crops are typically engineered to meet the livestock’s specific nutritional needs."}, {"id": "627", "title": "Genetically Modified Cotton", "text": "Cotton plants native to Mexico may all look the same — unkempt and untamed bushes with flowers that shift from pale yellow to violet as pollinators visit them. But genes from genetically modified cotton crops have made some of these native plants fundamentally different, changing their biology and the way they interact with insects."}, {"id": "626", "title": "Disaster by Climate Change", "text": "Flooding is already the most common natural disaster in the United States, occurring in every state and killing more people each year than hurricanes, tornadoes or lightning. As warming drives sea levels higher and intensifies hurricanes, more residents should expect to deal with flooding."}, {"id": "625", "title": "The Reptiles’ Cold Tolerance", "text": "After the coldest night in south Florida in a decade, lizards were dropping out of palm trees, landing legs up. The scientists who raced to investigate the fallen reptiles have now found that, despite such graceless falls, some of these tropical, cold-blooded creatures are actually more resilient to cold than previously thought."}, {"id": "624", "title": "Windbreaks", "te
